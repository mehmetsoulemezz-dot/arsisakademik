function ForumYeniKonu({user, onGonder}) {
  const titleRef=useRef(null);
  const bodyRef=useRef(null);
  const [busy,setBusy]=useState(false);
  const gonder=async()=>{
    const title=titleRef.current?.value?.trim();
    const body=bodyRef.current?.value?.trim();
    if(!title||!body){alert("Konu ve mesaj zorunludur.");return;}
    setBusy(true);
    await onGonder(title,body);
    titleRef.current.value="";bodyRef.current.value="";
    setBusy(false);
  };
  return(
    <div style={{background:C.cream,borderRadius:12,padding:"22px 26px",marginBottom:24,border:`1px solid ${C.border}`}}>
      <div style={{fontFamily:"'Cinzel',serif",fontSize:11,color:C.rust,letterSpacing:1.5,marginBottom:14}}>YENİ KONU AÇ</div>
      <input ref={titleRef} placeholder="Konu başlığı *" style={{...INP,marginBottom:10}}/>
      <textarea ref={bodyRef} placeholder="Mesajınızı yazın *" rows={4}
        style={{...INP,height:100,resize:"vertical"}}/>
      <button onClick={gonder} disabled={busy}
        style={{background:C.ink,color:C.gold,border:"none",padding:"10px 26px",borderRadius:7,cursor:"pointer",fontFamily:"'Cinzel',serif",fontSize:11,fontWeight:700,letterSpacing:1,opacity:busy?0.6:1}}>
        {busy?"GÖNDERİLİYOR...":"GÖNDER"}
      </button>
    </div>
  );
}

function ForumPost({post,user,onYanitGonder}) {
  const [replies,setReplies]=useState([]);
  const [acik,setAcik]=useState(false);
  const ref=useRef(null);
  const [busy,setBusy]=useState(false);

  useEffect(()=>{
    if(acik){
      supa.from("forum_replies").select("*").eq("post_id",post.id).order("created_at",{ascending:true})
        .then(({data})=>{if(data)setReplies(data);});
    }
  },[acik,post.id]);

  const yanıtEkle=async()=>{
    const text=ref.current?.value?.trim();
    if(!text)return;
    setBusy(true);
    await supa.from("forum_replies").insert([{post_id:post.id,body:text,author:user.name,author_email:user.email}]);
    ref.current.value="";
    const{data}=await supa.from("forum_replies").select("*").eq("post_id",post.id).order("created_at",{ascending:true});
    if(data)setReplies(data);
    setBusy(false);
  };

  return(
    <div style={{border:`1px solid ${C.border}`,borderRadius:12,marginBottom:12,overflow:"hidden"}}>
      <div style={{background:"#fff",padding:"15px 20px",cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:12}} onClick={()=>setAcik(!acik)}>
        <div style={{flex:1}}>
          <div style={{fontFamily:"'Cinzel',serif",fontSize:13,fontWeight:700,color:C.ink,marginBottom:4}}>{post.title}</div>
          <div style={{fontSize:11,color:C.muted,fontStyle:"italic"}}>
            {post.author} · {post.created_at?.split("T")[0]}
            {replies.length>0&&<span style={{marginLeft:8,color:C.teal,fontWeight:700}}>{replies.length} yanıt</span>}
          </div>
        </div>
        <span style={{color:C.gold,fontSize:14,flexShrink:0}}>{acik?"▲":"▼"}</span>
      </div>
      {acik&&(
        <div>
          <div style={{background:`${C.gold}06`,padding:"14px 20px",borderTop:`1px solid ${C.border}`}}>
            <p style={{margin:0,fontSize:14,color:"#444",lineHeight:1.8,whiteSpace:"pre-wrap"}}>{post.body}</p>
          </div>
          {replies.map((r,i)=>(
            <div key={r.id} style={{padding:"12px 20px",borderBottom:i<replies.length-1?`1px solid ${C.border}44`:"none",background:r.author_email===user?.email?"#fff":C.cream}}>
              <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:5}}>
                <div style={{width:24,height:24,borderRadius:"50%",background:r.author_email===user?.email?C.rust:C.teal,display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontSize:10,fontWeight:700}}>
                  {r.author[0]}
                </div>
                <span style={{fontFamily:"'Cinzel',serif",fontSize:10,fontWeight:700,color:r.author_email===user?.email?C.rust:C.teal}}>
                  {r.author_email===user?.email?"Siz":r.author}
                </span>
                <span style={{fontSize:10,color:C.muted}}>{r.created_at?.split("T")[0]}</span>
              </div>
              <p style={{margin:"0 0 0 32px",fontSize:13.5,color:"#444",lineHeight:1.7}}>{r.body}</p>
            </div>
          ))}
          <div style={{background:C.paper,borderTop:`1px solid ${C.border}`,padding:"12px 20px",display:"flex",gap:10}}>
            <input ref={ref} placeholder="Yanıtınızı yazın..."
              style={{flex:1,padding:"8px 12px",border:`1.5px solid ${C.border}`,borderRadius:6,fontSize:13,outline:"none",background:"#fff",color:C.ink}}
              onKeyDown={e=>{if(e.key==="Enter")yanıtEkle();}}/>
            <button onClick={yanıtEkle} disabled={busy}
              style={{background:C.gold,color:C.ink,border:"none",padding:"8px 18px",borderRadius:6,cursor:"pointer",fontFamily:"'Cinzel',serif",fontSize:10,fontWeight:700,opacity:busy?0.6:1}}>
              ↩ YANIT
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

/* ── MESAJLAŞMA SİSTEMİ ── */
function MessagesTab({user, t, articles, toast_}) {
  const [messages, setMessages] = useState([]);
  const [selectedArticle, setSelectedArticle] = useState("");
  const [msgText, setMsgText] = useState("");
  const [replyText, setReplyText] = useState({});
  const [busy, setBusy] = useState(false);

  const isEditor = user?.role === "editor";

  const loadMessages = useCallback(async()=>{
    let q = supa.from("editor_messages").select("*").order("created_at",{ascending:false});
    if(!isEditor){
      q = q.eq("author_email", user.email);
    }
    const{data}=await q;
    if(data) setMessages(data);
  },[user, isEditor]);

  useEffect(()=>{ loadMessages(); },[loadMessages]);

  const sendMessage = async()=>{
    if(!msgText.trim()) return;
    if(isEditor && !selectedArticle){ toast_("Makale seçin","err"); return; }
    setBusy(true);
    const art = isEditor ? articles.find(a=>a.id===selectedArticle) : null;
    await supa.from("editor_messages").insert([{
      from_editor: isEditor,
      from_name: user.name,
      from_email: user.email,
      author_email: isEditor ? art?.author_email : user.email,
      author_name: isEditor ? art?.author : user.name,
      article_id: isEditor ? selectedArticle : null,
      article_title: isEditor ? art?.title : null,
      body: msgText.trim(),
      parent_id: null,
    }]);
    setMsgText(""); setSelectedArticle("");
    await loadMessages();
    setBusy(false);
    toast_(t.msg_sent);
  };

  const sendReply = async(parentId, parentAuthorEmail, parentArticleId, parentArticleTitle)=>{
    const text = replyText[parentId]?.trim();
    if(!text) return;
    await supa.from("editor_messages").insert([{
      from_editor: isEditor,
      from_name: user.name,
      from_email: user.email,
      author_email: isEditor ? parentAuthorEmail : user.email,
      author_name: isEditor ? "" : user.name,
      article_id: parentArticleId,
      article_title: parentArticleTitle,
      body: text,
      parent_id: parentId,
    }]);
    setReplyText(prev=>({...prev,[parentId]:""}));
    await loadMessages();
    toast_(t.msg_reply_sent);
  };

  // Grup mesajları: üst mesaj + yanıtlar
  const rootMessages = messages.filter(m=>!m.parent_id);
  const getReplies = (parentId)=> messages.filter(m=>m.parent_id===parentId);

  // Yazara göre grupla (yazar görünümü için)
  const myMessages = isEditor ? rootMessages : rootMessages.filter(m=>m.author_email===user.email || m.from_email===user.email);

  return(
    <div>
      <h3 style={{fontFamily:"'Cinzel',serif",margin:"0 0 20px",fontSize:17,letterSpacing:1,color:C.ink}}>
        {t.admin_msg_title}
      </h3>

      {/* Yeni mesaj formu */}
      <div style={{background:C.cream,borderRadius:12,padding:"22px 26px",marginBottom:28,border:`1px solid ${C.border}`}}>
        <div style={{fontFamily:"'Cinzel',serif",fontSize:11,color:C.rust,letterSpacing:1.5,marginBottom:14}}>
          {isEditor ? t.msg_to_author : "EDİTÖRE MESAJ GÖNDER"}
        </div>
        {isEditor && (
          <select value={selectedArticle} onChange={e=>setSelectedArticle(e.target.value)}
            style={{...INP,marginBottom:10}}>
            <option value="">Makale Seçin *</option>
            {articles.map(a=>(
              <option key={a.id} value={a.id}>{a.title} — {a.author}</option>
            ))}
          </select>
        )}
        <textarea value={msgText} onChange={e=>setMsgText(e.target.value)}
          placeholder={isEditor ? t.msg_placeholder : "Editöre iletmek istediğiniz mesajı yazın..."}
          rows={3} style={{...INP,height:90,resize:"vertical"}}/>
        <button onClick={sendMessage} disabled={busy}
          style={{background:C.ink,color:C.gold,border:"none",padding:"10px 26px",borderRadius:7,cursor:"pointer",fontFamily:"'Cinzel',serif",fontSize:11,fontWeight:700,letterSpacing:1,opacity:busy?0.6:1}}>
          {busy?"GÖNDERİLİYOR...":t.msg_send}
        </button>
      </div>

      {/* Mesaj listesi */}
      <div style={{fontFamily:"'Cinzel',serif",fontSize:11,color:C.muted,letterSpacing:1.5,marginBottom:14}}>{t.msg_inbox}</div>
      {myMessages.length===0 ? (
        <div style={{textAlign:"center",padding:"40px",color:C.muted,fontStyle:"italic",background:C.cream,borderRadius:12,border:`1px solid ${C.border}`}}>
          {t.no_messages}
        </div>
      ):myMessages.map(msg=>{
        const replies=getReplies(msg.id);
        return(
          <div key={msg.id} style={{border:`1px solid ${C.border}`,borderRadius:12,marginBottom:14,overflow:"hidden"}}>
            {/* Ana mesaj */}
            <div style={{background:"#fff",padding:"16px 20px"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
                <div>
                  <span style={{fontFamily:"'Cinzel',serif",fontSize:11,fontWeight:700,color:msg.from_editor?C.teal:C.rust}}>
                    {msg.from_editor?"Editör → ":"Yazar → "}{msg.from_editor?(msg.author_name||"Yazar"):msg.from_name}
                  </span>
                  {msg.article_title&&<span style={{fontSize:11,color:C.muted,marginLeft:8,fontStyle:"italic"}}>· {msg.article_title}</span>}
                </div>
                <span style={{fontSize:11,color:C.muted}}>{msg.created_at?.split("T")[0]}</span>
              </div>
              <p style={{margin:0,fontSize:14,color:"#333",lineHeight:1.75,whiteSpace:"pre-wrap"}}>{msg.body}</p>
            </div>

            {/* Yanıtlar */}
            {replies.map(r=>(
              <div key={r.id} style={{background:C.cream,padding:"12px 20px",borderTop:`1px solid ${C.border}44`}}>
                <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:6}}>
                  <span style={{fontFamily:"'Cinzel',serif",fontSize:10,fontWeight:700,color:r.from_editor?C.teal:C.rust}}>
                    {r.from_editor?"↩ Editör":"↩ Yazar"}
                  </span>
                  <span style={{fontSize:10,color:C.muted}}>{r.created_at?.split("T")[0]}</span>
                </div>
                <p style={{margin:0,fontSize:13.5,color:"#444",lineHeight:1.7}}>{r.body}</p>
              </div>
            ))}

            {/* Yanıt kutusu */}
            <div style={{background:C.paper,borderTop:`1px solid ${C.border}`,padding:"10px 20px",display:"flex",gap:10}}>
              <input
                value={replyText[msg.id]||""}
                onChange={e=>setReplyText(prev=>({...prev,[msg.id]:e.target.value}))}
                placeholder={t.msg_reply_ph}
                style={{flex:1,padding:"8px 12px",border:`1.5px solid ${C.border}`,borderRadius:6,fontSize:13,outline:"none",background:"#fff",color:C.ink}}
                onKeyDown={e=>{if(e.key==="Enter")sendReply(msg.id, msg.author_email, msg.article_id, msg.article_title);}}
              />
              <button onClick={()=>sendReply(msg.id, msg.author_email, msg.article_id, msg.article_title)}
                style={{background:C.gold,color:C.ink,border:"none",padding:"8px 16px",borderRadius:6,cursor:"pointer",fontFamily:"'Cinzel',serif",fontSize:10,fontWeight:700,whiteSpace:"nowrap"}}>
                ↩ {t.msg_reply}
              </button>
            </div>
          </div>
        );
      })}
    </div>
  );
}

/* ── HAKEM DEĞERLENDİRME FORMU ── */
function ReviewForm({review, article, lang, t, onSubmit}) {
  const [answers, setAnswers] = useState({});
  const [decision, setDecision] = useState("");
  const [commentsEditor, setCommentsEditor] = useState("");
  const [commentsAuthor, setCommentsAuthor] = useState("");
  const [busy, setBusy] = useState(false);
  const [activeSection, setActiveSection] = useState(0);

  const allAnswered = useMemo(()=>{
    const allQ = REVIEW_SECTIONS.flatMap(s=>s.questions);
    return allQ.every(q=>answers[q.id]>=1 && answers[q.id]<=5);
  },[answers]);

  const sectionScore = (section)=>{
    const vals = section.questions.map(q=>answers[q.id]).filter(v=>v>0);
    if(!vals.length) return 0;
    return (vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1);
  };

  const totalScore = useMemo(()=>{
    const allQ = REVIEW_SECTIONS.flatMap(s=>s.questions);
    const vals = allQ.map(q=>answers[q.id]).filter(v=>v>0);
    if(!vals.length) return 0;
    return (vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(2);
  },[answers]);

  const handleSubmit = async()=>{
    if(!allAnswered || !decision){ return; }
    setBusy(true);
    await onSubmit({answers, decision, commentsEditor, commentsAuthor, totalScore});
    setBusy(false);
  };

  const decisions=[
    {k:"accept",l:t.review_decision_accept,c:"#065f46",bg:"#d1fae5"},
    {k:"minor",l:t.review_decision_minor,c:"#b45309",bg:"#fef3c7"},
    {k:"major",l:t.review_decision_major,c:"#6d28d9",bg:"#ede9fe"},
    {k:"reject",l:t.review_decision_reject,c:"#991b1b",bg:"#fee2e2"},
  ];

  const completedSections = REVIEW_SECTIONS.filter(s=>s.questions.every(q=>answers[q.id]>=1));

  return(
    <div>
      {/* Makale Bilgisi */}
      <div style={{background:C.ink,borderRadius:12,padding:"20px 24px",marginBottom:24}}>
        <div style={{fontFamily:"'Cinzel',serif",fontSize:9,color:C.gold,letterSpacing:3,marginBottom:8}}>DEĞERLENDİRİLECEK MAKALE</div>
        <h3 style={{fontFamily:"'Cinzel',serif",color:"#f0e6cc",fontSize:15,margin:"0 0 8px",lineHeight:1.5}}>{article?.title}</h3>
        <div style={{display:"flex",gap:16,flexWrap:"wrap"}}>
          <span style={{fontSize:12,color:C.gold}}>{article?.field}</span>
          {article?.file_url&&<a href={article.file_url} target="_blank" style={{fontSize:12,color:"#a0c4bc",fontWeight:700}}>📄 Makaleyi İndir</a>}
        </div>
        {article?.abstract&&<p style={{fontSize:12.5,color:"#8a7d60",margin:"10px 0 0",lineHeight:1.7,fontStyle:"italic"}}>"{article.abstract.substring(0,200)}…"</p>}
      </div>

      {/* İlerleme */}
      <div style={{display:"flex",gap:6,marginBottom:24}}>
        {REVIEW_SECTIONS.map((s,i)=>(
          <button key={s.id} onClick={()=>setActiveSection(i)}
            style={{flex:1,padding:"8px 4px",borderRadius:8,border:`2px solid ${activeSection===i?s.color:completedSections.includes(s)?`${s.color}88`:"#d4c9b4"}`,background:activeSection===i?s.color:completedSections.includes(s)?`${s.color}15`:"#fff",cursor:"pointer",transition:"all 0.2s"}}>
            <div style={{fontSize:16,color:activeSection===i?"#fff":s.color}}>{s.icon}</div>
            <div style={{fontSize:9,fontFamily:"'Cinzel',serif",color:activeSection===i?"#fff":C.muted,letterSpacing:0.5,marginTop:2}}>
              {completedSections.includes(s)?"✓":((i+1)+"/"+ REVIEW_SECTIONS.length)}
            </div>
          </button>
        ))}
      </div>

      {/* Aktif Bölüm */}
      {REVIEW_SECTIONS.map((sec,si)=>(
        si===activeSection&&(
          <div key={sec.id} style={{background:"#fff",borderRadius:12,padding:"28px 32px",border:`2px solid ${sec.color}44`,borderTop:`4px solid ${sec.color}`,marginBottom:20}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
              <div style={{display:"flex",alignItems:"center",gap:10}}>
                <span style={{fontSize:24,color:sec.color}}>{sec.icon}</span>
                <div>
                  <h4 style={{fontFamily:"'Cinzel',serif",margin:0,fontSize:14,fontWeight:700,color:C.ink,letterSpacing:1}}>
                    {sec.title[lang]||sec.title.tr}
                  </h4>
                  <div style={{fontSize:11,color:C.muted,marginTop:2}}>Bölüm {si+1} / {REVIEW_SECTIONS.length}</div>
                </div>
              </div>
              {sectionScore(sec)>0&&(
                <div style={{textAlign:"right"}}>
                  <div style={{fontFamily:"'Cinzel',serif",fontSize:20,fontWeight:700,color:sec.color}}>{sectionScore(sec)}</div>
                  <div style={{fontSize:10,color:C.muted}}>{t.review_section_score}</div>
                </div>
              )}
            </div>
            {sec.questions.map(q=>(
              <LikertQuestion key={q.id} question={q} lang={lang}
                value={answers[q.id]||0}
                onChange={v=>setAnswers(prev=>({...prev,[q.id]:v}))}/>
            ))}
            <div style={{display:"flex",justifyContent:"flex-end",marginTop:10,gap:8}}>
              {si>0&&<button onClick={()=>setActiveSection(si-1)}
                style={{background:"none",border:`1px solid ${C.border}`,borderRadius:7,padding:"8px 18px",cursor:"pointer",fontSize:12,color:C.muted}}>← Önceki</button>}
              {si<REVIEW_SECTIONS.length-1&&<button onClick={()=>setActiveSection(si+1)}
                style={{background:sec.color,color:"#fff",border:"none",borderRadius:7,padding:"8px 18px",cursor:"pointer",fontFamily:"'Cinzel',serif",fontSize:11,fontWeight:700}}>Sonraki →</button>}
            </div>
          </div>
        )
      ))}

      {/* Genel Karar ve Yorumlar */}
      {allAnswered&&(
        <div style={{background:C.cream,borderRadius:12,padding:"28px 32px",border:`1px solid ${C.border}`,marginBottom:20,animation:"fadeUp 0.4s ease both"}}>
          <div style={{fontFamily:"'Cinzel',serif",fontSize:11,color:C.ink,letterSpacing:1.5,marginBottom:16}}>GENEL DEĞERLENDİRME</div>

          {/* Toplam puan */}
          <div style={{display:"flex",alignItems:"center",gap:16,background:"#fff",borderRadius:10,padding:"16px 20px",marginBottom:20,border:`1px solid ${C.border}`}}>
            <div style={{fontFamily:"'Cinzel',serif",fontSize:36,fontWeight:900,color:C.gold}}>{totalScore}</div>
            <div>
              <div style={{fontFamily:"'Cinzel',serif",fontSize:11,color:C.muted,letterSpacing:1}}>{t.review_score}</div>
              <div style={{fontSize:12,color:C.muted}}>5 üzerinden · {REVIEW_SECTIONS.flatMap(s=>s.questions).length} soru</div>
            </div>
            <div style={{flex:1}}>
              <div style={{background:C.cream,borderRadius:6,height:8,overflow:"hidden"}}>
                <div style={{height:"100%",width:`${(totalScore/5)*100}%`,background:`linear-gradient(to right,${C.rust},${C.gold})`,borderRadius:6,transition:"width 0.5s"}}/>
              </div>
            </div>
          </div>

          {/* Karar */}
          <div style={{marginBottom:16}}>
            <div style={{fontFamily:"'Cinzel',serif",fontSize:10,color:C.rust,letterSpacing:1.5,marginBottom:10}}>{t.review_decision.toUpperCase()}</div>
            <div style={{display:"flex",gap:8}}>
              {decisions.map(d=>(
                <button key={d.k} onClick={()=>setDecision(d.k)}
                  style={{flex:1,padding:"10px 4px",borderRadius:8,border:`2px solid ${decision===d.k?d.c:C.border}`,background:decision===d.k?d.bg:"#fff",color:d.c,fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"'Cinzel',serif",transition:"all 0.15s"}}>
                  {d.l}
                </button>
              ))}
            </div>
          </div>

          {/* Yazara yorum */}
          <div style={{marginBottom:12}}>
            <div style={{fontFamily:"'Cinzel',serif",fontSize:10,color:C.teal,letterSpacing:1.5,marginBottom:8}}>{t.review_comments_author.toUpperCase()}</div>
            <textarea value={commentsAuthor} onChange={e=>setCommentsAuthor(e.target.value)}
              placeholder="Yazara iletilecek genel değerlendirme yorumunuz..."
              rows={4} style={{...INP,resize:"vertical",marginBottom:0}}/>
          </div>

          {/* Editöre gizli not */}
          <div style={{marginBottom:16}}>
            <div style={{fontFamily:"'Cinzel',serif",fontSize:10,color:C.rust,letterSpacing:1.5,marginBottom:8}}>{t.review_comments.toUpperCase()}</div>
            <textarea value={commentsEditor} onChange={e=>setCommentsEditor(e.target.value)}
              placeholder="Yazara iletilmeyecek gizli notlarınız (isteğe bağlı)..."
              rows={3} style={{...INP,resize:"vertical",marginBottom:0}}/>
          </div>

          <button onClick={handleSubmit} disabled={busy||!decision}
            style={{...BTN,background:decision?C.teal:"#ccc",color:"#fff",opacity:busy?0.7:1,letterSpacing:1,fontFamily:"'Cinzel',serif",fontSize:13}}>
            {busy?"GÖNDERİLİYOR...":t.review_submit}
          </button>
          {!decision&&<p style={{fontSize:11,color:C.rust,textAlign:"center",marginTop:6,fontStyle:"italic"}}>Lütfen bir karar seçin.</p>}
        </div>
      )}
    </div>
  );
}

/* ── HAKEM PANELİ ── */
function HakemPanel({user, t, lang, toast_}) {
  const [atamalar, setAtamalar] = useState([]);
  const [makaleler, setMakaleler] = useState({});
  const [acik, setAcik] = useState(null);

  const yukle = useCallback(async()=>{
    const{data}=await supa.from("reviews").select("*").eq("reviewer_email",user.email).order("assigned_at",{ascending:false});
    if(!data) return;
    setAtamalar(data);
    const ids=[...new Set(data.map(r=>r.article_id))];
    if(ids.length>0){
      const{data:arts}=await supa.from("articles").select("*").in("id",ids);
      if(arts){const map={};arts.forEach(a=>{map[a.id]=a;});setMakaleler(map);}
    }
  },[user.email]);

  useEffect(()=>{yukle();},[yukle]);

  const handleReviewSubmit = async(reviewId, articleId, {answers, decision, commentsEditor, commentsAuthor, totalScore})=>{
    const statusMap={accept:"baskida",minor:"revizyon",major:"revizyon",reject:"reddedildi"};
    await supa.from("reviews").update({
      status:"tamamlandi",
      decision,
      answers_json: JSON.stringify(answers),
      comments_editor: commentsEditor,
      comments_author: commentsAuthor,
      total_score: parseFloat(totalScore),
      completed_at: new Date().toISOString()
    }).eq("id",reviewId);
    await supa.from("articles").update({status:statusMap[decision]||"revizyon"}).eq("id",articleId);
    toast_(t.review_done);
    setAcik(null);
    yukle();
  };

  return(
    <div>
      <h3 style={{fontFamily:"'Cinzel',serif",margin:"0 0 6px",fontSize:17,letterSpacing:1,color:C.ink}}>{t.review_panel}</h3>
      <p style={{fontSize:13,color:C.muted,marginBottom:24,fontStyle:"italic"}}>{t.review_assigned}</p>

      {atamalar.length===0?(
        <div style={{textAlign:"center",padding:"60px 20px",color:C.muted,background:C.cream,borderRadius:12,border:`1px solid ${C.border}`}}>
          <div style={{fontSize:32,marginBottom:12}}>⊕</div>
          <p style={{fontStyle:"italic"}}>Henüz size atanmış makale yok.</p>
        </div>
      ):atamalar.map(r=>{
        const art=makaleler[r.article_id];
        const tamam=r.status==="tamamlandi";
        return(
          <div key={r.id} style={{border:`2px solid ${tamam?C.border:C.teal}`,borderRadius:12,marginBottom:16,overflow:"hidden",borderTop:`4px solid ${tamam?"#d1fae5":C.teal}`}}>
            <div style={{background:"#fff",padding:"16px 20px",cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"flex-start"}} onClick={()=>setAcik(acik===r.id?null:r.id)}>
              <div style={{flex:1}}>
                <div style={{fontFamily:"'Cinzel',serif",fontSize:13.5,fontWeight:700,color:C.ink,marginBottom:4}}>{art?.title||"Yükleniyor..."}</div>
                <div style={{fontSize:11,color:C.muted}}>{art?.field} · Atandı: {r.assigned_at?.split("T")[0]}</div>
              </div>
              <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:6}}>
                <span style={{fontSize:10,padding:"3px 10px",borderRadius:20,fontWeight:700,background:tamam?"#d1fae5":"#dbeafe",color:tamam?"#065f46":"#1e40af"}}>
                  {tamam?("✓ "+t.review_completed_badge):t.review_pending_badge}
                </span>
                {tamam&&r.total_score>0&&(
                  <span style={{fontFamily:"'Cinzel',serif",fontSize:14,fontWeight:700,color:C.gold}}>{r.total_score}/5</span>
                )}
                <span style={{color:C.gold,fontSize:13}}>{acik===r.id?"▲":"▼"}</span>
              </div>
            </div>

            {acik===r.id&&(
              <div style={{borderTop:`1px solid ${C.border}`,padding:"24px 28px",background:C.paper}}>
                {tamam?(
                  <div>
                    <div style={{background:"#fff",borderRadius:10,padding:"20px 24px",border:`1px solid ${C.border}`,marginBottom:16}}>
                      <div style={{fontFamily:"'Cinzel',serif",fontSize:10,color:C.teal,letterSpacing:1.5,marginBottom:12}}>TAMAMLANAN DEĞERLENDİRME</div>
                      <div style={{display:"flex",gap:20,marginBottom:14,flexWrap:"wrap"}}>
                        <div><span style={{fontSize:11,color:C.muted}}>Karar: </span>
                          <span style={{fontSize:13,fontWeight:700,color:r.decision==="accept"?"#065f46":r.decision==="reject"?"#991b1b":"#6d28d9"}}>
                            {{accept:"✓ Kabul",minor:"↻ Küçük Revizyon",major:"↺ Büyük Revizyon",reject:"✗ Red"}[r.decision]}
                          </span>
                        </div>
                        <div><span style={{fontSize:11,color:C.muted}}>Toplam Puan: </span>
                          <span style={{fontFamily:"'Cinzel',serif",fontSize:16,fontWeight:700,color:C.gold}}>{r.total_score}/5</span>
                        </div>
                      </div>
                      {r.comments_author&&<div style={{marginBottom:10}}>
                        <div style={{fontSize:10,color:C.teal,fontFamily:"'Cinzel',serif",letterSpacing:1,marginBottom:6}}>YAZARA YORUM</div>
                        <p style={{fontSize:13.5,color:"#444",lineHeight:1.7,background:C.cream,padding:"10px 14px",borderRadius:8,margin:0}}>{r.comments_author}</p>
                      </div>}
                    </div>
                  </div>
                ):(
                  <ReviewForm review={r} article={art} lang={lang} t={t}
                    onSubmit={(data)=>handleReviewSubmit(r.id, r.article_id, data)}/>
                )}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

/* ── HAKEM ATA MODAL ── */
function HakemAtaModal({article, users, onClose, toast_, loadArticles}) {
  const [mevcut, setMevcut] = useState([]);
  const [secilen, setSecilen] = useState("");
  const hakemler = users.filter(u=>u.role==="hakem");

  useEffect(()=>{
    supa.from("reviews").select("*").eq("article_id",article.id)
      .then(({data})=>{if(data)setMevcut(data);});
  },[article.id]);

  const ata=async()=>{
    if(!secilen){toast_("Lütfen hakem seçin.","err");return;}
    const hakem=hakemler.find(h=>h.email===secilen);
    if(!hakem) return;
    if(mevcut.some(r=>r.reviewer_email===secilen)){toast_("Bu hakem zaten atanmış.","err");return;}
    await supa.from("reviews").insert([{
      article_id:article.id,
      reviewer_email:hakem.email,
      reviewer_name:hakem.name,
      status:"beklemede",
      assigned_at:new Date().toISOString()
    }]);
    await supa.from("articles").update({status:"hakemde"}).eq("id",article.id);
    await loadArticles();
    toast_("✓ Hakem atandı!");
    onClose();
  };

  return(
    <div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.6)",zIndex:400,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div onClick={e=>e.stopPropagation()} style={{background:C.paper,borderRadius:16,padding:"32px 36px",width:"100%",maxWidth:500,boxShadow:"0 24px 80px rgba(0,0,0,0.4)",border:`1px solid ${C.gold}44`}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:20}}>
          <div>
            <div style={{fontFamily:"'Cinzel',serif",fontSize:15,fontWeight:700,color:C.ink,letterSpacing:1}}>HAKEME GÖNDER</div>
            <div style={{fontSize:12,color:C.muted,marginTop:4,fontStyle:"italic",maxWidth:300}}>{article.title}</div>
          </div>
          <button onClick={onClose} style={{background:"none",border:"none",cursor:"pointer",fontSize:22,color:C.muted}}>×</button>
        </div>

        {mevcut.length>0&&(
          <div style={{marginBottom:16}}>
            <div style={{fontFamily:"'Cinzel',serif",fontSize:10,color:C.teal,letterSpacing:1.5,marginBottom:8}}>ATANMIŞ HAKEMLER</div>
            {mevcut.map(r=>(
              <div key={r.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:C.cream,borderRadius:8,padding:"8px 14px",marginBottom:6,border:`1px solid ${C.border}`}}>
                <div>
                  <div style={{fontSize:13,fontWeight:700,color:C.ink}}>{r.reviewer_name}</div>
                  <div style={{fontSize:11,color:C.muted}}>{r.reviewer_email}</div>
                </div>
                <span style={{fontSize:10,padding:"3px 10px",borderRadius:20,fontWeight:700,
                  background:r.status==="tamamlandi"?"#d1fae5":"#dbeafe",
                  color:r.status==="tamamlandi"?"#065f46":"#1e40af"}}>
                  {r.status==="tamamlandi"?"✓ Değerlendirdi":"Bekliyor"}
                </span>
              </div>
            ))}
          </div>
        )}

        <div style={{fontFamily:"'Cinzel',serif",fontSize:10,color:C.rust,letterSpacing:1.5,marginBottom:8}}>YENİ HAKEM ATA</div>
        {hakemler.length===0?(
          <div style={{background:C.cream,borderRadius:8,padding:14,fontSize:13,color:C.muted,fontStyle:"italic",marginBottom:16}}>
            Sistemde kayıtlı hakem bulunmuyor.
          </div>
        ):(
          <select value={secilen} onChange={e=>setSecilen(e.target.value)}
            style={{...INP,marginBottom:16}}>
            <option value="">Hakem seçin...</option>
            {hakemler.filter(h=>!mevcut.some(r=>r.reviewer_email===h.email)).map(h=>(
              <option key={h.id} value={h.email}>{h.name} — {h.institution||h.email}</option>
            ))}
          </select>
        )}
        <div style={{display:"flex",gap:10}}>
          <button onClick={ata} style={{flex:1,background:C.teal,color:"#fff",border:"none",padding:"11px 0",borderRadius:7,cursor:"pointer",fontFamily:"'Cinzel',serif",fontSize:12,fontWeight:700,letterSpacing:1}}>
            ⊕ HAKEME GÖNDER
          </button>
          <button onClick={onClose} style={{padding:"11px 20px",background:"none",border:`1px solid ${C.border}`,borderRadius:7,cursor:"pointer",fontSize:12,color:C.muted}}>İptal</button>
        </div>
      </div>
    </div>
  );
}

/* ── HAKEMLİK SONUCU GÖRÜNTÜLE (Admin için) ── */
function ReviewResultsModal({article, reviews, onClose, t, lang, toast_}) {
  const completedReviews = reviews.filter(r=>r.status==="tamamlandi");

  const shareWithAuthor = async(review)=>{
    await supa.from("reviews").update({shared_with_author:true}).eq("id",review.id);
    // Yazara bilgi mesajı gönder
    await supa.from("editor_messages").insert([{
      from_editor: true,
      from_name: "ARSİS Editörü",
      from_email: "arsisakademik@gmail.com",
      author_email: article.author_email,
      author_name: article.author,
      article_id: article.id,
      article_title: article.title,
      body: `Makaleniz "${article.title}" için hakem değerlendirmesi tamamlanmıştır.\n\nHakem Kararı: ${{accept:"Kabul",minor:"Küçük Revizyon Gerekli",major:"Büyük Revizyon Gerekli",reject:"Reddedildi"}[review.decision]}\n\nHakemden Yazara Yorum:\n${review.comments_author||"(Yorum girilmemiş)"}\n\nLütfen kullanıcı panelinizden detayları inceleyiniz.`,
      parent_id: null,
    }]);
    toast_("✓ Değerlendirme sonucu yazarla paylaşıldı!");
    onClose();
  };

  const sectionScoreForReview = (review, section)=>{
    if(!review.answers_json) return null;
    try{
      const ans = JSON.parse(review.answers_json);
      const vals = section.questions.map(q=>ans[q.id]).filter(v=>v>0);
      if(!vals.length) return null;
      return (vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1);
    }catch{return null;}
  };

  return(
    <div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.7)",zIndex:500,display:"flex",alignItems:"center",justifyContent:"center",padding:20,overflowY:"auto"}}>
      <div onClick={e=>e.stopPropagation()} style={{background:C.paper,borderRadius:16,padding:"32px 36px",width:"100%",maxWidth:720,maxHeight:"90vh",overflowY:"auto",boxShadow:"0 24px 80px rgba(0,0,0,0.5)",border:`1px solid ${C.gold}44`}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:20}}>
          <div>
            <div style={{fontFamily:"'Cinzel',serif",fontSize:15,fontWeight:700,color:C.ink,letterSpacing:1}}>{t.review_results}</div>
            <div style={{fontSize:12,color:C.muted,marginTop:4,fontStyle:"italic",maxWidth:400}}>{article.title}</div>
          </div>
          <button onClick={onClose} style={{background:"none",border:"none",cursor:"pointer",fontSize:22,color:C.muted}}>×</button>
        </div>

        {reviews.length===0?(
          <div style={{textAlign:"center",padding:40,color:C.muted,fontStyle:"italic"}}>Henüz değerlendirme sonucu yok.</div>
        ):reviews.map((r,ri)=>(
          <div key={r.id} style={{border:`1px solid ${C.border}`,borderRadius:12,marginBottom:20,overflow:"hidden"}}>
            {/* Hakem başlık */}
            <div style={{background:r.status==="tamamlandi"?`${C.teal}12`:C.cream,padding:"14px 20px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div>
                <span style={{fontFamily:"'Cinzel',serif",fontSize:12,fontWeight:700,color:C.ink}}>Hakem {ri+1}</span>
                <span style={{fontSize:11,color:C.muted,marginLeft:8}}>({r.reviewer_name})</span>
              </div>
              <div style={{display:"flex",gap:8,alignItems:"center"}}>
                {r.status==="tamamlandi"&&r.total_score>0&&(
                  <span style={{fontFamily:"'Cinzel',serif",fontSize:18,fontWeight:700,color:C.gold}}>{r.total_score}/5</span>
                )}
                <span style={{fontSize:10,padding:"3px 10px",borderRadius:20,fontWeight:700,background:r.status==="tamamlandi"?"#d1fae5":"#dbeafe",color:r.status==="tamamlandi"?"#065f46":"#1e40af"}}>
                  {r.status==="tamamlandi"?"✓ Tamamlandı":"Bekliyor"}
                </span>
              </div>
            </div>

            {r.status==="tamamlandi"&&(
              <div style={{padding:"20px 24px"}}>
                {/* Karar */}
                <div style={{display:"flex",gap:12,marginBottom:16,flexWrap:"wrap"}}>
                  <div style={{background:{accept:"#d1fae5",minor:"#fef3c7",major:"#ede9fe",reject:"#fee2e2"}[r.decision]||C.cream,borderRadius:8,padding:"8px 16px",display:"inline-flex",alignItems:"center",gap:8}}>
                    <span style={{fontSize:11,color:C.muted}}>Karar:</span>
                    <span style={{fontFamily:"'Cinzel',serif",fontSize:13,fontWeight:700,color:{accept:"#065f46",minor:"#b45309",major:"#6d28d9",reject:"#991b1b"}[r.decision]}}>
                      {{accept:"✓ Kabul",minor:"↻ Küçük Revizyon",major:"↺ Büyük Revizyon",reject:"✗ Red"}[r.decision]}
                    </span>
                  </div>
                  {r.shared_with_author&&(
                    <span style={{background:"#d1fae5",color:"#065f46",fontSize:10,padding:"4px 12px",borderRadius:20,fontWeight:700,display:"flex",alignItems:"center",gap:4}}>
                      ✓ {t.shared_badge}
                    </span>
                  )}
                </div>

                {/* Bölüm puanları */}
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:16}}>
                  {REVIEW_SECTIONS.map(s=>{
                    const sc=sectionScoreForReview(r,s);
                    return(
                      <div key={s.id} style={{background:C.cream,borderRadius:8,padding:"10px 14px",border:`1px solid ${C.border}`,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                        <div>
                          <span style={{fontSize:14,color:s.color,marginRight:6}}>{s.icon}</span>
                          <span style={{fontSize:11,color:C.muted}}>{s.title[lang]||s.title.tr}</span>
                        </div>
                        <span style={{fontFamily:"'Cinzel',serif",fontSize:14,fontWeight:700,color:s.color}}>{sc||"—"}</span>
                      </div>
                    );
                  })}
                </div>

                {/* Yazara yorum */}
                {r.comments_author&&(
                  <div style={{marginBottom:12}}>
                    <div style={{fontFamily:"'Cinzel',serif",fontSize:9,color:C.teal,letterSpacing:1.5,marginBottom:6}}>YAZARA YORUM</div>
                    <p style={{fontSize:13.5,color:"#444",lineHeight:1.7,background:"#fff",padding:"12px 16px",borderRadius:8,border:`1px solid ${C.border}`,margin:0,whiteSpace:"pre-wrap"}}>{r.comments_author}</p>
                  </div>
                )}

                {/* Editöre gizli not */}
                {r.comments_editor&&(
                  <div style={{marginBottom:14}}>
                    <div style={{fontFamily:"'Cinzel',serif",fontSize:9,color:C.rust,letterSpacing:1.5,marginBottom:6}}>EDİTÖRE GİZLİ NOT</div>
                    <p style={{fontSize:13,color:"#555",lineHeight:1.7,background:"#fff9f0",padding:"12px 16px",borderRadius:8,border:`1px dashed ${C.gold}`,margin:0,whiteSpace:"pre-wrap"}}>{r.comments_editor}</p>
                  </div>
                )}

                {/* Yazarla paylaş butonu */}
                {!r.shared_with_author&&(
                  <button onClick={()=>shareWithAuthor(r)}
                    style={{background:C.teal,color:"#fff",border:"none",padding:"10px 22px",borderRadius:8,cursor:"pointer",fontFamily:"'Cinzel',serif",fontSize:11,fontWeight:700,letterSpacing:1}}>
                    ↗ {t.share_with_author}
                  </button>
                )}
              </div>
            )}
          </div>
        ))}
      </div>
    </div>
  );
}

/* ── ANA APP ── */
function App() {
  const [lang,setLang]=useState("tr");
  const [articles,setArticles]=useState([]);
  const [users,setUsers]=useState([]);
  const [page,setPage]=useState("anasayfa");
  const [user,setUser]=useState(null);
  const [modal,setModal]=useState(null);
  const [toast,setToast]=useState(null);
  const [tab,setTab]=useState("makalelerim");
  const [scrolled,setScrolled]=useState(false);
  const [reviewsMap, setReviewsMap] = useState({});
  const [reviewModalArticle, setReviewModalArticle] = useState(null);
  const [hakemModal, setHakemModal] = useState(null);

  const t=T[lang]||T.tr;

  useEffect(()=>{
    loadArticles();loadUsers();
    const onScroll=()=>setScrolled(window.scrollY>40);
    window.addEventListener("scroll",onScroll);
    return()=>window.removeEventListener("scroll",onScroll);
  },[]);

  const loadArticles=async()=>{
    const{data}=await supa.from("articles").select("*").order("created_at",{ascending:false});
    if(data) setArticles(data);
  };
  const loadUsers=async()=>{
    const{data}=await supa.from("users").select("*");
    if(data) setUsers(data);
  };
  const loadReviewsForArticle=async(articleId)=>{
    const{data}=await supa.from("reviews").select("*").eq("article_id",articleId);
    if(data) setReviewsMap(prev=>({...prev,[articleId]:data}));
    return data||[];
  };
  const toast_=(msg,type="ok")=>{setToast({msg,type});setTimeout(()=>setToast(null),3400);};

      <div onClick={e=>e.stopPropagation()} style={{background:C.paper,borderRadius:16,padding:"40px 44px",width:"100%",maxWidth:500,maxHeight:"90vh",overflowY:"auto",boxShadow:"0 24px 80px rgba(0,0,0,0.5)",border:`1px solid ${C.gold}44`}}>

        <div style={{display:"flex",alignItems:"center",gap:14,cursor:"pointer"}} onClick={()=>setPage("anasayfa")}>
          <WaveLogo size={30}/>

            <div style={{fontFamily:"'Cinzel',serif",fontWeight:900,fontSize:22,color:C.gold,letterSpacing:3,lineHeight:1}}>{t.title}</div>
            <div style={{fontSize:9,color:"#8a7d60",letterSpacing:2,marginTop:1}}>MUSIC · MUSICOLOGY · ANTHROPOLOGY</div>
          </div>
        </div>
        <div style={{display:"flex",gap:1,alignItems:"center"}}>
          {[["anasayfa",t.nav.home],["arsiv",t.nav.archive],["hakkinda",t.nav.about],["acik-erisim",t.nav.openaccess]].map(([id,label])=>(
            <button key={id} className={`nav-link${page===id?" active":""}`} onClick={()=>setPage(id)}>{label}</button>
          ))}
          <button className="nav-link" onClick={()=>user?setModal("makale"):setModal("login")} style={{color:C.goldL,border:`1px solid ${C.gold}55`,marginLeft:4}}>{t.nav.submit}</button>
        </div>
        <div style={{display:"flex",gap:8,alignItems:"center"}}>
          <div style={{display:"flex",gap:4,marginRight:8}}>
            {["tr","en"].map(l=>(
              <button key={l} className={`lang-btn${lang===l?" active":""}`} onClick={()=>setLang(l)}>
                {l==="tr"?"TR":"EN"}
              </button>
            ))}
          </div>
          {user?(
            <>
              <button onClick={()=>{setPage("panel");setTab("makalelerim");}} style={{background:"rgba(201,168,76,0.12)",color:C.goldL,border:`1px solid ${C.gold}44`,padding:"7px 14px",borderRadius:6,cursor:"pointer",fontSize:12.5}}>

            </>

          <p style={{fontSize:19,color:"#c4b896",maxWidth:560,margin:"0 auto 40px",lineHeight:1.75,fontStyle:"italic"}}>"{t.motto}"</p>
          <div style={{display:"flex",gap:14,justifyContent:"center",flexWrap:"wrap"}}>
            <button onClick={()=>setPage("arsiv")} style={{background:C.gold,color:C.ink,border:"none",padding:"14px 32px",borderRadius:7,cursor:"pointer",fontSize:14,fontWeight:800,fontFamily:"'Cinzel',serif",letterSpacing:1.5}}>{t.hero_btn1}</button>
            <button onClick={()=>user?setModal("makale"):setModal("login")} style={{background:"transparent",color:C.goldL,border:`1.5px solid ${C.gold}`,padding:"14px 32px",borderRadius:7,cursor:"pointer",fontSize:14,fontWeight:600}}>{t.hero_btn2}</button>
          </div>
        </div>
      </div>
      <div style={{background:C.ink,borderBottom:`1px solid ${C.gold}33`,display:"grid",gridTemplateColumns:"repeat(4,1fr)"}}>
        {t.stats.map(([n,l],i)=>(
          <div key={i} style={{padding:"22px 20px",textAlign:"center",borderRight:i<3?`1px solid ${C.gold}22`:"none"}}>
            <div style={{fontFamily:"'Cinzel',serif",fontSize:20,fontWeight:700,color:C.gold}}>{n}</div>

      </div>
      <div style={{background:C.paper,padding:"64px 28px"}}>
        <div style={{maxWidth:1200,margin:"0 auto"}}>
          <div style={{display:"flex",alignItems:"baseline",gap:16,marginBottom:32}}>
            <h2 style={{fontFamily:"'Cinzel',serif",fontSize:22,fontWeight:700,color:C.ink,margin:0,letterSpacing:2}}>
              {lang==="tr"?"KAPSAM ALANLARI":"SCOPE & COVERAGE"}
            </h2>
            <div style={{flex:1,height:1,background:`linear-gradient(to right,${C.gold}88,transparent)`}}/>

              <div key={f.name} style={{background:"#fff",borderRadius:10,padding:"24px 20px",border:`1px solid ${C.border}`,textAlign:"center"}}>

      </div>
      <div style={{background:`linear-gradient(135deg,${C.ink} 0%,#2a1f0a 100%)`,padding:"44px 48px",borderTop:`2px solid ${C.gold}44`}}>

          <div style={{fontFamily:"'Cinzel',serif",fontSize:10,color:C.gold,letterSpacing:4,marginBottom:14}}>{t.call}</div>
          <h3 style={{fontFamily:"'Cinzel',serif",fontSize:20,color:"#f0e6cc",margin:"0 0 12px",letterSpacing:1}}>{t.call_title}</h3>
          <p style={{fontSize:15,color:"#a09070",margin:"0 0 24px"}}>{t.call_text} <strong style={{color:C.goldL}}>30 {lang==="tr"?"Nisan":"April"} 2026</strong></p>
          <button onClick={()=>user?setModal("makale"):setModal("login")} style={{background:C.gold,color:C.ink,border:"none",padding:"13px 30px",borderRadius:7,cursor:"pointer",fontSize:13,fontWeight:800,fontFamily:"'Cinzel',serif",letterSpacing:1.5}}>{t.submit_btn}</button>
        </div>

  /* ── PANEL ── */

    const tabs=[
      {id:"makalelerim",icon:"♩",label:t.panel_articles},

      {id:"profil",icon:"◎",label:t.panel_profile},
      ...(isEditor?[{id:"yonetim",icon:"⚙",label:t.panel_admin}]:[]),
      ...(isHakem?[{id:"hakem",icon:"⊕",label:t.panel_review}]:[]),
    ];

    return(
      <div style={{background:C.paper,minHeight:"80vh",padding:"40px 28px"}}>
        <div style={{maxWidth:1140,margin:"0 auto",display:"grid",gridTemplateColumns:"230px 1fr",gap:28}}>
          {/* Sol menü */}

              <div style={{fontFamily:"'Cinzel',serif",fontWeight:700,fontSize:13,color:"#f0e6cc"}}>{user?.name}</div>
              <div style={{fontSize:11,color:C.gold,marginTop:4,fontFamily:"'Cinzel',serif",letterSpacing:1}}>

                  <h3 style={{fontFamily:"'Cinzel',serif",margin:0,fontSize:17,letterSpacing:1,color:C.ink}}>{t.panel_articles.toUpperCase()}</h3>
                  <button onClick={()=>setModal("makale")} style={{background:C.gold,color:C.ink,border:"none",padding:"9px 20px",borderRadius:7,cursor:"pointer",fontFamily:"'Cinzel',serif",fontSize:11,letterSpacing:1,fontWeight:700}}>+ {t.submit_btn}</button>
                </div>
                {myArticles.length===0?(
                  <div style={{textAlign:"center",padding:"60px 20px",color:C.muted}}>
                    <p style={{marginBottom:16,fontStyle:"italic"}}>{t.no_articles}</p>
                    <button onClick={()=>setModal("makale")} style={{background:C.ink,color:C.gold,border:"none",padding:"10px 22px",borderRadius:6,cursor:"pointer",fontFamily:"'Cinzel',serif",fontSize:11}}>{t.first_article}</button>
                  </div>
                ):myArticles.map(a=>{
                  const sc=STATUS[a.status]||{};
                  return(
                    <div key={a.id} style={{border:`1px solid ${C.border}`,borderRadius:10,padding:"18px 22px",marginBottom:14}}>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                        <h4 style={{fontFamily:"'Cinzel',serif",margin:"0 0 6px",fontSize:13.5,color:C.ink,flex:1,paddingRight:14}}>{a.title}</h4>

                      <p style={{margin:0,fontSize:12.5,color:C.muted,fontStyle:"italic"}}>{a.created_at?.split("T")[0]} · {a.field}</p>

                    <div key={l} style={{background:`${c}12`,borderRadius:9,padding:"16px 12px",textAlign:"center",border:`1px solid ${c}30`}}>
                      <div style={{fontFamily:"'Cinzel',serif",fontSize:26,fontWeight:700,color:c}}>{n}</div>
                      <div style={{fontSize:11,color:C.muted,marginTop:3}}>{l}</div>

                  articles.map(a=>{
                    const sc=STATUS[a.status]||{};
                    const artReviews=reviewsMap[a.id]||[];
                    return(
                      <div key={a.id} style={{border:`1px solid ${C.border}`,borderRadius:10,padding:"16px 20px",marginBottom:12}}>

                            style={{fontSize:11,padding:"4px 8px",borderRadius:6,border:`1px solid ${C.border}`,background:sc.bg,color:sc.color,fontWeight:700,cursor:"pointer"}}>
                            {Object.entries(STATUS).map(([k,v])=><option key={k} value={k}>{v.label[lang]||v.label.tr}</option>)}

                            style={{fontSize:11,color:C.rust,background:`${C.rust}12`,border:`1px solid ${C.rust}44`,padding:"5px 12px",borderRadius:6,cursor:"pointer",fontFamily:"'Cinzel',serif",fontWeight:700}}>

                        <div style={{fontSize:12,color:C.muted,fontStyle:"italic"}}>{u.email} · {u.institution||"—"}</div>

                      <span style={{fontSize:10,padding:"3px 10px",borderRadius:20,background:`${C.gold}20`,color:C.rust,fontWeight:700,fontFamily:"'Cinzel',serif"}}>{u.role?.toUpperCase()}</span>
                    </div>
                  ))
                }
              </div>
            )}
          </div>
        </div>
      </div>
    );
  };

  const Footer=()=>(
    <footer style={{background:C.ink,borderTop:`2px solid ${C.gold}44`}}>
      <div style={{maxWidth:1100,margin:"0 auto",padding:"44px 28px 28px",display:"grid",gridTemplateColumns:"2fr 1fr 1fr 1fr",gap:36}}>
        <div>
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14}}>
            <WaveLogo size={22}/><div style={{fontFamily:"'Cinzel',serif",fontWeight:900,fontSize:18,color:C.gold,letterSpacing:3}}>{t.title}</div>
          </div>
          <p style={{margin:"0 0 8px",fontSize:12.5,color:"#8a7d60",lineHeight:1.7,fontStyle:"italic"}}>"{t.footer_motto}"</p>
          <p style={{margin:0,fontSize:11.5,color:"#5a4e3a"}}>{t.oa_policy} · CC BY 4.0</p>
        </div>
        {t.footer_cols.map(([title,items])=>(
          <div key={title}>
            <div style={{fontFamily:"'Cinzel',serif",fontSize:10,color:C.gold,letterSpacing:2,marginBottom:14,fontWeight:700}}>{title.toUpperCase()}</div>
            {items.map(item=>(
              <div key={item} style={{fontSize:12.5,color:"#7a6e5f",marginBottom:7}}>{item}</div>
            ))}
          </div>
        ))}
      </div>
      <div style={{borderTop:`1px solid ${C.gold}22`,padding:"18px 28px",display:"flex",justifyContent:"space-between"}}>
        <div style={{fontFamily:"'Cinzel',serif",fontSize:10,color:"#5a4e3a",letterSpacing:1.5}}>{t.copyright}</div>
        <div style={{fontSize:11,color:"#5a4e3a",fontStyle:"italic"}}>ἄρσις</div>
      </div>
    </footer>
  );

  const Archive=()=>(
    <div style={{background:C.paper,minHeight:"80vh"}}>
      <div style={{background:C.ink,padding:"52px 48px",textAlign:"center"}}>
        <h2 style={{fontFamily:"'Cinzel',serif",fontSize:28,color:"#f0e6cc",margin:"0 0 12px",letterSpacing:3}}>{t.archive_title}</h2>
        <p style={{fontSize:15,color:"#a09070",fontStyle:"italic"}}>{t.archive_sub}</p>
      </div>
      <div style={{maxWidth:700,margin:"0 auto",padding:"80px 28px",textAlign:"center"}}>
        <div style={{fontFamily:"'Cinzel',serif",fontSize:11,color:C.gold,letterSpacing:4,marginBottom:20}}>{t.archive_coming}</div>
        <button onClick={()=>user?setModal("makale"):setModal("login")} style={{background:C.gold,color:C.ink,border:"none",padding:"13px 32px",borderRadius:7,cursor:"pointer",fontFamily:"'Cinzel',serif",fontSize:12,fontWeight:700,letterSpacing:2}}>{t.submit_btn}</button>
      </div>
    </div>
  );

  const About=()=>(
    <div style={{background:C.paper}}>
      <div style={{background:C.ink,padding:"52px 48px",textAlign:"center"}}>
        <h2 style={{fontFamily:"'Cinzel',serif",fontSize:32,color:"#f0e6cc",margin:"0 0 14px",letterSpacing:3}}>{t.about_title}</h2>
        <p style={{fontSize:17,color:"#a09070",maxWidth:650,margin:"0 auto",lineHeight:1.75,fontStyle:"italic"}}>{t.about_sub}</p>
      </div>
      <div style={{maxWidth:960,margin:"0 auto",padding:"60px 28px",display:"grid",gridTemplateColumns:"2fr 1fr",gap:52}}>
        <div>
          {[{t:t.peer,c:t.peer_text},{t:t.guide,c:t.guide_text},{t:t.oa_policy,c:t.oa_text}].map(s=>(
            <div key={s.t} style={{marginBottom:32}}>
              <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
                <div style={{width:28,height:2,background:C.gold}}/>
                <h3 style={{fontFamily:"'Cinzel',serif",margin:0,fontSize:14,fontWeight:700,color:C.ink,letterSpacing:1}}>{s.t.toUpperCase()}</h3>
              </div>
              <p style={{margin:0,color:"#555",fontSize:15,lineHeight:1.8}}>{s.c}</p>
            </div>
          ))}
        </div>
        <div>
          <div style={{background:C.ink,borderRadius:12,padding:"28px 24px",marginBottom:20}}>
            <div style={{fontFamily:"'Cinzel',serif",fontSize:11,color:C.gold,letterSpacing:2,marginBottom:16}}>{t.db_title}</div>
            {t.db.map(([k,v])=>(
              <div key={k} style={{display:"flex",justifyContent:"space-between",padding:"7px 0",borderBottom:`1px solid ${C.gold}22`,fontSize:13}}>
                <span style={{color:"#8a7d60"}}>{k}</span>
                <span style={{color:"#e0d0b0",fontWeight:600}}>{v}</span>
              </div>
            ))}
          </div>
          <div style={{background:C.cream,borderRadius:12,padding:"22px 24px",border:`1px solid ${C.border}`}}>
            <div style={{fontFamily:"'Cinzel',serif",fontSize:11,color:C.rust,letterSpacing:2,marginBottom:14}}>{t.contact}</div>
            <p style={{margin:"0 0 8px",fontSize:13.5,color:C.muted}}>✉️ arsisakademik@gmail.com</p>
          </div>
        </div>
      </div>
    </div>
  );

  const OpenAccess=()=>(
    <div style={{background:C.paper,minHeight:"80vh"}}>
      <div style={{background:C.ink,padding:"56px 48px",textAlign:"center"}}>
        <div style={{fontSize:44,marginBottom:16}}>🔓</div>
        <h2 style={{fontFamily:"'Cinzel',serif",fontSize:30,color:"#f0e6cc",margin:"0 0 14px",letterSpacing:3}}>{t.oa_title}</h2>
        <p style={{fontSize:17,color:"#a09070",maxWidth:560,margin:"0 auto",lineHeight:1.75}}>{t.oa_sub}</p>
      </div>
      <div style={{maxWidth:720,margin:"0 auto",padding:"60px 28px"}}>
        <div style={{background:"#fff",borderRadius:16,padding:"44px 48px",border:`2px solid ${C.gold}`,textAlign:"center"}}>
          <div style={{fontFamily:"'Cinzel',serif",fontSize:44,fontWeight:900,color:C.gold,marginBottom:6}}>{t.free}</div>
          <button onClick={()=>user?toast_(t.access):setModal("register")} style={{background:C.gold,color:C.ink,border:"none",padding:"16px 52px",borderRadius:8,cursor:"pointer",fontFamily:"'Cinzel',serif",fontWeight:700,fontSize:15,letterSpacing:1.5,marginTop:16}}>
            {user?`✓ ${t.access}`:t.register_free}
          </button>
        </div>
      </div>
    </div>
  );

  return(
    <div style={{background:C.paper,minHeight:"100vh"}}>
      <Nav/>
      {page==="anasayfa"&&<Home/>}
      {page==="arsiv"&&<Archive/>}
      {page==="hakkinda"&&<About/>}
      {page==="acik-erisim"&&<OpenAccess/>}
      {page==="panel"&&user&&<Panel/>}
      <Footer/>

      {/* TOAST */}
      {toast&&(
        <div style={{position:"fixed",bottom:28,right:28,background:toast.type==="err"?"#7f1d1d":C.ink,color:toast.type==="err"?"#fca5a5":C.gold,padding:"14px 24px",borderRadius:10,fontWeight:600,fontSize:14,zIndex:600,boxShadow:"0 8px 24px rgba(0,0,0,0.35)",maxWidth:360}}>
          {toast.type==="err"?"⚠ ":"♩ "}{toast.msg}
        </div>
      )}

      {/* GİRİŞ MODALI */}
      {modal==="login"&&(
        <Modal title={t.login_title} onClose={()=>setModal(null)}>
          <input style={INP} id="l-email" placeholder={t.email_ph}/>
          <input style={INP} id="l-pass" type="password" placeholder={t.pass_ph}/>
          <button style={BTN} onClick={async()=>{
            const email=document.getElementById("l-email").value;
            const password=document.getElementById("l-pass").value;
            const{data}=await supa.from("users").select("*").eq("email",email).maybeSingle();
            if(data&&data.password===password){
              setUser(data);setModal(null);
              toast_(`${t.welcome.split("!")[0]}, ${data.name.split(" ").slice(-1)[0]}!`);
              setPage("panel");
            }else toast_(t.login_err,"err");
          }}>{t.login_btn}</button>
          <p style={{textAlign:"center",marginTop:16,fontSize:13.5,color:C.muted}}>{t.no_account} <span style={{color:C.rust,cursor:"pointer",fontWeight:600}} onClick={()=>setModal("register")}>{t.register_link}</span></p>
        </Modal>
      )}

      {/* KAYIT MODALI */}
      {modal==="register"&&(
        <Modal title={t.register_title} sub={`${t.title} — ${t.free}`} onClose={()=>setModal(null)}>
          <input style={INP} id="r-name" placeholder={t.name_ph}/>
          <input style={INP} id="r-email" placeholder={t.email_ph}/>
          <input style={INP} id="r-inst" placeholder={t.inst_ph}/>
          <input style={INP} id="r-orcid" placeholder={t.orcid_ph}/>
          <select style={INP} id="r-role">
            <option value="yazar">{t.role_author}</option>
            <option value="hakem">{t.role_reviewer}</option>
          </select>
          <input style={INP} id="r-pass" type="password" placeholder={t.pass_ph}/>
          <button style={BTN} onClick={async()=>{
            const name=document.getElementById("r-name").value;
            const email=document.getElementById("r-email").value;
            const institution=document.getElementById("r-inst").value;
            const orcid=document.getElementById("r-orcid").value;
            const role=document.getElementById("r-role").value;
            const password=document.getElementById("r-pass").value;
            if(!name||!email){toast_(t.required_fields,"err");return;}
            if(!password){toast_(t.required_pass,"err");return;}
            const{data,error}=await supa.from("users").insert([{name,email,institution,orcid,role,password}]).select().single();
            if(error){toast_(t.email_taken,"err");return;}
            setUser(data);await loadUsers();setModal(null);
            toast_(t.welcome);setPage("panel");
          }}>{t.register_free}</button>
        </Modal>
      )}

      {/* MAKALE GÖNDER MODALI */}
      {modal==="makale"&&(
        <Modal title={t.submit_title} sub={`${t.title} — ${t.oa_policy}`} onClose={()=>setModal(null)}>
          <input style={INP} id="a-title" placeholder={`${lang==="tr"?"Makale Başlığı":"Article Title"} *`}/>
          <select style={INP} id="a-field">
            <option value="">{t.fields_select}</option>
            {t.fields.map(f=><option key={f.name} value={f.name}>{f.name}</option>)}
          </select>
          <input style={INP} id="a-coauth" placeholder={t.coauth}/>
          <textarea style={{...INP,height:100,resize:"vertical"}} id="a-abstract" placeholder={t.abstract_ph}/>
          <input style={INP} id="a-kw" placeholder={t.keywords_ph}/>
          <div style={{marginBottom:12}}>
            <div style={{fontFamily:"'Cinzel',serif",fontSize:10,color:C.muted,letterSpacing:1.5,marginBottom:6}}>{t.file_label}</div>
            <input type="file" id="a-file" accept=".pdf,.doc,.docx" style={{width:"100%",padding:"10px 14px",border:`1.5px solid ${C.border}`,borderRadius:6,fontSize:13,background:C.paper,color:C.ink,cursor:"pointer"}}/>
          </div>
          <div id="upload-progress" style={{display:"none",marginBottom:12}}>
            <div style={{background:C.cream,borderRadius:6,height:10,overflow:"hidden",border:`1px solid ${C.border}`}}>
              <div id="upload-bar" style={{height:"100%",background:C.gold,width:"0%",transition:"width 0.3s,background 0.5s",borderRadius:6}}/>
            </div>
            <div id="upload-text" style={{fontSize:12,color:C.muted,marginTop:5,textAlign:"center",fontStyle:"italic"}}>⏳ {t.uploading}</div>
          </div>
          <button id="submit-btn" style={BTN} onClick={async()=>{
            const title=document.getElementById("a-title").value;
            const field=document.getElementById("a-field").value;
            const abstract=document.getElementById("a-abstract").value;
            const keywords=document.getElementById("a-kw").value;
            const coauthors=document.getElementById("a-coauth").value;
            const file=document.getElementById("a-file").files?.[0];
            if(!title||!abstract||!field){toast_(t.submit_err,"err");return;}
            const btn=document.getElementById("submit-btn");
            btn.disabled=true;btn.innerText=t.sending;
            let file_url=null;
            if(file){
              const prog=document.getElementById("upload-progress");
              const bar=document.getElementById("upload-bar");
              const txt=document.getElementById("upload-text");
              prog.style.display="block";
              let pct=0;const iv=setInterval(()=>{pct=Math.min(pct+10,85);bar.style.width=pct+"%";},200);
              const fname=`${Date.now()}_${file.name.replace(/[^a-zA-Z0-9._-]/g,"_")}`;
              const{error:ue}=await supa.storage.from("makaleler").upload(fname,file,{upsert:true});
              clearInterval(iv);
              if(ue){bar.style.width="100%";bar.style.background="#ef4444";txt.innerText=t.upload_err+ue.message;btn.disabled=false;btn.innerText=t.submit_btn;return;}
              bar.style.width="100%";bar.style.background="#16a34a";txt.innerText="✅ "+t.uploaded;
              const{data:ud}=supa.storage.from("makaleler").getPublicUrl(fname);
              file_url=ud?.publicUrl;
            }
            const{error}=await supa.from("articles").insert([{title,field,abstract,keywords,coauthors,author:user.name,author_email:user.email,status:"beklemede",file_url}]);
            btn.disabled=false;btn.innerText=t.submit_btn;
            if(error){toast_(t.login_err,"err");return;}
            await loadArticles();
            sendMail(user.name,user.email,"article_received");
            setModal(null);toast_(t.submit_success);
          }}>{t.submit_btn}</button>
        </Modal>
      )}

      {/* HAKEM ATA MODALI */}
      {hakemModal&&(
        <HakemAtaModal article={hakemModal} users={users} onClose={()=>setHakemModal(null)} toast_={toast_} loadArticles={loadArticles}/>
      )}

      {/* DEĞERLENDİRME SONUÇLARI MODALI */}
      {reviewModalArticle&&(
        <ReviewResultsModal
          article={reviewModalArticle}
          reviews={reviewModalArticle._reviews||[]}
          onClose={()=>setReviewModalArticle(null)}
          t={t} lang={lang} toast_={toast_}
        />
      )}
    </div>
  );
}

const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
</body>
</html>
