/* ── KOMPAKT MESSAGES TAB ── */
function MessagesTab({user, t, articles, toast_}) {
  const [messages, setMessages] = useState([]);
  const [selectedArticle, setSelectedArticle] = useState("");
  const [msgText, setMsgText] = useState("");
  const [replyText, setReplyText] = useState({});
  const [busy, setBusy] = useState(false);
  const [loading, setLoading] = useState(true);

  const isEditor = user?.role === "editor";

  const loadMessages = useCallback(async()=>{
    setLoading(true);
    let query = supa.from("editor_messages").select("*");
    
    if (isEditor) {
      query = query.or(`to_email.eq.${user.email},from_email.eq.${user.email},is_system_notification.eq.true`);
    } else {
      query = query.eq("author_email", user.email);
    }
    
    const {data, error} = await query.order("created_at",{ascending:false});
    if (!error) setMessages(data || []);
    setLoading(false);
  },[user, isEditor]);

  useEffect(()=>{ loadMessages(); },[loadMessages]);

  const sendMessage = async()=>{
    if(!msgText.trim()) return;
    if(isEditor && !selectedArticle){ toast_("Lütfen makale seçin", "err"); return; }
    
    setBusy(true);
    const art = isEditor ? articles.find(a=>a.id===selectedArticle) : null;
    
    const messageData = {
      from_editor: isEditor,
      from_name: user.name,
      from_email: user.email,
      body: msgText.trim(),
      parent_id: null,
    };

    if (isEditor) {
      messageData.to_email = art?.author_email;
      messageData.author_email = art?.author_email;
      messageData.author_name = art?.author;
      messageData.article_id = selectedArticle;
      messageData.article_title = art?.title;
      messageData.is_system_notification = false;
    } else {
      messageData.to_email = "arsisakademik@gmail.com";
      messageData.author_email = user.email;
      messageData.author_name = user.name;
    }

    const {error} = await supa.from("editor_messages").insert([messageData]);
    setBusy(false);
    
    if (error) {
      toast_("Mesaj gönderilemedi.", "err");
    } else {
      setMsgText(""); 
      setSelectedArticle("");
      await loadMessages();
      toast_(t.msg_sent || "✓ Mesaj gönderildi.");
    }
  };

  const sendReply = async(parentId, parentMsg)=>{
    const text = replyText[parentId]?.trim();
    if(!text) return;
    
    const replyData = {
      from_editor: isEditor,
      from_name: user.name,
      from_email: user.email,
      to_email: isEditor ? parentMsg.author_email : "arsisakademik@gmail.com",
      author_email: parentMsg.author_email,
      author_name: parentMsg.author_name,
      article_id: parentMsg.article_id,
      article_title: parentMsg.article_title,
      body: text,
      parent_id: parentId,
      is_system_notification: false,
    };

    await supa.from("editor_messages").insert([replyData]);
    setReplyText(prev=>({...prev,[parentId]:""}));
    await loadMessages();
    toast_(t.msg_reply_sent || "✓ Yanıt gönderildi.");
  };

  const rootMessages = messages.filter(m => !m.parent_id);
  const getReplies = (parentId) => messages.filter(m => m.parent_id === parentId);
  const displayMessages = isEditor ? rootMessages : rootMessages.filter(m => m.author_email === user.email || m.to_email === user.email || m.from_email === user.email);

  return(
    <div>
      <h3 style={{fontFamily:"'Cinzel',serif",margin:"0 0 20px",fontSize:17,letterSpacing:1,color:C.ink}}>
        {isEditor ? "EDİTÖR MESAJLARI" : "MESAJLARIM"}
      </h3>

      <div style={{background:C.cream,borderRadius:12,padding:"22px 26px",marginBottom:28,border:`1px solid ${C.border}`}}>
        <div style={{fontFamily:"'Cinzel',serif",fontSize:11,color:C.rust,letterSpacing:1.5,marginBottom:14}}>
          {isEditor ? "YAZARA MESAJ GÖNDER" : "EDİTÖRE MESAJ GÖNDER"}
        </div>
        
        {isEditor && (
          <select value={selectedArticle} onChange={e=>setSelectedArticle(e.target.value)} style={{...INP,marginBottom:10}}>
            <option value="">Makale Seçin *</option>
            {articles.map(a=>(<option key={a.id} value={a.id}>{a.title} — {a.author}</option>))}
          </select>
        )}
        
        <textarea value={msgText} onChange={e=>setMsgText(e.target.value)}
          placeholder={isEditor ? "Yazarınıza iletmek istediğiniz mesajı yazın..." : "Editöre iletmek istediğiniz mesajı yazın..."}
          rows={3} style={{...INP,height:90,resize:"vertical"}}/>
        
        <button onClick={sendMessage} disabled={busy}
          style={{background:C.ink,color:C.gold,border:"none",padding:"10px 26px",borderRadius:7,cursor:"pointer",fontFamily:"'Cinzel',serif",fontSize:11,fontWeight:700,letterSpacing:1,opacity:busy?0.6:1}}>
          {busy ? "GÖNDERİLİYOR..." : "GÖNDER"}
        </button>
      </div>

      <div style={{fontFamily:"'Cinzel',serif",fontSize:11,color:C.muted,letterSpacing:1.5,marginBottom:14}}>
        GELEN KUTUSU {loading && <span style={{marginLeft:10,fontSize:10}}>(Yükleniyor...)</span>}
      </div>

      {displayMessages.length === 0 ? (
        <div style={{textAlign:"center",padding:"40px",color:C.muted,fontStyle:"italic",background:C.cream,borderRadius:12,border:`1px solid ${C.border}`}}>
          Henüz mesaj bulunmuyor.
        </div>
      ) : displayMessages.map(msg => {
        const replies = getReplies(msg.id);
        const isSystem = msg.is_system_notification;
        const isFromMe = msg.from_email === user.email;
        
        return(
          <div key={msg.id} style={{
            border:`2px solid ${isSystem ? C.gold : C.border}`,
            borderRadius:12,
            marginBottom:14,
            overflow:"hidden",
            background: isSystem ? "#fffbf0" : "#fff",
            boxShadow: isSystem ? `0 4px 12px ${C.gold}30` : 'none'
          }}>
            <div style={{
              background: isSystem ? `${C.gold}20` : "#fff",
              padding:"16px 20px",
              borderBottom: replies.length > 0 ? `1px solid ${C.border}` : "none"
            }}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
                <div style={{flex:1}}>
                  <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
                    {isSystem && <span style={{fontSize:11,background:C.gold,color:C.ink,padding:"3px 10px",borderRadius:4,fontWeight:700}}>📋 SİSTEM</span>}
                    <span style={{fontFamily:"'Cinzel',serif",fontSize:11,fontWeight:700,color: msg.from_editor ? C.teal : (isFromMe ? C.rust : C.ink)}}>
                      {isFromMe ? "Siz" : msg.from_name} 
                      {msg.from_editor && !isFromMe ? " (Editör)" : ""}
                      {!msg.from_editor && !isFromMe && !isSystem ? " (Yazar)" : ""}
                    </span>
                    {msg.article_title && <span style={{fontSize:11,color:C.muted,fontStyle:"italic"}}>· {msg.article_title}</span>}
                  </div>
                  <span style={{fontSize:11,color:C.muted}}>{new Date(msg.created_at).toLocaleString('tr-TR')}</span>
                </div>
              </div>
              
              <p style={{margin:0,fontSize:14,color:isSystem ? C.ink : "#333",lineHeight:1.75,whiteSpace:"pre-wrap",fontFamily: isSystem ? "monospace" : "inherit"}}>
                {msg.body}
              </p>
            </div>

            {replies.map((r, i) => (
              <div key={r.id} style={{
                background: r.from_email === user.email ? `${C.gold}08` : C.cream,
                padding:"12px 20px",
                borderBottom: i < replies.length - 1 ? `1px solid ${C.border}44` : "none"
              }}>
                <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:6}}>
                  <span style={{fontFamily:"'Cinzel',serif",fontSize:10,fontWeight:700,color: r.from_editor ? C.teal : (r.from_email === user.email ? C.rust : C.ink)}}>
                    {r.from_email === user.email ? "↩ Siz" : `↩ ${r.from_name}`}
                    {r.from_editor && r.from_email !== user.email ? " (Editör)" : ""}
                  </span>
                  <span style={{fontSize:10,color:C.muted}}>{new Date(r.created_at).toLocaleString('tr-TR')}</span>
                </div>
                <p style={{margin:0,fontSize:13.5,color:"#444",lineHeight:1.7}}>{r.body}</p>
              </div>
            ))}

            <div style={{background:C.paper,borderTop:`1px solid ${C.border}`,padding:"10px 20px",display:"flex",gap:10}}>
              <input
                value={replyText[msg.id] || ""}
                onChange={e => setReplyText(prev => ({...prev, [msg.id]: e.target.value}))}
                placeholder="Yanıtınızı yazın..."
                style={{flex:1,padding:"8px 12px",border:`1.5px solid ${C.border}`,borderRadius:6,fontSize:13,outline:"none",background:"#fff",color:C.ink}}
                onKeyDown={e => {if(e.key === "Enter" && !e.shiftKey) {e.preventDefault();sendReply(msg.id, msg);}}}
              />
              <button onClick={() => sendReply(msg.id, msg)}
                style={{background: C.gold,color: C.ink,border:"none",padding:"8px 16px",borderRadius:6,cursor:"pointer",fontFamily:"'Cinzel',serif",fontSize:10,fontWeight:700,whiteSpace:"nowrap"}}>
                ↩ YANITLA
              </button>
            </div>
          </div>
        );
      })}
    </div>
  );
}

/* ── KOMPAKT REVIEW FORM ── */
function ReviewForm({review, article, lang, t, onSubmit, readOnly = false}) {
  const [answers, setAnswers] = useState({});
  const [decision, setDecision] = useState("");
  const [commentsEditor, setCommentsEditor] = useState("");
  const [commentsAuthor, setCommentsAuthor] = useState("");
  const [busy, setBusy] = useState(false);
  const [activeSection, setActiveSection] = useState(0);

  useEffect(() => {
    if (readOnly && review?.answers_json) {
      try {
        const parsed = JSON.parse(review.answers_json);
        setAnswers(parsed);
        setDecision(review.decision || "");
        setCommentsEditor(review.comments_editor || "");
        setCommentsAuthor(review.comments_author || "");
      } catch (e) {console.error(e);}
    }
  }, [readOnly, review]);

  const totalQuestions = REVIEW_SECTIONS.flatMap(s=>s.questions).length;
  const answeredCount = useMemo(()=>REVIEW_SECTIONS.flatMap(s=>s.questions).filter(q=>answers[q.id]>=1&&answers[q.id]<=5).length,[answers]);
  const allAnswered = readOnly ? true : answeredCount === totalQuestions;

  const sectionScore = (section)=>{
    const vals = section.questions.map(q=>answers[q.id]).filter(v=>v>0);
    if(!vals.length) return 0;
    return (vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1);
  };

  const totalScore = useMemo(()=>{
    const allQ = REVIEW_SECTIONS.flatMap(s=>s.questions);
    const vals = allQ.map(q=>answers[q.id]).filter(v=>v>0);
    if(!vals.length) return 0;
    return (vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(2);
  },[answers]);

  const handleSubmit = async()=>{
    if(readOnly || !allAnswered || !decision) return;
    setBusy(true);
    await onSubmit({answers, decision, commentsEditor, commentsAuthor, totalScore});
    setBusy(false);
  };

  const decisions=[{k:"accept",l:"Kabul",c:"#065f46",bg:"#d1fae5"},{k:"minor",l:"Küçük Revizyon",c:"#b45309",bg:"#fef3c7"},{k:"major",l:"Büyük Revizyon",c:"#6d28d9",bg:"#ede9fe"},{k:"reject",l:"Red",c:"#991b1b",bg:"#fee2e2"}];
  const isSectionComplete = (sec) => sec.questions.every(q=>answers[q.id]>=1);

  // READONLY GÖRÜNÜMÜ
  if (readOnly) {
    return(
      <div>
        <div style={{background:C.ink,borderRadius:12,padding:"20px 24px",marginBottom:24}}>
          <div style={{fontFamily:"'Cinzel',serif",fontSize:9,color:C.gold,letterSpacing:3,marginBottom:8}}>✓ TAMAMLANMIŞ DEĞERLENDİRME</div>
          <h3 style={{fontFamily:"'Cinzel',serif",color:"#f0e6cc",fontSize:15,margin:"0 0 8px"}}>{article?.title}</h3>
          <div style={{display:"flex",gap:16,flexWrap:"wrap"}}>
            <span style={{fontSize:12,color:C.gold}}>{article?.field}</span>
            {article?.file_url && <a href={article.file_url} target="_blank" style={{fontSize:12,color:"#a0c4bc"}}>📄 İndir</a>}
          </div>
        </div>

        <div style={{background:"#f0fdf4",borderRadius:12,padding:"24px 28px",marginBottom:20,border:`2px solid #16a34a`}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
            <div>
              <div style={{fontFamily:"'Cinzel',serif",fontSize:11,color:"#16a34a",letterSpacing:1}}>DEĞERLENDİRME KAYDEDİLDİ</div>
              <div style={{fontSize:13,color:"#166534",marginTop:4}}>Bu değerlendirme tamamlanmış ve kilitlenmiştir.</div>
            </div>
            <div style={{textAlign:"right"}}>
              <div style={{fontFamily:"'Cinzel',serif",fontSize:36,fontWeight:900,color:C.gold}}>{totalScore}<span style={{fontSize:18}}>/5</span></div>
            </div>
          </div>
          
          <div style={{background:"#fff",borderRadius:10,padding:"16px 20px",marginBottom:16,display:"flex",alignItems:"center",gap:12}}>
            <span style={{fontSize:24}}>{{accept:"✅",minor:"📝",major:"✏️",reject:"❌"}[decision] || "📋"}</span>
            <div>
              <div style={{fontSize:11,color:C.muted}}>KARAR</div>
              <div style={{fontSize:15,fontWeight:700,color:decisions.find(d=>d.k===decision)?.c||C.ink}}>
                {{accept:"Kabul",minor:"Küçük Revizyon",major:"Büyük Revizyon",reject:"Red"}[decision]}
              </div>
            </div>
          </div>

          <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:10,marginBottom:16}}>
            {REVIEW_SECTIONS.map(s=>{
              const sc = sectionScore(s);
              return(
                <div key={s.id} style={{background:"#fff",borderRadius:8,padding:"12px 16px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <div style={{display:"flex",alignItems:"center",gap:8}}>
                    <span style={{fontSize:16,color:s.color}}>{s.icon}</span>
                    <span style={{fontSize:11,color:C.muted}}>{s.title[lang]||s.title.tr}</span>
                  </div>
                  <span style={{fontFamily:"'Cinzel',serif",fontSize:16,fontWeight:700,color:sc?s.color:"#ccc"}}>{sc || "—"}</span>
                </div>
              );
            })}
          </div>

          {commentsAuthor && (
            <div style={{background:"#fff",borderRadius:10,padding:"16px 20px",marginBottom:12,borderLeft:`4px solid ${C.teal}`}}>
              <div style={{fontFamily:"'Cinzel',serif",fontSize:10,color:C.teal,letterSpacing:1,marginBottom:8}}>YAZARA İLETİLEN YORUM</div>
              <p style={{margin:0,fontSize:14,color:"#444",lineHeight:1.7,whiteSpace:"pre-wrap"}}>{commentsAuthor}</p>
            </div>
          )}

          {commentsEditor && (
            <div style={{background:"#fffbf0",borderRadius:10,padding:"16px 20px",border:`1px dashed ${C.gold}`}}>
              <div style={{fontFamily:"'Cinzel',serif",fontSize:10,color:C.rust,letterSpacing:1,marginBottom:8}}>🔒 EDİTÖRE GİZLİ NOT (Yazar Görmez)</div>
              <p style={{margin:0,fontSize:13.5,color:"#555",lineHeight:1.7,whiteSpace:"pre-wrap"}}>{commentsEditor}</p>
            </div>
          )}
        </div>

        <div style={{background:C.cream,borderRadius:10,padding:"16px 20px",textAlign:"center",border:`1px solid ${C.border}`}}>
          <div style={{fontSize:24,marginBottom:8}}>🔒</div>
          <p style={{margin:0,fontSize:13,color:C.muted,fontStyle:"italic"}}>
            Bu değerlendirme <strong>{review?.completed_at?.split("T")[0]}</strong> tarihinde tamamlanmıştır.<br/>
            Değerlendirme sonuçları editöre iletilmiş ve kaydedilmiştir.
          </p>
        </div>
      </div>
    );
  }

  // NORMAL DÜZENLEME MODU
  return(
    <div>
      <div style={{background:C.ink,borderRadius:12,padding:"20px 24px",marginBottom:24}}>
        <div style={{fontFamily:"'Cinzel',serif",fontSize:9,color:C.gold,letterSpacing:3,marginBottom:8}}>DEĞERLENDİRİLECEK MAKALE</div>
        <h3 style={{fontFamily:"'Cinzel',serif",color:"#f0e6cc",fontSize:15,margin:"0 0 8px"}}>{article?.title}</h3>
        <div style={{display:"flex",gap:16,flexWrap:"wrap"}}>
          <span style={{fontSize:12,color:C.gold}}>{article?.field}</span>
          {article?.file_url&&<a href={article.file_url} target="_blank" style={{fontSize:12,color:"#a0c4bc"}}>📄 İndir</a>}
        </div>
      </div>

      <div style={{background:C.cream,borderRadius:10,padding:"14px 18px",marginBottom:20,border:`1px solid ${C.border}`}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
          <span style={{fontFamily:"'Cinzel',serif",fontSize:10,color:C.muted,letterSpacing:1}}>GENEL İLERLEME</span>
          <span style={{fontFamily:"'Cinzel',serif",fontSize:13,fontWeight:700,color:allAnswered?C.teal:C.rust}}>{answeredCount} / {totalQuestions}</span>
        </div>
        <div style={{background:C.border,borderRadius:6,height:8,overflow:"hidden"}}>
          <div style={{height:"100%",width:`${(answeredCount/totalQuestions)*100}%`,background:allAnswered?C.teal:C.gold,borderRadius:6,transition:"width 0.3s"}}/>
        </div>
        {!allAnswered&&<p style={{fontSize:11,color:C.muted,marginTop:6,fontStyle:"italic"}}>Tüm bölümleri tamamladıktan sonra değerlendirmeyi gönderebilirsiniz.</p>}
        {allAnswered&&<p style={{fontSize:11,color:C.teal,marginTop:6,fontWeight:700}}>✓ Tüm sorular yanıtlandı. Aşağıdan kararınızı verin.</p>}
      </div>

      <div style={{display:"flex",gap:6,marginBottom:24}}>
        {REVIEW_SECTIONS.map((s,i)=>(
          <button key={s.id} onClick={()=>setActiveSection(i)}
            style={{flex:1,padding:"8px 4px",borderRadius:8,border:`2px solid ${activeSection===i?s.color:isSectionComplete(s)?`${s.color}88`:"#d4c9b4"}`,background:activeSection===i?s.color:isSectionComplete(s)?`${s.color}15`:"#fff",cursor:"pointer"}}>
            <div style={{fontSize:16,color:activeSection===i?"#fff":s.color}}>{isSectionComplete(s)?"✓":s.icon}</div>
            <div style={{fontSize:9,fontFamily:"'Cinzel',serif",color:activeSection===i?"#fff":C.muted}}>{i+1}/{REVIEW_SECTIONS.length}</div>
          </button>
        ))}
      </div>

      {REVIEW_SECTIONS.map((sec,si)=>(
        si===activeSection&&(
          <div key={sec.id} style={{background:"#fff",borderRadius:12,padding:"28px 32px",border:`2px solid ${sec.color}44`,borderTop:`4px solid ${sec.color}`,marginBottom:20}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
              <div style={{display:"flex",alignItems:"center",gap:10}}>
                <span style={{fontSize:24,color:sec.color}}>{sec.icon}</span>
                <div>
                  <h4 style={{fontFamily:"'Cinzel',serif",margin:0,fontSize:14,fontWeight:700}}>{sec.title[lang]||sec.title.tr}</h4>
                  <div style={{fontSize:11,color:C.muted}}>Bölüm {si+1} / {REVIEW_SECTIONS.length}</div>
                </div>
              </div>
              {sectionScore(sec)>0&&<div style={{textAlign:"right"}}><div style={{fontFamily:"'Cinzel',serif",fontSize:20,fontWeight:700,color:sec.color}}>{sectionScore(sec)}</div></div>}
            </div>
            {sec.questions.map(q=>(
              <LikertQuestion key={q.id} question={q} lang={lang} value={answers[q.id]||0} onChange={v=>setAnswers(prev=>({...prev,[q.id]:v}))}/>
            ))}
            <div style={{display:"flex",justifyContent:"flex-end",marginTop:10,gap:8}}>
              {si>0&&<button onClick={()=>setActiveSection(si-1)} style={{background:"none",border:`1px solid ${C.border}`,borderRadius:7,padding:"8px 18px",cursor:"pointer"}}>← Önceki</button>}
              {si<REVIEW_SECTIONS.length-1&&<button onClick={()=>setActiveSection(si+1)} style={{background:sec.color,color:"#fff",border:"none",borderRadius:7,padding:"8px 18px",cursor:"pointer"}}>Sonraki →</button>}
            </div>
          </div>
        )
      ))}

      <div style={{background:allAnswered?C.cream:"#f0eee8",borderRadius:12,padding:"28px 32px",border:allAnswered?`2px solid ${C.teal}`:`1px solid ${C.border}`,marginBottom:20,opacity:allAnswered?1:0.55,position:"relative"}}>
        {!allAnswered && <div style={{position:"absolute",inset:0,borderRadius:12,zIndex:10,cursor:"not-allowed"}}/>}
        
        <div style={{fontFamily:"'Cinzel',serif",fontSize:11,color:allAnswered?C.teal:C.muted,letterSpacing:1.5,marginBottom:16}}>
          {allAnswered?"✓ GENEL DEĞERLENDİRME":"🔒 Tüm soruları yanıtlayın"}
        </div>

        <div style={{display:"flex",alignItems:"center",gap:16,background:"#fff",borderRadius:10,padding:"16px 20px",marginBottom:20,border:`1px solid ${C.border}`}}>
          <div style={{fontFamily:"'Cinzel',serif",fontSize:36,fontWeight:900,color:C.gold}}>{totalScore||"—"}</div>
          <div>
            <div style={{fontFamily:"'Cinzel',serif",fontSize:11,color:C.muted}}>ORTALAMA PUAN</div>
            <div style={{fontSize:12,color:C.muted}}>5 üzerinden · {totalQuestions} soru</div>
          </div>
        </div>

        <div style={{marginBottom:16}}>
          <div style={{fontFamily:"'Cinzel',serif",fontSize:10,color:C.rust,letterSpacing:1.5,marginBottom:10}}>KARAR *</div>
          <div style={{display:"flex",gap:8}}>
            {decisions.map(d=>(
              <button key={d.k} onClick={()=>allAnswered&&setDecision(d.k)}
                style={{flex:1,padding:"12px 4px",borderRadius:8,border:`2px solid ${decision===d.k?d.c:C.border}`,background:decision===d.k?d.bg:"#fff",color:d.c,fontSize:12,fontWeight:700,cursor:allAnswered?"pointer":"default"}}>
                {d.l}
              </button>
            ))}
          </div>
        </div>

        <div style={{marginBottom:12}}>
          <div style={{fontFamily:"'Cinzel',serif",fontSize:10,color:C.teal,letterSpacing:1.5,marginBottom:8}}>YAZARA YORUM</div>
          <textarea value={commentsAuthor} onChange={e=>allAnswered&&setCommentsAuthor(e.target.value)}
            placeholder="Yazara iletilecek genel değerlendirme yorumunuz..." rows={4} style={{...INP,resize:"vertical"}}/>
        </div>

        <div style={{marginBottom:20}}>
          <div style={{fontFamily:"'Cinzel',serif",fontSize:10,color:C.rust,letterSpacing:1.5,marginBottom:8}}>🔒 EDİTÖRE GİZLİ NOT</div>
          <textarea value={commentsEditor} onChange={e=>allAnswered&&setCommentsEditor(e.target.value)}
            placeholder="Yazara iletilmeyecek, yalnızca editörün göreceği gizli notlarınız..." rows={3} style={{...INP,resize:"vertical",background:"#fffbf0"}}/>
        </div>

        <button onClick={handleSubmit} disabled={busy || !allAnswered || !decision}
          style={{width:"100%",padding:"15px 0",borderRadius:9,border:"none",background:(!allAnswered||!decision)?"#ccc":C.teal,color:(!allAnswered||!decision)?"#888":"#fff",cursor:(!allAnswered||!decision)?"not-allowed":"pointer",fontFamily:"'Cinzel',serif",fontSize:14,fontWeight:700}}>
          {busy ? "GÖNDERİLİYOR..." : (!allAnswered ? "🔒 Önce tüm soruları yanıtlayın" : !decision ? "Lütfen bir karar seçin" : "✓ DEĞERLENDİRMEYİ GÖNDER")}
        </button>
      </div>
    </div>
  );
}

/* ── HAKEM PANELİ ── */
function HakemPanel({user, t, lang, toast_}) {
  const [atamalar, setAtamalar] = useState([]);
  const [makaleler, setMakaleler] = useState({});
  const [acik, setAcik] = useState(null);

  const yukle = useCallback(async()=>{
    const{data}=await supa.from("reviews").select("*").eq("reviewer_email",user.email).order("assigned_at",{ascending:false});
    if(!data) return;
    setAtamalar(data);
    const ids=[...new Set(data.map(r=>r.article_id))];
    if(ids.length>0){
      const{data:arts}=await supa.from("articles").select("*").in("id",ids);
      if(arts){const map={};arts.forEach(a=>{map[a.id]=a;});setMakaleler(map);}
    }
  },[user.email]);

  useEffect(()=>{yukle();},[yukle]);

  const handleReviewSubmit = async(reviewId, articleId, {answers, decision, commentsEditor, commentsAuthor, totalScore})=>{
    const statusMap={accept:"baskida",minor:"revizyon",major:"revizyon",reject:"reddedildi"};
    const decisionLabels={accept:"Kabul",minor:"Küçük Revizyon",major:"Büyük Revizyon",reject:"Red"};

    // 1. Review kaydını güncelle
    await supa.from("reviews").update({
      status:"tamamlandi",
      decision,
      answers_json: JSON.stringify(answers),
      comments_editor: commentsEditor,
      comments_author: commentsAuthor,
      total_score: parseFloat(totalScore),
      completed_at: new Date().toISOString()
    }).eq("id",reviewId);

    // 2. Makale durumunu güncelle
    await supa.from("articles").update({status:statusMap[decision]||"revizyon"}).eq("id",articleId);

    // 3. Makale bilgilerini çek
    const{data:artData}=await supa.from("articles").select("*").eq("id",articleId).maybeSingle();

    // 4. EDİTÖRE BİLDİRİM GÖNDER - DÜZELTİLMİŞ
    const editorNotification = [
      `📋 YENİ HAKEM DEĞERLENDİRMESİ TAMAMLANDI`,
      ``,
      `Makale: "${artData?.title || '—'}"`,
      `Yazar: ${artData?.author || '—'} (${artData?.author_email || '—'})`,
      ``,
      `👤 Hakem: ${user.name} (${user.email})`,
      `📊 Karar: ${decisionLabels[decision] || decision}`,
      `⭐ Ortalama Puan: ${totalScore} / 5.0`,
      ``,
      `━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━`,
      `📄 DETAYLI SONUÇLAR:`,
      `━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━`,
    ];

    REVIEW_SECTIONS.forEach(sec => {
      const vals = sec.questions.map(q => answers[q.id]).filter(v => v > 0);
      const avg = vals.length ? (vals.reduce((a,b) => a+b, 0) / vals.length).toFixed(1) : "—";
      editorNotification.push(`${sec.icon} ${sec.title.tr}: ${avg}/5`);
    });

    editorNotification.push(
      ``,
      `━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━`,
      `💬 YAZARA İLETİLECEK YORUM:`,
      `━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━`,
      commentsAuthor || "(Yorum girilmemiş)",
      ``,
      `━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━`,
      `🔒 EDİTÖRE ÖZEL NOT (Gizli):`,
      `━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━`,
      commentsEditor || "(Gizli not girilmemiş)",
      ``,
      `---`,
      `ARSİS Değerlendirme Sistemi`,
      `Tarih: ${new Date().toLocaleString('tr-TR')}`
    );

    // Editör bildirimi - DÜZELTİLMİŞ
    await supa.from("editor_messages").insert([{
      from_editor: true,
      from_name: user.name,
      from_email: user.email,
      to_email: "arsisakademik@gmail.com",
      author_email: artData?.author_email,
      author_name: artData?.author,
      article_id: articleId,
      article_title: artData?.title || "",
      body: editorNotification.join("\n"),
      parent_id: null,
      is_system_notification: true,
      notification_type: "review_completed",
      review_id: reviewId,
    });

    toast_("✓ Değerlendirme tamamlandı ve editöre iletildi.");
    setAcik(null);
    yukle();
  };

  return(
    <div>
      <h3 style={{fontFamily:"'Cinzel',serif",margin:"0 0 6px",fontSize:17,letterSpacing:1,color:C.ink}}>{t.review_panel}</h3>
      <p style={{fontSize:13,color:C.muted,marginBottom:24,fontStyle:"italic"}}>{t.review_assigned}</p>

      {atamalar.length===0?(
        <div style={{textAlign:"center",padding:"60px 20px",color:C.muted,background:C.cream,borderRadius:12,border:`1px solid ${C.border}`}}>
          <div style={{fontSize:32,marginBottom:12}}>⊕</div>
          <p style={{fontStyle:"italic"}}>Henüz size atanmış makale yok.</p
