const supa = {
  from:(table)=>({
    select:(cols)=>({
      order:(col,opts)=>({then:(fn)=>fn({data:_mockData[table]||[]})}),
      eq:(col,val)=>({
        order:(c,o)=>({then:(fn)=>fn({data:(_mockData[table]||[]).filter(r=>r[col]===val)})}),
        single:()=>({then:(fn)=>fn({data:(_mockData[table]||[]).find(r=>r[col]===val)||null})}),
        then:(fn)=>fn({data:(_mockData[table]||[]).filter(r=>r[col]===val)}),
      }),
      in:(col,vals)=>({order:(c,o)=>({then:(fn)=>fn({data:(_mockData[table]||[]).filter(r=>vals.includes(r[col]))})}),then:(fn)=>fn({data:(_mockData[table]||[]).filter(r=>vals.includes(r[col]))})}),
      single:()=>({then:(fn)=>fn({data:null})}),
      then:(fn)=>fn({data:_mockData[table]||[]}),
    }),
    insert:(rows)=>({
      select:()=>({single:()=>new Promise(res=>{const row={...rows[0],id:Date.now(),created_at:new Date().toISOString()};(_mockData[table]=_mockData[table]||[]).push(row);res({data:row,error:null});})}),
      then:(fn)=>{ (_mockData[table]=_mockData[table]||[]).push(...rows.map(r=>({...r,id:Date.now(),created_at:new Date().toISOString()})));fn({error:null}); }
    }),
    update:(vals)=>({
      eq:(col,val)=>({then:(fn)=>{(_mockData[table]||[]).forEach(r=>{if(r[col]===val)Object.assign(r,vals);});fn({error:null});}})
    }),
  }),
  storage:{from:()=>({upload:()=>new Promise(res=>res({error:null})),getPublicUrl:()=>({data:{publicUrl:"#"}})})}
};

function WaveLogo({size=28}) {
  return (
    <div style={{display:"flex",alignItems:"center",gap:2,height:size}}>
      {[0.5,0.9,0.65,1,0.7,0.9,0.5].map((h,i)=>(

// ─── TOAST ───────────────────────────────────────────────────────────────────
function Toast({msg,type}) {
  if(!msg) return null;
  return (
    <div style={{
      position:"fixed", bottom:24, left:"50%", transform:"translateX(-50%)",
      background: type==="err"?"#991b1b":G.teal,
      color:"#fff", padding:"12px 28px", borderRadius:8,
      fontSize:14, fontWeight:600, zIndex:1000, boxShadow:"0 4px 20px rgba(0,0,0,0.3)"

}

// ─── FORUM: YENİ KONU FORMU ──────────────────────────────────────────────────
function ForumYeniKonu({user, onGonder}) {
  const baslikRef = React.useRef(null);
  const icerikRef = React.useRef(null);
  const [yukleniyor, setYukleniyor] = React.useState(false);

  const gonder = async () => {
    const baslik = baslikRef.current?.value?.trim();
    const icerik = icerikRef.current?.value?.trim();
    if (!baslik || !icerik) { alert("Konu başlığı ve mesaj zorunludur."); return; }
    setYukleniyor(true);
    await onGonder(baslik, icerik);
    baslikRef.current.value = "";
    icerikRef.current.value = "";
    setYukleniyor(false);
  };

  return (
    <div style={{background:G.cream,borderRadius:12,padding:"20px 24px",marginBottom:24,border:`1px solid ${G.border}`}}>
      <div style={{fontSize:11,color:G.rust,letterSpacing:1.5,marginBottom:12,fontWeight:700}}>YENİ MESAJ</div>
      <input ref={baslikRef} placeholder="Konu başlığı *" style={inp}/>
      <textarea ref={icerikRef} placeholder="Mesajınızı yazın..." rows={4}
        style={{...inp,resize:"vertical",marginBottom:12}}/>
      <button onClick={gonder} disabled={yukleniyor}
        style={{...btn_gold,width:"auto",padding:"10px 24px",opacity:yukleniyor?0.6:1}}>
        {yukleniyor?"Gönderiliyor...":"GÖNDER"}
      </button>
    </div>
  );
}

// ─── FORUM: YANIT KUTUSU ─────────────────────────────────────────────────────
function ForumYanit({postId, onYanit}) {
  const ref = React.useRef(null);
  const [yukleniyor, setYukleniyor] = React.useState(false);

  const gonder = async () => {
    const text = ref.current?.value?.trim();
    if (!text) return;
    setYukleniyor(true);
    await onYanit(postId, text);
    ref.current.value = "";
    setYukleniyor(false);
  };

  return (
    <div style={{
      background:G.paper, borderTop:`1px solid ${G.border}`,
      padding:"10px 18px", display:"flex", gap:8, alignItems:"center"
    }}>
      <input
        ref={ref}
        placeholder="Yanıtınızı yazın..."
        style={{flex:1, padding:"8px 12px", border:`1.5px solid ${G.border}`, borderRadius:6, fontSize:13}}
        onKeyDown={e=>{ if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();gonder();} }}
      />
      <button onClick={gonder} disabled={yukleniyor}
        style={{
          background:G.gold, color:G.ink, border:"none",
          padding:"8px 16px", borderRadius:6, fontSize:11, fontWeight:700, whiteSpace:"nowrap",
          opacity:yukleniyor?0.6:1
        }}>
        {yukleniyor?"...":"↩ YANIT"}
      </button>
    </div>
  );
}

// ─── FORUM: TEK GÖNDERI ──────────────────────────────────────────────────────
function ForumGonderi({post, user, onYanit}) {
  const [yanitlar, setYanitlar] = React.useState([]);
  const [acik, setAcik] = React.useState(false);
  const isEditor = user?.role === "editor";

  React.useEffect(() => {
    if (acik) {
      supa.from("forum_replies").select("*")
        .eq("post_id", post.id).order("created_at", {ascending:true})
        .then(({data}) => { if (data) setYanitlar(data); });
    }
  }, [acik, post.id]);

  const yanitEkle = async (postId, text) => {
    await onYanit(postId, text);
    const {data} = await supa.from("forum_replies").select("*")
      .eq("post_id", post.id).order("created_at", {ascending:true});
    if (data) setYanitlar(data);
  };

  return (
    <div style={{border:`1px solid ${G.border}`,borderRadius:12,marginBottom:10,overflow:"hidden"}}>
      <div
        onClick={() => setAcik(!acik)}
        style={{
          background:G.white, padding:"14px 18px", cursor:"pointer",
          display:"flex", justifyContent:"space-between", alignItems:"flex-start", gap:12
        }}
      >
        <div style={{flex:1}}>
          <div style={{fontWeight:700,fontSize:13.5,color:G.ink,marginBottom:3}}>{post.title}</div>
          <div style={{fontSize:11,color:G.muted}}>
            {post.author}
            {isEditor && <span style={{color:G.teal,marginLeft:6}}>({post.author_email})</span>}
            {" · "}{post.created_at?.split("T")[0]}
            {yanitlar.length > 0 && (
              <span style={{
                marginLeft:8,background:`${G.teal}15`,color:G.teal,
                padding:"1px 7px",borderRadius:10,fontSize:10,fontWeight:700
              }}>{yanitlar.length} yanıt</span>
            )}
          </div>
        </div>
        <span style={{color:G.gold,fontSize:14,flexShrink:0}}>{acik?"▲":"▼"}</span>
      </div>

      {acik && (
        <div>
          <div style={{padding:"14px 18px",background:`${G.gold}06`,borderTop:`1px solid ${G.border}`}}>
            <p style={{fontSize:14,color:"#444",lineHeight:1.75,whiteSpace:"pre-wrap"}}>{post.body}</p>
          </div>
          {yanitlar.length > 0 && (
            <div style={{background:G.cream,borderTop:`1px solid ${G.border}`}}>
              {yanitlar.map((r,i) => (
                <div key={r.id} style={{
                  padding:"10px 18px",
                  borderBottom: i<yanitlar.length-1 ? `1px solid ${G.border}44` : "none",
                  background: r.author_email===user?.email ? G.white : G.cream
                }}>
                  <div style={{fontSize:11,color:r.author_email===user?.email?G.rust:G.teal,fontWeight:700,marginBottom:3}}>
                    {r.author_email===user?.email ? "Siz" : isEditor ? `${r.author} (${r.author_email})` : r.author}
                    {" · "}{r.created_at?.split("T")[0]}
                  </div>
                  <p style={{fontSize:13.5,color:"#444",lineHeight:1.7,margin:0}}>{r.body}</p>
                </div>
              ))}
            </div>
          )}
          <ForumYanit postId={post.id} onYanit={yanitEkle}/>
        </div>
      )}
    </div>
  );
}

// ─── MESAJLAR SEKMESİ ────────────────────────────────────────────────────────
function MesajlarSekme({user, toast_}) {
  const [gonderiler, setGonderiler] = React.useState([]);
  const [yukleniyor, setYukleniyor] = React.useState(true);

  const yukle = React.useCallback(async () => {
    const {data} = await supa.from("forum_posts").select("*").order("created_at",{ascending:false});
    if (data) setGonderiler(data);
    setYukleniyor(false);
  }, []);

  React.useEffect(() => { yukle(); }, [yukle]);

  const yeniKonu = React.useCallback(async (baslik, icerik) => {
    await supa.from("forum_posts").insert([{
      title:baslik, body:icerik,
      author:user.name, author_email:user.email
    }]);
    await yukle();
    toast_("✓ Mesajınız gönderildi!");
  }, [user, yukle, toast_]);

  const yanit = React.useCallback(async (postId, text) => {
    await supa.from("forum_replies").insert([{
      post_id:postId, body:text,
      author:user.name, author_email:user.email
    }]);
    toast_("✓ Yanıtınız eklendi!");
  }, [user, toast_]);

  return (
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
        <h3 style={{fontSize:17,letterSpacing:1,color:G.ink,fontWeight:700}}>MESAJLAR</h3>
        {gonderiler.length > 0 && (
          <span style={{fontSize:11,color:G.muted}}>{gonderiler.length} konu</span>
        )}
      </div>
      <ForumYeniKonu user={user} onGonder={yeniKonu}/>
      {yukleniyor ? (
        <div style={{textAlign:"center",padding:40,color:G.muted}}>Yükleniyor...</div>
      ) : gonderiler.length === 0 ? (
        <div style={{
          textAlign:"center",padding:40,color:G.muted,fontStyle:"italic",
          background:G.cream,borderRadius:12,border:`1px solid ${G.border}`
        }}>
          <div style={{fontSize:28,marginBottom:10}}>✉</div>
          Henüz mesaj yok. İlk mesajı siz gönderin!
        </div>
      ) : gonderiler.map(p => (
        <ForumGonderi key={p.id} post={p} user={user} onYanit={yanit}/>
      ))}
    </div>
  );
}

                Tamamlandı: {review.completed_at?.split("T")[0]}
              </div>

          ) : (

              </div>
              <div style={{display:"flex",gap:8,marginBottom:14}}>
                {[["kabul","✓ Kabul","#065f46","#d1fae5"],
                  ["revizyon","↻ Revizyon","#6d28d9","#ede9fe"],
                  ["red","✗ Red","#991b1b","#fee2e2"]].map(([k,l,c,bg]) => (
                  <button key={k} onClick={() => setKarar(k)} style={{
                    flex:1, padding:"8px 0", borderRadius:7, fontWeight:700, fontSize:12,
                    border:`2px solid ${karar===k?c:G.border}`,

              <textarea
                ref={yorumRef}
                placeholder="Makalenin güçlü ve zayıf yönlerini, düzeltilmesi gereken noktaları belirtin..."
                rows={6}
                style={{
                  width:"100%",padding:"10px 14px",border:`1.5px solid ${G.border}`,
                  borderRadius:8,fontSize:13,background:G.white,color:G.ink,
                  resize:"vertical",boxSizing:"border-box",marginBottom:12,lineHeight:1.7
                }}
              />
              <button onClick={() => onDegerlendir(review.id, review.article_id, karar, yorumRef)}
                style={{
                  background:G.teal,color:G.white,border:"none",
                  padding:"11px 28px",borderRadius:7,fontWeight:700,fontSize:12,letterSpacing:1
                }}>
                DEĞERLENDİRMEYİ GÖNDER →
              </button>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// ─── HAKEM PANELİ SEKMESİ ────────────────────────────────────────────────────
function HakemSekme({user, toast_}) {
  const [atamalar, setAtamalar] = React.useState([]);
  const [makaleler, setMakaleler] = React.useState({});

  const yukle = React.useCallback(async () => {
    const {data} = await supa.from("reviews").select("*")
      .eq("reviewer_email", user.email).order("assigned_at",{ascending:false});
    if (!data) return;
    setAtamalar(data);
    const ids = [...new Set(data.map(r=>r.article_id))];
    if (ids.length > 0) {
      const {data:arts} = await supa.from("articles").select("*").in("id",ids);
      if (arts) {
        const m = {};
        arts.forEach(a => { m[a.id]=a; });
        setMakaleler(m);
      }
    }
  }, [user.email]);

  React.useEffect(() => { yukle(); }, [yukle]);

  const degerlendir = React.useCallback(async (reviewId, articleId, karar, yorumRef) => {
    const yorum = yorumRef.current?.value?.trim();
    if (!yorum) { toast_("Lütfen değerlendirme yorumu yazın.", "err"); return; }
    if (!karar) { toast_("Lütfen bir karar seçin.", "err"); return; }
    await supa.from("reviews").update({
      status:"tamamlandi", decision:karar,
      comments:yorum, completed_at:new Date().toISOString()
    }).eq("id", reviewId);
    const yeniDurum = karar==="kabul"?"baskida":karar==="revizyon"?"revizyon":"reddedildi";
    await supa.from("articles").update({status:yeniDurum}).eq("id",articleId);
    toast_("✓ Değerlendirmeniz editöre iletildi!");
    yukle();
  }, [yukle, toast_]);

  return (
    <div>
      <h3 style={{fontSize:17,letterSpacing:1,color:G.ink,fontWeight:700,marginBottom:6}}>HAKEM PANELİ</h3>
      <p style={{fontSize:13,color:G.muted,marginBottom:24,fontStyle:"italic"}}>
        Size atanan makaleler. Başlığa tıklayarak değerlendirmenizi girebilirsiniz.
      </p>
      {atamalar.length === 0 ? (
        <div style={{
          textAlign:"center",padding:"50px 20px",color:G.muted,
          background:G.cream,borderRadius:12,border:`1px solid ${G.border}`
        }}>
          <div style={{fontSize:28,marginBottom:10}}>⊕</div>
          <p style={{fontStyle:"italic"}}>Henüz size atanmış makale yok.</p>
          <p style={{fontSize:12,marginTop:8}}>Editör atama yaptığında burada görünür.</p>
        </div>
      ) : atamalar.map(r => (
        <HakemMakaleKarti key={r.id} review={r} makale={makaleler[r.article_id]} onDegerlendir={degerlendir}/>
      ))}
    </div>
  );
}

// ─── YÖNETİM PANELİ ──────────────────────────────────────────────────────────
function YonetimSekme({articles, users, toast_, loadArticles}) {
  const [reviews, setReviews] = React.useState([]);
  const [acikMakale, setAcikMakale] = React.useState(null);
  const [sekme, setSekme] = React.useState("makaleler");
  const [yazarNotMakale, setYazarNotMakale] = React.useState(null);
  const notRef = React.useRef(null);

  const yukleReviews = React.useCallback(async () => {
    const {data} = await supa.from("reviews").select("*").order("assigned_at",{ascending:false});
    if (data) setReviews(data);
  }, []);

  React.useEffect(() => { yukleReviews(); }, [yukleReviews]);

  const durumGuncelle = async (id, durum) => {
    await supa.from("articles").update({status:durum}).eq("id",id);
    await loadArticles();
    toast_("✓ Durum güncellendi!");
  };

  const hakemAta = async (makale, hakemEmail) => {
    const hakem = users.find(u=>u.email===hakemEmail);
    if (!hakem) return;
    const zaten = reviews.some(r=>r.article_id===makale.id&&r.reviewer_email===hakemEmail);
    if (zaten) { toast_("Bu hakem zaten atanmış.","err"); return; }
    await supa.from("reviews").insert([{
      article_id:makale.id, reviewer_email:hakem.email,
      reviewer_name:hakem.name, status:"beklemede"
    }]);
    await supa.from("articles").update({status:"hakemde"}).eq("id",makale.id);
    await loadArticles();
    await yukleReviews();
    toast_("✓ Hakem atandı!");
  };

  const yazaraNot = async () => {
    const not = notRef.current?.value?.trim();
    if (!not) { toast_("Not boş olamaz.","err"); return; }
    await supa.from("article_notes").insert([{
      article_id: yazarNotMakale.id,
      to_email: yazarNotMakale.author_email,
      from_name: "Editör",
      content: not
    }]);
    toast_("✓ Not yazara iletildi!");
    setYazarNotMakale(null);
  };

  const hakemler = users.filter(u=>u.role==="hakem");
  const istatistik = [
    {n:articles.length,          l:"Toplam Makale",    c:G.gold},
    {n:articles.filter(a=>a.status==="beklemede").length, l:"Ön İncelemede", c:"#1e40af"},
    {n:articles.filter(a=>a.status==="hakemde").length,   l:"Hakemde",       c:G.rust},
    {n:reviews.filter(r=>r.status==="tamamlandi").length, l:"Değerlendirme", c:"#6d28d9"},
    {n:articles.filter(a=>a.status==="baskida"||a.status==="yayinda").length, l:"Yayın", c:G.teal},
    {n:users.length,             l:"Üye",              c:"#0891b2"},
  ];

  return (
    <div>
      <h3 style={{fontSize:17,letterSpacing:1,color:G.ink,fontWeight:700,marginBottom:20}}>YÖNETİM PANELİ</h3>

      {/* İstatistik */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10,marginBottom:24}}>
        {istatistik.map(s => (
          <div key={s.l} style={{
            background:`${s.c}10`, borderRadius:10, padding:"12px 14px",
            border:`1px solid ${s.c}30`, textAlign:"center"
          }}>
            <div style={{fontSize:24,fontWeight:700,color:s.c}}>{s.n}</div>
            <div style={{fontSize:10,color:G.muted,marginTop:2}}>{s.l}</div>
          </div>
        ))}
      </div>

      {/* Sekmeler */}
      <div style={{display:"flex",borderBottom:`2px solid ${G.border}`,marginBottom:20}}>
        {[["makaleler","Makaleler & Hakem"],["degerlendirmeler","Değerlendirmeler"],["uyeler","Üyeler"]].map(([id,lbl]) => (
          <button key={id} onClick={() => setSekme(id)} style={{
            padding:"9px 18px", border:"none", background:"none",
            fontSize:13, fontWeight:sekme===id?700:500,
            color:sekme===id?G.rust:G.muted,
            borderBottom:sekme===id?`2px solid ${G.gold}`:"2px solid transparent",
            marginBottom:-2
          }}>{lbl}</button>
        ))}
      </div>

      {/* Makaleler */}
      {sekme==="makaleler" && (
        <div>
          {articles.length === 0 ? (
            <p style={{color:G.muted,fontStyle:"italic"}}>Henüz makale gönderilmedi.</p>
          ) : articles.map(a => {
            const d = DURUM[a.status]||{};
            const aReviews = reviews.filter(r=>r.article_id===a.id);
            const acik = acikMakale === a.id;
            return (
              <div key={a.id} style={{
                border:`1px solid ${G.border}`, borderRadius:10, marginBottom:10,
                overflow:"hidden", borderLeft:`4px solid ${d.renk||G.border}`
              }}>
                <div
                  onClick={() => setAcikMakale(acik?null:a.id)}
                  style={{
                    padding:"13px 16px", background:G.white, cursor:"pointer",
                    display:"flex", justifyContent:"space-between", alignItems:"flex-start", gap:10
                  }}
                >
                  <div style={{flex:1}}>
                    <div style={{fontWeight:700,fontSize:13,color:G.ink,marginBottom:3,lineHeight:1.4}}>{a.title}</div>
                    <div style={{fontSize:11,color:G.muted,fontStyle:"italic"}}>
                      {a.author} · {a.author_email} · {a.field} · {a.created_at?.split("T")[0]}

                    {aReviews.length > 0 && (
                      <div style={{marginTop:5,display:"flex",gap:5,flexWrap:"wrap"}}>
                        {aReviews.map(r => (
                          <span key={r.id} style={{
                            fontSize:10,padding:"2px 7px",borderRadius:20,fontWeight:700,
                            background:r.status==="tamamlandi"?"#d1fae5":"#dbeafe",
                            color:r.status==="tamamlandi"?"#065f46":"#1e40af"
                          }}>⊕ {r.reviewer_name} — {r.status==="tamamlandi"?"Değerlendirdi":"Bekliyor"}</span>

                      </div>
                    )}
                  </div>
                  <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:6,flexShrink:0}}>
                    <span style={{fontSize:10,padding:"3px 10px",borderRadius:20,fontWeight:700,background:d.bg,color:d.renk,whiteSpace:"nowrap"}}>
                      {d.tr||a.status}

                    <span style={{color:G.gold,fontSize:12}}>{acik?"▲":"▼"}</span>

                </div>

                {acik && (
                  <div style={{background:G.cream,borderTop:`1px solid ${G.border}`,padding:"14px 16px"}}>
                    {a.abstract && (
                      <p style={{fontSize:12,color:"#555",fontStyle:"italic",marginBottom:12,lineHeight:1.6}}>

                    )}
                    <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:14}}>
                      {a.file_url && (
                        <a href={a.file_url} target="_blank" style={{
                          fontSize:12,color:G.white,background:G.teal,
                          padding:"6px 14px",borderRadius:6,fontWeight:700

                      )}
                      <select
                        value={a.status}
                        onChange={e => durumGuncelle(a.id, e.target.value)}
                        style={{fontSize:11,padding:"6px 10px",borderRadius:6,border:`1px solid ${G.border}`,background:G.white}}
                      >
                        {Object.entries(DURUM).map(([k,v]) => (
                          <option key={k} value={k}>{v.tr}</option>
                        ))}
                      </select>
                      <button onClick={() => setYazarNotMakale(a)} style={{
                        fontSize:12,color:G.white,background:"#b45309",border:"none",
                        padding:"6px 14px",borderRadius:6,fontWeight:700
                      }}>✏ Yazara Not</button>
                    </div>

                    {/* Hakem atama */}
                    <div style={{background:G.white,borderRadius:8,padding:"12px 14px",border:`1px solid ${G.border}`}}>
                      <div style={{fontSize:10,color:G.teal,letterSpacing:1.5,fontWeight:700,marginBottom:8}}>HAKEM ATA</div>
                      {hakemler.length === 0 ? (
                        <p style={{fontSize:12,color:G.muted,fontStyle:"italic"}}>

                      ) : (
                        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                          {hakemler
                            .filter(h=>!aReviews.some(r=>r.reviewer_email===h.email))
                            .map(h => (
                              <button key={h.id} onClick={() => hakemAta(a,h.email)} style={{
                                fontSize:11,padding:"5px 12px",borderRadius:6,
                                background:G.teal,color:G.white,border:"none",fontWeight:700
                              }}>+ {h.name}</button>
                            ))
                          }
                          {hakemler.every(h=>aReviews.some(r=>r.reviewer_email===h.email)) && (
                            <p style={{fontSize:12,color:G.muted,fontStyle:"italic"}}>Tüm hakemler atanmış.</p>
                          )}
                        </div>
                      )}

                      {/* Gelen değerlendirmeler */}
                      {aReviews.filter(r=>r.status==="tamamlandi").length > 0 && (
                        <div style={{marginTop:12}}>
                          <div style={{fontSize:10,color:"#6d28d9",letterSpacing:1.5,fontWeight:700,marginBottom:8}}>
                            GELEN DEĞERLENDİRMELER
                          </div>
                          {aReviews.filter(r=>r.status==="tamamlandi").map(r => (
                            <div key={r.id} style={{
                              background:"#f3f4f6",borderRadius:8,padding:"10px 12px",marginBottom:6,
                              border:"1px solid #e5e7eb"
                            }}>
                              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
                                <span style={{fontWeight:700,fontSize:12,color:G.ink}}>{r.reviewer_name}</span>
                                <span style={{
                                  fontSize:11,padding:"2px 9px",borderRadius:20,fontWeight:700,
                                  background:r.decision==="kabul"?"#d1fae5":r.decision==="revizyon"?"#ede9fe":"#fee2e2",
                                  color:r.decision==="kabul"?"#065f46":r.decision==="revizyon"?"#6d28d9":"#991b1b"

      )}

      {/* Değerlendirmeler */}
      {sekme==="degerlendirmeler" && (

                    }}>
                      {r.status==="tamamlandi"?"✓ Tamamlandı":"⏳ Bekliyor"}
                    </span>
                  </div>
                  {r.status==="tamamlandi" && r.comments && (
                    <div style={{marginTop:10}}>

                        }}>

                      </div>

                    </div>
                  )}

      {/* Üyeler */}

              }}>İptal</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ─── ANA APP ─────────────────────────────────────────────────────────────────
function App() {
  const [page, setPage]       = React.useState("home");
  const [lang, setLang]       = React.useState("tr");
  const [user, setUser]       = React.useState(null);
  const [modal, setModal]     = React.useState(null);
  const [toast, setToast]     = React.useState(null);
  const [scrolled, setScrolled] = React.useState(false);
  const [articles, setArticles] = React.useState([]);
  const [users, setUsers]     = React.useState([]);

  const toast_ = React.useCallback((msg, type="ok") => {
    setToast({msg,type});
    setTimeout(() => setToast(null), 3200);
  }, []);

  const loadArticles = React.useCallback(async () => {
    const {data} = await supa.from("articles").select("*").order("created_at",{ascending:false});
    if (data) setArticles(data);
  }, []);

  const loadUsers = React.useCallback(async () => {
    const {data} = await supa.from("users").select("*");
    if (data) setUsers(data);
  }, []);

  React.useEffect(() => {
    loadArticles();
    loadUsers();
    const onScroll = () => setScrolled(window.scrollY > 40);
    window.addEventListener("scroll", onScroll);
    return () => window.removeEventListener("scroll", onScroll);
  }, [loadArticles, loadUsers]);

  // Login modal içeriği
  const LoginForm = () => {
    const emailRef = React.useRef(null);
    const passRef  = React.useRef(null);
    const [hata, setHata] = React.useState("");

    const giris = async () => {
      const email = emailRef.current?.value?.trim();
      const pass  = passRef.current?.value?.trim();
      if (!email || !pass) { setHata("E-posta ve şifre zorunludur."); return; }
      const {data,error} = await supa.from("users").select("*").eq("email",email).eq("password",pass).single();
      if (error || !data) { setHata("E-posta veya şifre hatalı."); return; }
      setUser(data);
      setModal(null);
      toast_("ARSİS'e hoş geldiniz!");
      setPage("panel");
    };

    return (
      <div>
        {hata && <div style={{background:"#fee2e2",color:"#991b1b",padding:"8px 12px",borderRadius:6,fontSize:13,marginBottom:12}}>{hata}</div>}
        <input ref={emailRef} type="email" placeholder="E-posta *" style={inp}/>
        <input ref={passRef}  type="password" placeholder="Şifre *" style={inp}/>
        <button onClick={giris} style={btn_gold}>GİRİŞ YAP</button>
        <div style={{textAlign:"center",marginTop:14,fontSize:13,color:"#7a6e5f"}}>
          Hesabınız yok mu?{" "}
          <span onClick={()=>setModal("register")} style={{color:"#c9a84c",cursor:"pointer",fontWeight:700}}>Kayıt olun</span>
        </div>
      </div>
    );
  };

  // Register modal içeriği
  const RegisterForm = () => {
    const nameRef  = React.useRef(null);
    const emailRef = React.useRef(null);
    const instRef  = React.useRef(null);
    const orcidRef = React.useRef(null);
    const passRef  = React.useRef(null);
    const roleRef  = React.useRef(null);
    const [hata, setHata] = React.useState("");

    const kayit = async () => {
      const name  = nameRef.current?.value?.trim();
      const email = emailRef.current?.value?.trim();
      const pass  = passRef.current?.value?.trim();
      const role  = roleRef.current?.value || "yazar";
      if (!name || !email) { setHata("Ad ve e-posta zorunludur."); return; }
      if (!pass) { setHata("Şifre zorunludur."); return; }
      const {data,error} = await supa.from("users").insert([{
        name, email, password:pass,
        institution: instRef.current?.value?.trim()||null,
        orcid: orcidRef.current?.value?.trim()||null,
        role
      }]).select().single();
      if (error) { setHata("Bu e-posta zaten kayıtlı olabilir."); return; }
      setUser(data);
      setModal(null);
      toast_("ARSİS'e hoş geldiniz!");
      setPage("panel");
    };

    return (
      <div>
        {hata && <div style={{background:"#fee2e2",color:"#991b1b",padding:"8px 12px",borderRadius:6,fontSize:13,marginBottom:12}}>{hata}</div>}
        <input ref={nameRef}  placeholder="Ad Soyad *" style={inp}/>
        <input ref={emailRef} type="email" placeholder="E-posta *" style={inp}/>
        <input ref={instRef}  placeholder="Kurum / Üniversite" style={inp}/>
        <input ref={orcidRef} placeholder="ORCID ID (isteğe bağlı)" style={inp}/>
        <input ref={passRef}  type="password" placeholder="Şifre *" style={inp}/>
        <select ref={roleRef} style={{...inp,color:"#1a1208"}}>
          <option value="yazar">Yazar / Araştırmacı</option>
          <option value="hakem">Hakem</option>
        </select>
        <button onClick={kayit} style={btn_gold}>KAYIT OL</button>
      </div>
    );
  };

  // Makale gönder modal içeriği
  const MakaleForm = () => {
    const titleRef    = React.useRef(null);
    const fieldRef    = React.useRef(null);
    const abstractRef = React.useRef(null);
    const keywordsRef = React.useRef(null);
    const coauthRef   = React.useRef(null);
    const fileRef     = React.useRef(null);
    const [yukleniyor, setYukleniyor] = React.useState(false);
    const [dosyaMsg, setDosyaMsg] = React.useState("");

    const gonder = async () => {
      const title    = titleRef.current?.value?.trim();
      const field    = fieldRef.current?.value;
      const abstract = abstractRef.current?.value?.trim();
      if (!title || !abstract || !field) { toast_("Başlık, özet ve alan zorunludur.","err"); return; }
      setYukleniyor(true);
      let file_url = null;
      const file = fileRef.current?.files?.[0];
      if (file) {
        setDosyaMsg("Dosya yükleniyor...");
        const fname = `${Date.now()}_${file.name.replace(/[^a-zA-Z0-9._-]/g,"_")}`;
        const {error:ue} = await supa.storage.from("makaleler").upload(fname, file, {upsert:true});
        if (ue) { setDosyaMsg("Dosya yüklenemedi: "+ue.message); setYukleniyor(false); return; }
        setDosyaMsg("✅ Dosya yüklendi!");
        const {data:ud} = supa.storage.from("makaleler").getPublicUrl(fname);
        file_url = ud?.publicUrl;
      }
      const {error} = await supa.from("articles").insert([{
        title, field, abstract,
        keywords: keywordsRef.current?.value?.trim()||null,
        coauthors: coauthRef.current?.value?.trim()||null,
        author:user.name, author_email:user.email,
        status:"beklemede", file_url
      }]);
      setYukleniyor(false);
      if (error) { toast_("Bir hata oluştu.","err"); return; }
      await loadArticles();
      setModal(null);
      toast_("✓ Makaleniz ARSİS'e iletildi!");
    };

    return (
      <div>
        <input ref={titleRef} placeholder="Makale Başlığı *" style={inp}/>
        <select ref={fieldRef} style={{...inp,color:"#1a1208"}}>
          <option value="">Alan Seçin *</option>
          {["Etnomüzikoloji","Müzikoloji","Müzik Antropolojisi","Antropoloji","Organoloji & Çalgı Yapımı","Müzik Tarihi"].map(f=>(
            <option key={f} value={f}>{f}</option>
          ))}
        </select>
        <input ref={coauthRef} placeholder="Ortak Yazarlar (isteğe bağlı)" style={inp}/>
        <textarea ref={abstractRef} placeholder="Özet (min. 150 kelime) *" rows={5}
          style={{...inp,resize:"vertical"}}/>
        <input ref={keywordsRef} placeholder="Anahtar Kelimeler (virgülle ayırın)" style={inp}/>
        <div style={{marginBottom:10}}>
          <div style={{fontSize:11,color:"#7a6e5f",marginBottom:6,letterSpacing:1}}>MAKALE DOSYASI (PDF veya DOCX)</div>
          <input ref={fileRef} type="file" accept=".pdf,.docx" style={{fontSize:13,color:"#444"}}/>
          {dosyaMsg && <div style={{fontSize:12,color:dosyaMsg.includes("✅")?"#065f46":"#991b1b",marginTop:4}}>{dosyaMsg}</div>}
        </div>
        <button onClick={gonder} disabled={yukleniyor} style={{...btn_gold,opacity:yukleniyor?0.6:1}}>
          {yukleniyor?"GÖNDERİLİYOR...":"MAKALEMİ GÖNDER"}
        </button>
      </div>
    );
  };

  return (
    <div style={{background:"#f5f0e8",minHeight:"100vh"}}>
      <Nav page={page} setPage={setPage} user={user} setModal={setModal} lang={lang} setLang={setLang} scrolled={scrolled}/>

      {page==="home"    && <HomePage user={user} setModal={setModal} lang={lang} articles={articles}/>}
      {page==="archive" && <ArchivePage user={user} setModal={setModal} lang={lang}/>}
      {page==="about"   && <AboutPage lang={lang}/>}
      {page==="oa"      && <OAPage lang={lang}/>}
      {page==="guide"   && <GuidePage lang={lang}/>}
      {page==="ethics"  && <EthicsPage lang={lang}/>}
      {page==="panel"   && user && (
        <PanelPage
          user={user} setModal={setModal} toast_={toast_} lang={lang}
          articles={articles} users={users} loadArticles={loadArticles}
        />
      )}

      <Footer setPage={setPage} lang={lang}/>
      <Toast msg={toast?.msg} type={toast?.type}/>

      {/* MODALlar */}
      {modal==="login" && (
        <Modal title="ARSİS'E GİRİŞ" onClose={()=>setModal(null)}>
          <LoginForm/>
        </Modal>
      )}
      {modal==="register" && (
        <Modal title="KAYIT OL" sub="Ücretsiz akademik hesap oluşturun" onClose={()=>setModal(null)}>
          <RegisterForm/>
        </Modal>
      )}
      {modal==="makale" && user && (
        <Modal title="MAKALENİZİ GÖNDERİN" sub="ARSİS Cilt 1, Sayı 1 · Haziran 2026" onClose={()=>setModal(null)}>
          <MakaleForm/>
        </Modal>
      )}
      {modal==="cikis" && (
        <Modal title="ÇIKIŞ" onClose={()=>setModal(null)}>
          <p style={{fontSize:14,color:"#444",marginBottom:20}}>Hesabınızdan çıkış yapmak istiyor musunuz?</p>
          <div style={{display:"flex",gap:10}}>
            <button onClick={()=>{setUser(null);setModal(null);setPage("home");toast_("Çıkış yapıldı.");}} style={{...btn_gold,flex:1}}>ÇIKIŞ YAP</button>
            <button onClick={()=>setModal(null)} style={{flex:1,padding:"11px",borderRadius:7,border:"1px solid #d4c9b4",background:"none",fontSize:14,cursor:"pointer"}}>İptal</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
</body>
</html>
