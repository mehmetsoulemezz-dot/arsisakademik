// ─── WAVE LOGO ───────────────────────────────────────────────────────────────
function WaveLogo({size=28}) {
  return (
    <div style={{display:"flex",alignItems:"center",gap:2,height:size}}>
      {[0.5,0.9,0.65,1,0.7,0.9,0.5].map((h,i)=>(

          width:3, background:G.gold, borderRadius:2,

          animation:`wave 1.4s ease-in-out ${i*0.12}s infinite alternate`
        }}/>
      ))}

// ─── TOAST ───────────────────────────────────────────────────────────────────
function Toast({msg,type}) {
  if(!msg) return null;
  return (
    <div style={{
      position:"fixed", bottom:24, left:"50%", transform:"translateX(-50%)",
      background: type==="err"?"#991b1b":G.teal,
      color:"#fff", padding:"12px 28px", borderRadius:8,
      fontSize:14, fontWeight:600, zIndex:1000, boxShadow:"0 4px 20px rgba(0,0,0,0.3)"
    }}>{msg}</div>
  );
}

// ─── MODAL WRAPPER ────────────────────────────────────────────────────────────
function Modal({title, sub, children, onClose}) {
  return (
    <div
      onClick={onClose}
      style={{
        position:"fixed", inset:0, background:"rgba(10,8,4,0.75)",
        zIndex:300, display:"flex", alignItems:"center", justifyContent:"center", padding:20
      }}
    >
      <div
        onClick={e=>e.stopPropagation()}
        style={{
          background:G.paper, borderRadius:16, padding:"36px 40px",
          width:"100%", maxWidth:500, maxHeight:"90vh", overflowY:"auto",
          border:`1px solid ${G.gold}44`
        }}

        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:24}}>

            <div style={{fontFamily:"serif",fontSize:16,fontWeight:700,color:G.ink,letterSpacing:1}}>{title}</div>
            {sub&&<div style={{fontSize:13,color:G.muted,marginTop:3}}>{sub}</div>}
          </div>
          <button onClick={onClose} style={{background:"none",border:"none",fontSize:22,color:G.muted,lineHeight:1}}>×</button>
        </div>
        {children}
      </div>

}

// ─── FORUM: YENİ KONU FORMU ──────────────────────────────────────────────────
function ForumYeniKonu({user, onGonder}) {
  const baslikRef = React.useRef(null);
  const icerikRef = React.useRef(null);
  const [yukleniyor, setYukleniyor] = React.useState(false);

  const gonder = async () => {
    const baslik = baslikRef.current?.value?.trim();
    const icerik = icerikRef.current?.value?.trim();
    if (!baslik || !icerik) { alert("Konu başlığı ve mesaj zorunludur."); return; }
    setYukleniyor(true);
    await onGonder(baslik, icerik);
    baslikRef.current.value = "";
    icerikRef.current.value = "";
    setYukleniyor(false);
  };

  return (
    <div style={{background:G.cream,borderRadius:12,padding:"20px 24px",marginBottom:24,border:`1px solid ${G.border}`}}>
      <div style={{fontSize:11,color:G.rust,letterSpacing:1.5,marginBottom:12,fontWeight:700}}>YENİ MESAJ</div>
      <input ref={baslikRef} placeholder="Konu başlığı *" style={inp}/>
      <textarea ref={icerikRef} placeholder="Mesajınızı yazın..." rows={4}
        style={{...inp,resize:"vertical",marginBottom:12}}/>
      <button onClick={gonder} disabled={yukleniyor}
        style={{...btn_gold,width:"auto",padding:"10px 24px",opacity:yukleniyor?0.6:1}}>
        {yukleniyor?"Gönderiliyor...":"GÖNDER"}
      </button>
    </div>
  );
}

// ─── FORUM: YANIT KUTUSU ─────────────────────────────────────────────────────
function ForumYanit({postId, onYanit}) {
  const ref = React.useRef(null);
  const [yukleniyor, setYukleniyor] = React.useState(false);

  const gonder = async () => {
    const text = ref.current?.value?.trim();
    if (!text) return;
    setYukleniyor(true);
    await onYanit(postId, text);
    ref.current.value = "";
    setYukleniyor(false);
  };

  return (
    <div style={{
      background:G.paper, borderTop:`1px solid ${G.border}`,
      padding:"10px 18px", display:"flex", gap:8, alignItems:"center"
    }}>
      <input
        ref={ref}
        placeholder="Yanıtınızı yazın..."
        style={{flex:1, padding:"8px 12px", border:`1.5px solid ${G.border}`, borderRadius:6, fontSize:13}}
        onKeyDown={e=>{ if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();gonder();} }}
      />
      <button onClick={gonder} disabled={yukleniyor}
        style={{
          background:G.gold, color:G.ink, border:"none",
          padding:"8px 16px", borderRadius:6, fontSize:11, fontWeight:700, whiteSpace:"nowrap",
          opacity:yukleniyor?0.6:1
        }}>
        {yukleniyor?"...":"↩ YANIT"}
      </button>
    </div>
  );
}

// ─── FORUM: TEK GÖNDERI ──────────────────────────────────────────────────────
function ForumGonderi({post, user, onYanit}) {
  const [yanitlar, setYanitlar] = React.useState([]);
  const [acik, setAcik] = React.useState(false);
  const isEditor = user?.role === "editor";

  React.useEffect(() => {
    if (acik) {
      supa.from("forum_replies").select("*")
        .eq("post_id", post.id).order("created_at", {ascending:true})
        .then(({data}) => { if (data) setYanitlar(data); });
    }
  }, [acik, post.id]);

  const yanitEkle = async (postId, text) => {
    await onYanit(postId, text);
    const {data} = await supa.from("forum_replies").select("*")
      .eq("post_id", post.id).order("created_at", {ascending:true});
    if (data) setYanitlar(data);
  };

  return (
    <div style={{border:`1px solid ${G.border}`,borderRadius:12,marginBottom:10,overflow:"hidden"}}>
      <div
        onClick={() => setAcik(!acik)}
        style={{
          background:G.white, padding:"14px 18px", cursor:"pointer",
          display:"flex", justifyContent:"space-between", alignItems:"flex-start", gap:12
        }}
      >
        <div style={{flex:1}}>
          <div style={{fontWeight:700,fontSize:13.5,color:G.ink,marginBottom:3}}>{post.title}</div>
          <div style={{fontSize:11,color:G.muted}}>
            {post.author}
            {isEditor && <span style={{color:G.teal,marginLeft:6}}>({post.author_email})</span>}
            {" · "}{post.created_at?.split("T")[0]}
            {yanitlar.length > 0 && (
              <span style={{
                marginLeft:8,background:`${G.teal}15`,color:G.teal,
                padding:"1px 7px",borderRadius:10,fontSize:10,fontWeight:700
              }}>{yanitlar.length} yanıt</span>
            )}
          </div>
        </div>
        <span style={{color:G.gold,fontSize:14,flexShrink:0}}>{acik?"▲":"▼"}</span>
      </div>

      {acik && (
        <div>
          <div style={{padding:"14px 18px",background:`${G.gold}06`,borderTop:`1px solid ${G.border}`}}>
            <p style={{fontSize:14,color:"#444",lineHeight:1.75,whiteSpace:"pre-wrap"}}>{post.body}</p>
          </div>
          {yanitlar.length > 0 && (
            <div style={{background:G.cream,borderTop:`1px solid ${G.border}`}}>
              {yanitlar.map((r,i) => (
                <div key={r.id} style={{
                  padding:"10px 18px",
                  borderBottom: i<yanitlar.length-1 ? `1px solid ${G.border}44` : "none",
                  background: r.author_email===user?.email ? G.white : G.cream
                }}>
                  <div style={{fontSize:11,color:r.author_email===user?.email?G.rust:G.teal,fontWeight:700,marginBottom:3}}>
                    {r.author_email===user?.email ? "Siz" : isEditor ? `${r.author} (${r.author_email})` : r.author}
                    {" · "}{r.created_at?.split("T")[0]}
                  </div>
                  <p style={{fontSize:13.5,color:"#444",lineHeight:1.7,margin:0}}>{r.body}</p>
                </div>
              ))}
            </div>
          )}
          <ForumYanit postId={post.id} onYanit={yanitEkle}/>
        </div>
      )}
    </div>
  );
}

// ─── MESAJLAR SEKMESİ ────────────────────────────────────────────────────────
function MesajlarSekme({user, toast_}) {
  const [gonderiler, setGonderiler] = React.useState([]);
  const [yukleniyor, setYukleniyor] = React.useState(true);

  const yukle = React.useCallback(async () => {
    const {data} = await supa.from("forum_posts").select("*").order("created_at",{ascending:false});
    if (data) setGonderiler(data);
    setYukleniyor(false);
  }, []);

  React.useEffect(() => { yukle(); }, [yukle]);

  const yeniKonu = React.useCallback(async (baslik, icerik) => {
    await supa.from("forum_posts").insert([{
      title:baslik, body:icerik,
      author:user.name, author_email:user.email
    }]);
    await yukle();
    toast_("✓ Mesajınız gönderildi!");
  }, [user, yukle, toast_]);

  const yanit = React.useCallback(async (postId, text) => {
    await supa.from("forum_replies").insert([{
      post_id:postId, body:text,
      author:user.name, author_email:user.email
    }]);
    toast_("✓ Yanıtınız eklendi!");
  }, [user, toast_]);

  return (
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
        <h3 style={{fontSize:17,letterSpacing:1,color:G.ink,fontWeight:700}}>MESAJLAR</h3>
        {gonderiler.length > 0 && (
          <span style={{fontSize:11,color:G.muted}}>{gonderiler.length} konu</span>
        )}
      </div>
      <ForumYeniKonu user={user} onGonder={yeniKonu}/>
      {yukleniyor ? (
        <div style={{textAlign:"center",padding:40,color:G.muted}}>Yükleniyor...</div>
      ) : gonderiler.length === 0 ? (
        <div style={{
          textAlign:"center",padding:40,color:G.muted,fontStyle:"italic",
          background:G.cream,borderRadius:12,border:`1px solid ${G.border}`
        }}>
          <div style={{fontSize:28,marginBottom:10}}>✉</div>
          Henüz mesaj yok. İlk mesajı siz gönderin!
        </div>
      ) : gonderiler.map(p => (
        <ForumGonderi key={p.id} post={p} user={user} onYanit={yanit}/>
      ))}
    </div>
  );
}

// ─── YAZAR NOTLARI (editörden gelen notları gösterir) ────────────────────────
function YazarNotlari({articleId}) {
  const [notlar, setNotlar] = React.useState([]);

  React.useEffect(() => {
    supa.from("article_notes").select("*")
      .eq("article_id", articleId).order("created_at",{ascending:false})
      .then(({data}) => { if(data) setNotlar(data); });
  }, [articleId]);

  if (notlar.length === 0) return null;

  return (
    <div style={{
      marginTop:10, padding:"10px 14px",
      background:"#fff8e1", borderRadius:8, border:"1px solid #ffe082"
    }}>
      <div style={{fontSize:10,color:"#b45309",letterSpacing:1.5,fontWeight:700,marginBottom:8}}>
        EDİTÖRDEN NOTLAR
      </div>
      {notlar.map(n => (
        <div key={n.id} style={{marginBottom:6}}>
          <div style={{fontSize:11,color:"#b45309",fontWeight:700,marginBottom:2}}>
            {n.from_name} · {n.created_at?.split("T")[0]}
          </div>
          <div style={{fontSize:13,color:"#444",lineHeight:1.6}}>{n.content}</div>
        </div>
      ))}
    </div>
  );
}

// ─── HAKEM: TEK MAKALE KARTI ─────────────────────────────────────────────────
function HakemMakaleKarti({review, makale, onDegerlendir}) {
  const [acik, setAcik] = React.useState(false);
  const [karar, setKarar] = React.useState("");
  const yorumRef = React.useRef(null);
  const tamam = review.status === "tamamlandi";

  return (
    <div style={{
      border:`1px solid ${tamam?G.border:G.teal}`,
      borderRadius:12, marginBottom:14, overflow:"hidden",
      borderTop:`3px solid ${tamam?"#d1fae5":G.teal}`
    }}>
      <div
        onClick={() => setAcik(!acik)}
        style={{
          background:G.white, padding:"16px 20px", cursor:"pointer",
          display:"flex", justifyContent:"space-between", alignItems:"flex-start", gap:12
        }}
      >
        <div style={{flex:1}}>
          <div style={{fontWeight:700,fontSize:13.5,color:G.ink,marginBottom:3,lineHeight:1.4}}>
            {makale?.title || "Makale yükleniyor..."}
          </div>
          <div style={{fontSize:11,color:G.muted}}>
            {makale?.author} · {makale?.field} · Atandı: {review.assigned_at?.split("T")[0]}
          </div>
        </div>
        <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:6,flexShrink:0}}>
          <span style={{
            fontSize:10, padding:"3px 10px", borderRadius:20, fontWeight:700,
            background:tamam?"#d1fae5":"#dbeafe",
            color:tamam?"#065f46":"#1e40af"
          }}>
            {tamam ? "✓ Tamamlandı" : "Bekliyor"}
          </span>
          <span style={{color:G.gold,fontSize:13}}>{acik?"▲":"▼"}</span>
        </div>
      </div>

      {acik && (
        <div style={{borderTop:`1px solid ${G.border}`}}>
          {makale && (
            <div style={{padding:"14px 20px",background:`${G.gold}06`,borderBottom:`1px solid ${G.border}`}}>
              {makale.abstract && (
                <p style={{fontSize:12,color:G.muted,fontStyle:"italic",marginBottom:8,lineHeight:1.6}}>
                  "{makale.abstract.substring(0,300)}{makale.abstract.length>300?"...":""}"
                </p>
              )}
              {makale.file_url && (
                <a href={makale.file_url} target="_blank" style={{
                  fontSize:12,color:G.white,background:G.teal,
                  padding:"5px 14px",borderRadius:6,fontWeight:700
                }}>📄 Makaleyi İndir</a>
              )}
            </div>
          )}

          {tamam ? (
            <div style={{padding:"16px 20px",background:G.cream}}>
              <div style={{fontSize:10,color:G.teal,letterSpacing:1.5,fontWeight:700,marginBottom:10}}>
                DEĞERLENDİRMENİZ
              </div>
              <div style={{marginBottom:8}}>
                <span style={{fontSize:12,fontWeight:700,color:G.ink}}>Karar: </span>
                <span style={{
                  fontSize:12,fontWeight:700,
                  color:review.decision==="kabul"?"#065f46":review.decision==="revizyon"?"#6d28d9":"#991b1b"
                }}>
                  {review.decision==="kabul"?"✓ Kabul":review.decision==="revizyon"?"↻ Revizyon":"✗ Red"}
                </span>
              </div>
              <div style={{
                fontSize:13,color:"#444",lineHeight:1.7,
                background:G.white,borderRadius:8,padding:"10px 14px",border:`1px solid ${G.border}`
              }}>{review.comments}</div>
              <div style={{fontSize:11,color:G.muted,marginTop:8}}>
                Tamamlandı: {review.completed_at?.split("T")[0]}
              </div>
            </div>
          ) : (
            <div style={{padding:"16px 20px",background:G.cream}}>
              <div style={{fontSize:10,color:G.rust,letterSpacing:1.5,fontWeight:700,marginBottom:12}}>
                DEĞERLENDİRMENİZİ GİRİN
              </div>
              <div style={{display:"flex",gap:8,marginBottom:14}}>
                {[["kabul","✓ Kabul","#065f46","#d1fae5"],
                  ["revizyon","↻ Revizyon","#6d28d9","#ede9fe"],
                  ["red","✗ Red","#991b1b","#fee2e2"]].map(([k,l,c,bg]) => (
                  <button key={k} onClick={() => setKarar(k)} style={{
                    flex:1, padding:"8px 0", borderRadius:7, fontWeight:700, fontSize:12,
                    border:`2px solid ${karar===k?c:G.border}`,
                    background:karar===k?bg:G.white, color:c
                  }}>{l}</button>
                ))}
              </div>
              <textarea
                ref={yorumRef}
                placeholder="Makalenin güçlü ve zayıf yönlerini, düzeltilmesi gereken noktaları belirtin..."
                rows={6}
                style={{
                  width:"100%",padding:"10px 14px",border:`1.5px solid ${G.border}`,
                  borderRadius:8,fontSize:13,background:G.white,color:G.ink,
                  resize:"vertical",boxSizing:"border-box",marginBottom:12,lineHeight:1.7
                }}
              />
              <button onClick={() => onDegerlendir(review.id, review.article_id, karar, yorumRef)}
                style={{
                  background:G.teal,color:G.white,border:"none",
                  padding:"11px 28px",borderRadius:7,fontWeight:700,fontSize:12,letterSpacing:1
                }}>
                DEĞERLENDİRMEYİ GÖNDER →
              </button>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// ─── HAKEM PANELİ SEKMESİ ────────────────────────────────────────────────────
// ─── BİLDİRİM BADGE ─────────────────────────────────────────────────────────
function BildirimBadge({count}) {
  if (!count) return null;
  return (
    <span style={{
      display:"inline-flex",alignItems:"center",justifyContent:"center",
      background:"#dc2626",color:"#fff",borderRadius:"50%",
      width:18,height:18,fontSize:10,fontWeight:700,marginLeft:6,flexShrink:0
    }}>{count > 9 ? "9+" : count}</span>
  );
}

// ─── HAKEM DEĞERLENDİRME FORMU ───────────────────────────────────────────────
function HakemDegerlendirmeFormu({review, makale, onGonder}) {
  // Uluslararası standart 8 kriter (PNAS, ACM, Wiley, Elsevier standartları)
  const kriterler = [
    {key:"ozgunluk",   lbl:"Özgünlük & Yenilik",          desc:"Araştırmanın alana özgün katkısı; alanyazında mevcut olmayan bulgu veya yaklaşım", max:5},
    {key:"metodoloji", lbl:"Metodolojik Sağlamlık",        desc:"Yöntemin araştırma sorusuna uygunluğu, veri toplama kalitesi, analiz geçerliliği", max:5},
    {key:"kuram",      lbl:"Kuramsal Çerçeve",             desc:"Kavramsal temel, alanyazınla diyalog, kuramsal tutarlılık", max:5},
    {key:"bulgular",   lbl:"Bulguların Güvenilirliği",     desc:"Sonuçların verilerle desteklenme düzeyi, içsel tutarlılık", max:5},
    {key:"katki",      lbl:"Bilimsel Katkı & Etki",        desc:"Alanın ilerlemesine katkı, disiplinlerarası açılım potansiyeli", max:5},
    {key:"yazim",      lbl:"Yazım, Yapı & Sunum",          desc:"Akademik dil kalitesi, makale yapısı, şekil ve tablo kalitesi", max:5},
    {key:"alanyazin",  lbl:"Alanyazın Kapsamı",            desc:"Birincil kaynakların yeterliliği, güncelliği ve doğru atıf kullanımı", max:5},
    {key:"etik",       lbl:"Etik & Araştırma Standartları",desc:"Araştırma etiğine uyum, veri şeffaflığı, çıkar çatışması beyanı", max:5},
  ];

  const kararlar = [
    {k:"kabul",          lbl:"Accept",                         lbl_tr:"Kabul",                   c:"#065f46", bg:"#d1fae5",
     desc:"Makale mevcut haliyle yayımlanabilir. Yalnızca küçük yazım/biçim düzeltmeleri önerilir."},
    {k:"minor_revision", lbl:"Minor Revision",                  lbl_tr:"Küçük Revizyon",          c:"#1d4ed8", bg:"#dbeafe",
     desc:"Sınırlı değişiklikler yeterlidir; hakem tekrar inceleme yapmaksızın editör onayı beklenir."},
    {k:"major_revision", lbl:"Major Revision",                  lbl_tr:"Kapsamlı Revizyon",       c:"#6d28d9", bg:"#ede9fe",
     desc:"Önemli metodolojik, kuramsal veya içerik revizyonları gereklidir; revize metin yeniden hakeme gönderilir."},
    {k:"reject_resubmit",lbl:"Reject & Resubmit",               lbl_tr:"Red & Yeniden Gönder",    c:"#b45309", bg:"#fef3c7",
     desc:"Mevcut form yayımlanamaz; ancak kapsamlı yeniden yazım sonrası yeni gönderi olarak değerlendirilebilir."},
    {k:"red",            lbl:"Reject",                          lbl_tr:"Red",                     c:"#991b1b", bg:"#fee2e2",
     desc:"Temel metodolojik/kuramsal sorunlar nedeniyle yayımlanması mümkün değildir."},
    {k:"transfer",       lbl:"Transfer to Another Journal",      lbl_tr:"Başka Dergiye Yönlendir", c:"#0891b2", bg:"#e0f2fe",
     desc:"Çalışma ARSİS kapsamı dışında; başka bir dergiye yönlendirilmesi önerilir."},
  ];

  const [puanlar, setPuanlar]   = React.useState(() => Object.fromEntries(kriterler.map(k=>[k.key,0])));
  const [karar, setKarar]       = React.useState("");
  const [gonderiyor, setGonderiyor] = React.useState(false);
  const [ekDosyaMsg, setEkDosyaMsg] = React.useState("");
  const [adim, setAdim]         = React.useState(1); // 1=puanlar, 2=yorumlar, 3=karar

  // Refs - hepsi ayrı ayrı
  const editoreRef     = React.useRef(null); // Sadece editör görür
  const yazaraRef      = React.useRef(null); // Editör + Yazar görür
  const gucluRef       = React.useRef(null);
  const zayifRef       = React.useRef(null);
  const ekDosyaRef     = React.useRef(null);

  const ort = () => {
    const vals = Object.values(puanlar).filter(v=>v>0);
    return vals.length ? (vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(2) : "—";
  };

  const ortRenk = () => {
    const v = parseFloat(ort());
    if (v >= 4.0) return "#065f46";
    if (v >= 3.0) return "#1d4ed8";
    if (v >= 2.0) return "#b45309";
    return "#991b1b";
  };

  const gonder = async () => {
    const editoreNot  = editoreRef.current?.value?.trim();
    const yazaraNot   = yazaraRef.current?.value?.trim();
    if (!karar) { alert("Lütfen bir karar seçin."); return; }
    if (Object.values(puanlar).some(v=>v===0)) { alert("Lütfen tüm 8 kriteri puanlayın."); return; }

    setGonderiyor(true);

    // Ek dosya yükleme
    let ekDosyaUrl = null;
    const ekDosya = ekDosyaRef.current?.files?.[0];
    if (ekDosya) {
      setEkDosyaMsg("Ek dosya yükleniyor...");
      const fname = `review_${review.id}_${Date.now()}_${ekDosya.name.replace(/[^a-zA-Z0-9._-]/g,"_")}`;
      const {error:ue} = await supa.storage.from("makaleler").upload(fname, ekDosya, {upsert:true});
      if (ue) { setEkDosyaMsg("Dosya yüklenemedi: " + ue.message); setGonderiyor(false); return; }
      setEkDosyaMsg("✓ Dosya yüklendi");
      const {data:ud} = supa.storage.from("makaleler").getPublicUrl(fname);
      ekDosyaUrl = ud?.publicUrl;
    }

    // Karar kodu → Türkçe
    const secilenKarar = kararlar.find(k=>k.k===karar);
    const kmap = {kabul:"kabul",minor_revision:"revizyon",major_revision:"revizyon",reject_resubmit:"revizyon",red:"red",transfer:"red"};

    // Yazara giden rapor — hakem kimliği KESİNLİKLE GİZLİ
    const raporYazara = [
      "═══════════════════════════════════════════════",
      "HAKEM DEĞERLENDİRMESİ",
      "Çift Kör Süreç — Hakem Kimliği Gizlidir",
      "═══════════════════════════════════════════════",
      "",
      `Makale: ${makale?.title||"—"}`,
      `Değerlendirme Tarihi: ${new Date().toLocaleDateString("tr-TR")}`,
      "",
      "─── PUANLAMA ─────────────────────────────────",
      ...kriterler.map(k=>`${k.lbl.padEnd(35)}: ${puanlar[k.key]}/5`),
      `${"Genel Ortalama".padEnd(35)}: ${ort()}/5`,
      "",
      gucluRef.current?.value ? `─── GÜÇLÜ YÖNLER ─────────────────────────────\n${gucluRef.current.value}` : "",
      "",
      zayifRef.current?.value ? `─── GELİŞTİRİLMESİ ÖNERILEN NOKTALAR ────────\n${zayifRef.current.value}` : "",
      "",
      yazaraNot ? `─── DEĞERLENDİRME & ÖNERİLER ────────────────\n${yazaraNot}` : "",
      "",
      `KARAR: ${secilenKarar?.lbl_tr} (${secilenKarar?.lbl})`,
    ].filter(l=>l!=="").join("\n");

    // Editöre giden rapor — tüm detaylar + gizli notlar
    const raporEditore = [
      "═══════════════════════════════════════════════",
      "HAKEM DEĞERLENDİRME RAPORU — EDİTÖRE GİZLİ",
      "═══════════════════════════════════════════════",
      "",
      `Makale: ${makale?.title||"—"}`,
      `Tarih: ${new Date().toLocaleDateString("tr-TR")}`,
      `Karar: ${secilenKarar?.lbl_tr} (${secilenKarar?.lbl})`,
      "",
      "─── PUANLAMA ─────────────────────────────────",
      ...kriterler.map(k=>`${k.lbl.padEnd(35)}: ${puanlar[k.key]}/5`),
      `${"Genel Ortalama".padEnd(35)}: ${ort()}/5`,
      "",
      gucluRef.current?.value ? `─── GÜÇLÜ YÖNLER ─────────────────────────────\n${gucluRef.current.value}` : "",
      "",
      zayifRef.current?.value ? `─── ZAYIF YÖNLER ──────────────────────────────\n${zayifRef.current.value}` : "",
      "",
      yazaraNot ? `─── YAZARA AÇIK DEĞERLENDİRME ────────────────\n${yazaraNot}` : "",
      "",
      editoreNot ? `─── EDİTÖRE GİZLİ NOT ────────────────────────\n${editoreNot}` : "",
      ekDosyaUrl ? `\nEk Dosya: ${ekDosyaUrl}` : "",
    ].filter(l=>l!=="").join("\n");

    // reviews tablosuna kaydet — iki ayrı alan
    await supa.from("reviews").update({
      status: "tamamlandi",
      decision: kmap[karar] || karar,
      comments: raporYazara,           // yazar görebilir
      editor_notes: raporEditore,      // sadece editör
      review_file_url: ekDosyaUrl,
      completed_at: new Date().toISOString()
    }).eq("id", review.id);

    const yeniDurum = kmap[karar]==="kabul"?"baskida":kmap[karar]==="revizyon"?"revizyon":"reddedildi";
    await supa.from("articles").update({status:yeniDurum}).eq("id", review.article_id);

    await onGonder(review.id, review.article_id, kmap[karar]||karar, raporYazara);
    setGonderiyor(false);
  };

  const adimRengi = (n) => adim===n?"#1a1208":adim>n?"#065f46":"#94a3b8";
  const adimBg    = (n) => adim===n?"#c9a84c":adim>n?"#d1fae5":"#f1f5f9";

  return (
    <div style={{background:"#f8fafc",borderTop:`2px solid ${G.border}`}}>

      {/* Adım göstergesi */}
      <div style={{background:"#1a1208",padding:"12px 20px",display:"flex",alignItems:"center",gap:0}}>
        {[
          {n:1,lbl:"Puanlama"},
          {n:2,lbl:"Değerlendirme"},
          {n:3,lbl:"Karar & Gönder"},
        ].map((s,i,arr) => (
          <React.Fragment key={s.n}>
            <div onClick={()=>setAdim(s.n)} style={{display:"flex",alignItems:"center",gap:7,cursor:"pointer"}}>
              <div style={{width:24,height:24,borderRadius:"50%",background:adimBg(s.n),color:adimRengi(s.n),display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700,flexShrink:0}}>
                {adim>s.n?"✓":s.n}
              </div>
              <span style={{fontSize:11,color:adim===s.n?"#c9a84c":adim>s.n?"#6ee7b7":"#64748b",fontWeight:adim===s.n?700:500}}>{s.lbl}</span>
            </div>
            {i<arr.length-1&&<div style={{flex:1,height:1,background:"rgba(255,255,255,0.15)",margin:"0 10px"}}/>}
          </React.Fragment>
        ))}
      </div>

      {/* Makale özeti */}
      {makale && (
        <div style={{padding:"12px 20px",background:"#fff",borderBottom:`1px solid ${G.border}`,display:"flex",gap:12,alignItems:"flex-start"}}>
          <div style={{flex:1}}>
            <div style={{fontSize:11,color:G.gold,fontWeight:700,letterSpacing:1,marginBottom:3}}>DEĞERLENDİRDİĞİNİZ MAKALE</div>
            <div style={{fontSize:13,fontWeight:700,color:G.ink,lineHeight:1.4}}>{makale.title}</div>
            <div style={{fontSize:11,color:G.muted,marginTop:2}}>{makale.field} · {makale.keywords}</div>
          </div>
          {makale.file_url && (
            <a href={makale.file_url} target="_blank" style={{fontSize:11,color:"#fff",background:G.teal,padding:"5px 12px",borderRadius:5,fontWeight:700,whiteSpace:"nowrap",flexShrink:0}}>📄 Makaleyi İndir</a>
          )}
        </div>
      )}

      <div style={{padding:"20px"}}>

        {/* ADIM 1: PUANLAMA */}
        {adim===1 && (
          <div>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
              <div>
                <div style={{fontSize:13,fontWeight:700,color:G.ink}}>KRİTER BAZLI PUANLAMA</div>
                <div style={{fontSize:11,color:G.muted,marginTop:2}}>PNAS · Wiley · Elsevier standartları · Her kriter için 1–5 puan</div>
              </div>
              {parseFloat(ort())>0 && (
                <div style={{textAlign:"center",background:"#fff",borderRadius:10,padding:"8px 16px",border:`2px solid ${ortRenk()}`}}>
                  <div style={{fontSize:20,fontWeight:700,color:ortRenk()}}>{ort()}</div>
                  <div style={{fontSize:9,color:G.muted}}>/ 5.00 Ort.</div>
                </div>
              )}
            </div>

            {kriterler.map((kr,i) => (
              <div key={kr.key} style={{marginBottom:14,background:"#fff",borderRadius:8,padding:"12px 14px",border:`1px solid ${puanlar[kr.key]>0?"#c9a84c44":G.border}`}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10}}>
                  <div style={{flex:1}}>
                    <div style={{fontSize:13,fontWeight:700,color:G.ink,marginBottom:2}}>
                      <span style={{color:G.muted,marginRight:6,fontSize:11}}>{i+1}.</span>{kr.lbl}
                    </div>
                    <div style={{fontSize:11,color:G.muted}}>{kr.desc}</div>
                  </div>
                  <div style={{display:"flex",gap:4,flexShrink:0}}>
                    {[1,2,3,4,5].map(n => {
                      const lbls=["","Yetersiz","Zayıf","Orta","İyi","Mükemmel"];
                      return (
                        <div key={n} style={{textAlign:"center"}}>
                          <button onClick={()=>setPuanlar(p=>({...p,[kr.key]:n}))} title={lbls[n]} style={{
                            width:32,height:32,borderRadius:6,
                            border:`2px solid ${puanlar[kr.key]===n?"#1a1208":puanlar[kr.key]>=n?"#c9a84c":G.border}`,
                            background:puanlar[kr.key]===n?"#1a1208":puanlar[kr.key]>n?"#c9a84c":"#fff",
                            color:puanlar[kr.key]>=n?"#fff":G.muted,
                            fontWeight:700,fontSize:12,cursor:"pointer",display:"block"
                          }}>{n}</button>
                          <div style={{fontSize:8,color:G.muted,marginTop:2,width:32,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{lbls[n]}</div>
                        </div>
                      );
                    })}
                  </div>
                </div>
                <div style={{height:3,background:"#f1f5f9",borderRadius:2,marginTop:10}}>
                  <div style={{height:"100%",background:puanlar[kr.key]>=4?"#065f46":puanlar[kr.key]>=3?"#c9a84c":"#ef4444",borderRadius:2,width:`${puanlar[kr.key]*20}%`,transition:"width 0.3s"}}/>
                </div>
              </div>
            ))}

            {/* Genel skor özeti */}
            {Object.values(puanlar).every(v=>v>0) && (
              <div style={{background:"linear-gradient(135deg,#1a1208,#2a1f0a)",borderRadius:10,padding:"14px 18px",marginBottom:14}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <div style={{color:"#f0e6cc",fontSize:13,fontWeight:700}}>Genel Ortalama Puan</div>
                  <div style={{fontSize:22,fontWeight:700,color:"#c9a84c"}}>{ort()} / 5.00</div>
                </div>
                <div style={{marginTop:8,height:6,background:"rgba(255,255,255,0.1)",borderRadius:3}}>
                  <div style={{height:"100%",background:"#c9a84c",borderRadius:3,width:`${(parseFloat(ort())/5)*100}%`,transition:"width 0.4s"}}/>
                </div>
                <div style={{display:"flex",justifyContent:"space-between",marginTop:4}}>
                  <span style={{fontSize:9,color:"#8a7d60"}}>1.0 Yetersiz</span>
                  <span style={{fontSize:9,color:"#8a7d60"}}>3.0 Kabul Edilebilir</span>
                  <span style={{fontSize:9,color:"#8a7d60"}}>5.0 Mükemmel</span>
                </div>
              </div>
            )}

            <button onClick={()=>setAdim(2)} style={{width:"100%",background:G.teal,color:"#fff",border:"none",padding:"12px",borderRadius:8,fontWeight:700,fontSize:13,cursor:"pointer"}}>
              Değerlendirmeye Devam Et →
            </button>
          </div>
        )}

        {/* ADIM 2: YORUMLAR */}
        {adim===2 && (
          <div>
            {/* Güçlü / Zayıf */}
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:14}}>
              <div>
                <div style={{fontSize:11,fontWeight:700,color:"#065f46",marginBottom:5,display:"flex",alignItems:"center",gap:5}}>
                  <span style={{background:"#d1fae5",color:"#065f46",padding:"1px 7px",borderRadius:10,fontSize:10}}>Editör & Yazar Görür</span>
                  GÜÇLÜ YÖNLER *
                </div>
                <textarea ref={gucluRef} placeholder="Makalenin özgün katkısı, metodolojisinin sağlamlığı, alanyazına katkısı vb. güçlü yönleri..." rows={5} style={{width:"100%",padding:"9px",border:"1.5px solid #d1fae5",borderRadius:7,fontSize:12.5,resize:"vertical",boxSizing:"border-box",background:"#f0fdf4",lineHeight:1.6}}/>
              </div>
              <div>
                <div style={{fontSize:11,fontWeight:700,color:"#991b1b",marginBottom:5,display:"flex",alignItems:"center",gap:5}}>
                  <span style={{background:"#fee2e2",color:"#991b1b",padding:"1px 7px",borderRadius:10,fontSize:10}}>Editör & Yazar Görür</span>
                  ZAYIF YÖNLER *
                </div>
                <textarea ref={zayifRef} placeholder="Geliştirilmesi gereken noktalar, metodolojik eksiklikler, eksik alanyazın, düzeltilmesi gereken ifadeler..." rows={5} style={{width:"100%",padding:"9px",border:"1.5px solid #fee2e2",borderRadius:7,fontSize:12.5,resize:"vertical",boxSizing:"border-box",background:"#fff7f7",lineHeight:1.6}}/>
              </div>
            </div>

            {/* Yazara açık değerlendirme */}
            <div style={{marginBottom:14,background:"#fff",borderRadius:8,padding:"14px",border:"1.5px solid #bfdbfe"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                <div style={{fontSize:12,fontWeight:700,color:"#1e40af"}}>✉ YAZARA AÇIK DEĞERLENDİRME *</div>
                <span style={{background:"#dbeafe",color:"#1e40af",padding:"2px 10px",borderRadius:20,fontSize:10,fontWeight:700}}>Editör + Yazar Görür</span>
              </div>
              <div style={{fontSize:11,color:G.muted,marginBottom:8}}>Yazara iletilecek değerlendirme, revizyon önerileri ve yapıcı geri bildirimler. (İsteğe bağlı)</div>
              <textarea ref={yazaraRef} placeholder="Sevgili yazar, makalenizi değerlendirdim. Çalışmanız... [Yapıcı, nesnel ve gelişime odaklı yazın]" rows={7} style={{width:"100%",padding:"10px 12px",border:"1.5px solid #bfdbfe",borderRadius:6,fontSize:13,resize:"vertical",lineHeight:1.7,boxSizing:"border-box",background:"#f0f9ff"}}/>
            </div>

            {/* Editöre gizli not */}
            <div style={{marginBottom:14,background:"#fff",borderRadius:8,padding:"14px",border:"1.5px solid #c4b5fd"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                <div style={{fontSize:12,fontWeight:700,color:"#6d28d9"}}>🔒 EDİTÖRE GİZLİ NOT *</div>
                <span style={{background:"#ede9fe",color:"#6d28d9",padding:"2px 10px",borderRadius:20,fontSize:10,fontWeight:700}}>Yalnızca Editör Görür</span>
              </div>
              <div style={{fontSize:11,color:G.muted,marginBottom:8}}>Yalnızca editörün göreceği gizli not. Çıkar çatışması, intihal şüphesi veya yayın kararı önerisi. (İsteğe bağlı)</div>
              <textarea ref={editoreRef} placeholder="Editör'e: Bu çalışma hakkında kamuoyuna açıklanmamasını istediğim görüşlerim şunlardır..." rows={5} style={{width:"100%",padding:"10px 12px",border:"1.5px solid #c4b5fd",borderRadius:6,fontSize:13,resize:"vertical",lineHeight:1.7,boxSizing:"border-box",background:"#faf5ff"}}/>
            </div>

            {/* Ek dosya */}
            <div style={{marginBottom:14,background:"#fff",borderRadius:8,padding:"14px",border:`1px solid ${G.border}`}}>
              <div style={{fontSize:12,fontWeight:700,color:G.ink,marginBottom:5}}>📎 EK DOSYA (İsteğe bağlı)</div>
              <div style={{fontSize:11,color:G.muted,marginBottom:8}}>Notlandırılmış makale, referans listesi, tablo düzeltmeleri veya ek analiz dosyası yükleyebilirsiniz. (PDF, DOCX, XLSX — max 10MB)</div>
              <input ref={ekDosyaRef} type="file" accept=".pdf,.docx,.doc,.xlsx,.xls" style={{fontSize:13,color:"#444"}}/>
              {ekDosyaMsg && <div style={{fontSize:12,color:ekDosyaMsg.includes("✓")?"#065f46":"#991b1b",marginTop:6,fontWeight:600}}>{ekDosyaMsg}</div>}
            </div>

            <div style={{display:"flex",gap:10}}>
              <button onClick={()=>setAdim(1)} style={{padding:"10px 20px",background:"#fff",border:`1px solid ${G.border}`,borderRadius:7,fontSize:12,color:G.muted,cursor:"pointer"}}>← Geri</button>
              <button onClick={()=>setAdim(3)} style={{flex:1,background:G.teal,color:"#fff",border:"none",padding:"11px",borderRadius:7,fontWeight:700,fontSize:13,cursor:"pointer"}}>Karara Geç →</button>
            </div>
          </div>
        )}

        {/* ADIM 3: KARAR */}
        {adim===3 && (
          <div>
            <div style={{fontSize:13,fontWeight:700,color:G.ink,marginBottom:4}}>EDİTÖRYEL KARAR</div>
            <div style={{fontSize:11,color:G.muted,marginBottom:14}}>Uluslararası dergi standartlarına uygun karar seçenekleri. Kararınız, gizli notunuzla birlikte editöre iletilecektir.</div>

            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:20}}>
              {kararlar.map(k => (
                <div key={k.k} onClick={()=>setKarar(k.k)} style={{
                  border:`2px solid ${karar===k.k?k.c:G.border}`,borderRadius:10,padding:"12px 14px",
                  cursor:"pointer",background:karar===k.k?k.bg:"#fff",transition:"all 0.15s"
                }}>
                  <div style={{fontWeight:700,fontSize:12,color:k.c,marginBottom:2}}>
                    {k.lbl_tr}
                    <span style={{fontWeight:400,color:G.muted,marginLeft:6,fontSize:10}}>({k.lbl})</span>
                  </div>
                  <div style={{fontSize:10.5,color:G.muted,lineHeight:1.5}}>{k.desc}</div>
                </div>
              ))}
            </div>

            {/* Özet */}
            <div style={{background:"#fff",borderRadius:10,padding:"14px",border:`1px solid ${G.border}`,marginBottom:14}}>
              <div style={{fontSize:11,fontWeight:700,color:G.ink,marginBottom:10,letterSpacing:0.5}}>DEĞERLENDİRME ÖZETİ</div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
                {kriterler.map(kr=>(
                  <div key={kr.key} style={{display:"flex",justifyContent:"space-between",fontSize:11,padding:"4px 0",borderBottom:`1px solid ${G.border}22`}}>
                    <span style={{color:G.muted}}>{kr.lbl}</span>
                    <span style={{fontWeight:700,color:puanlar[kr.key]>=4?"#065f46":puanlar[kr.key]>=3?"#b45309":"#991b1b"}}>{puanlar[kr.key]}/5</span>
                  </div>
                ))}
              </div>
              <div style={{display:"flex",justifyContent:"space-between",marginTop:8,paddingTop:8,borderTop:`2px solid ${G.border}`}}>
                <span style={{fontSize:12,fontWeight:700,color:G.ink}}>Genel Ortalama</span>
                <span style={{fontSize:14,fontWeight:700,color:ortRenk()}}>{ort()} / 5.00</span>
              </div>
            </div>

            {/* Gizlilik uyarısı */}
            <div style={{background:"#fffbeb",borderRadius:8,padding:"10px 14px",marginBottom:14,border:"1px solid #fde68a",fontSize:11,color:"#92400e"}}>
              ⚠ <strong>Gizlilik:</strong> Editöre gizli notunuz yalnızca editör tarafından görülebilir. Yazara açık değerlendirmeniz ve puanlarınız yazara iletilir. Hakem kimliğiniz her iki taraftan da gizli tutulur (COPE Çift Kör Hakem Süreci).
            </div>

            <div style={{display:"flex",gap:10}}>
              <button onClick={()=>setAdim(2)} style={{padding:"10px 20px",background:"#fff",border:`1px solid ${G.border}`,borderRadius:7,fontSize:12,color:G.muted,cursor:"pointer"}}>← Geri</button>
              <button onClick={gonder} disabled={gonderiyor||!karar} style={{
                flex:1,background:karar?G.teal:"#94a3b8",color:"#fff",border:"none",padding:"12px",
                borderRadius:7,fontWeight:700,fontSize:13,cursor:karar?"pointer":"not-allowed",
                opacity:gonderiyor?0.6:1
              }}>
                {gonderiyor?"Gönderiliyor...":"✓ DEĞERLENDİRMEYİ TAMAMLA & GÖNDER"}
              </button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// ─── HAKEM PANELİ ─────────────────────────────────────────────────────────────
function HakemSekme({user, toast_}) {
  const [atamalar, setAtamalar] = React.useState([]);
  const [makaleler, setMakaleler] = React.useState({});
  const [acik, setAcik] = React.useState(null);

  const yukle = React.useCallback(async () => {
    const {data} = await supa.from("reviews").select("*").eq("reviewer_email",user.email).order("assigned_at",{ascending:false});
    if (!data) return;
    setAtamalar(data);
    const ids=[...new Set(data.map(r=>r.article_id))];
    if(ids.length>0){
      const {data:arts}=await supa.from("articles").select("*").in("id",ids);
      if(arts){const m={};arts.forEach(a=>{m[a.id]=a;});setMakaleler(m);}
    }
  },[user.email]);

  React.useEffect(()=>{yukle();},[yukle]);

  const degerlendir = React.useCallback(async(reviewId,articleId,karar,yorum)=>{
    await supa.from("reviews").update({status:"tamamlandi",decision:karar,comments:yorum,completed_at:new Date().toISOString()}).eq("id",reviewId);
    await supa.from("articles").update({status:karar==="kabul"?"baskida":karar==="revizyon"?"revizyon":"reddedildi"}).eq("id",articleId);
    toast_("✓ Değerlendirmeniz editöre iletildi. Teşekkür ederiz!");
    setAcik(null);
    yukle();
  },[yukle,toast_]);

  const bekleyen = atamalar.filter(r=>r.status==="beklemede");

  return (
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:18}}>
        <div>
          <h3 style={{fontSize:17,fontWeight:700,color:G.ink,margin:0}}>HAKEM PANELİ</h3>
          <p style={{fontSize:12,color:G.muted,margin:"3px 0 0",fontStyle:"italic"}}>Çift kör değerlendirme sistemi · COPE standartları</p>
        </div>
        <div style={{display:"flex",gap:8}}>
          <div style={{textAlign:"center",background:"#dbeafe",borderRadius:8,padding:"7px 12px",border:"1px solid #bfdbfe"}}>
            <div style={{fontSize:18,fontWeight:700,color:"#1e40af"}}>{bekleyen.length}</div>
            <div style={{fontSize:10,color:"#1e40af"}}>Bekleyen</div>
          </div>
          <div style={{textAlign:"center",background:"#d1fae5",borderRadius:8,padding:"7px 12px",border:"1px solid #a7f3d0"}}>
            <div style={{fontSize:18,fontWeight:700,color:"#065f46"}}>{atamalar.filter(r=>r.status==="tamamlandi").length}</div>
            <div style={{fontSize:10,color:"#065f46"}}>Tamamlanan</div>
          </div>
        </div>
      </div>

      {bekleyen.length > 0 && (
        <div style={{background:"linear-gradient(135deg,#fef3c7,#fde68a)",border:"1px solid #f59e0b",borderRadius:10,padding:"11px 15px",marginBottom:18,display:"flex",alignItems:"center",gap:10}}>
          <div style={{fontSize:18}}>⚠</div>
          <div>
            <div style={{fontWeight:700,fontSize:13,color:"#92400e"}}>{bekleyen.length} makale değerlendirmenizi bekliyor</div>
            <div style={{fontSize:11,color:"#b45309"}}>Lütfen 30 gün içinde değerlendirmenizi tamamlayınız.</div>
          </div>
        </div>
      )}

      {atamalar.length === 0 ? (
        <div style={{textAlign:"center",padding:"50px 20px",color:G.muted,background:G.cream,borderRadius:12,border:`1px solid ${G.border}`}}>
          <div style={{fontSize:28,marginBottom:10}}>⊕</div>
          <p style={{fontStyle:"italic",marginBottom:6}}>Henüz size atanmış makale yok.</p>
          <p style={{fontSize:12}}>Editör atama yaptığında burada görünür.</p>
        </div>
      ) : atamalar.map(r => {
        const makale = makaleler[r.article_id];
        const tamam = r.status==="tamamlandi";
        const isAcik = acik===r.id;
        return (
          <div key={r.id} style={{border:`1px solid ${tamam?G.border:"#f59e0b"}`,borderRadius:12,marginBottom:12,overflow:"hidden",borderLeft:`4px solid ${tamam?"#065f46":"#f59e0b"}`}}>
            <div onClick={()=>setAcik(isAcik?null:r.id)} style={{background:"#fff",padding:"14px 18px",cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10}}>
              <div style={{flex:1}}>
                <div style={{fontWeight:700,fontSize:13.5,color:G.ink,marginBottom:3,lineHeight:1.4}}>{makale?.title||"Yükleniyor..."}</div>
                <div style={{fontSize:11,color:G.muted}}>{makale?.field} · Atandı: {r.assigned_at?.split("T")[0]}</div>
                {!tamam && <span style={{display:"inline-block",marginTop:4,fontSize:9,padding:"2px 7px",borderRadius:20,background:"#fef3c7",color:"#92400e",fontWeight:700}}>DEĞERLENDİRME BEKLENİYOR</span>}
                {tamam && r.decision && <div style={{marginTop:4,fontSize:10,display:"inline-block",padding:"2px 8px",borderRadius:20,background:r.decision==="kabul"?"#d1fae5":"#ede9fe",color:r.decision==="kabul"?"#065f46":"#6d28d9",fontWeight:700}}>Kararınız: {r.decision==="kabul"?"Kabul":"Revizyon"}</div>}
              </div>
              <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:5,flexShrink:0}}>
                <span style={{fontSize:10,padding:"3px 10px",borderRadius:20,fontWeight:700,background:tamam?"#d1fae5":"#fef3c7",color:tamam?"#065f46":"#92400e"}}>{tamam?"✓ Tamamlandı":"⏳ Bekliyor"}</span>
                {makale?.file_url && !tamam && <a href={makale.file_url} target="_blank" onClick={e=>e.stopPropagation()} style={{fontSize:10,color:"#fff",background:G.teal,padding:"3px 10px",borderRadius:5,fontWeight:700}}>📄 İndir</a>}
                <span style={{color:G.gold,fontSize:12}}>{isAcik?"▲":"▼"}</span>
              </div>
            </div>
            {isAcik && !tamam && <HakemDegerlendirmeFormu review={r} makale={makale} onGonder={degerlendir}/>}
            {isAcik && tamam && (
              <div style={{padding:"16px 18px",background:"#f0fdf4",borderTop:`1px solid ${G.border}`}}>
                <div style={{fontSize:11,fontWeight:700,color:"#065f46",marginBottom:8}}>TAMAMLANAN DEĞERLENDİRMENİZ</div>
                <p style={{fontSize:13,color:"#444",lineHeight:1.7,margin:0,whiteSpace:"pre-line"}}>{r.comments}</p>
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

// ─── YÖNETİM PANELİ ──────────────────────────────────────────────────────────
function YonetimSekme({articles, users, toast_, loadArticles}) {
  const [reviews, setReviews]           = React.useState([]);
  const [acikMakale, setAcikMakale]     = React.useState(null);
  const [sekme, setSekme]               = React.useState("dashboard");
  const [yazarNotMakale, setYazarNotMakale] = React.useState(null);
  const [filtre, setFiltre]             = React.useState("tumu");
  const [arama, setArama]               = React.useState("");
  const notRef = React.useRef(null);

  const yukleReviews = React.useCallback(async()=>{
    const{data}=await supa.from("reviews").select("*").order("assigned_at",{ascending:false});
    if(data)setReviews(data);
  },[]);

  React.useEffect(()=>{yukleReviews();},[yukleReviews]);

  const durumGuncelle = async(id,durum)=>{
    await supa.from("articles").update({status:durum}).eq("id",id);
    await loadArticles();
    toast_("✓ Makale durumu güncellendi!");
  };

  const hakemAta = async(makale,hakemEmail)=>{
    const hakem=users.find(u=>u.email===hakemEmail);
    if(!hakem)return;
    const zaten=reviews.some(r=>r.article_id===makale.id&&r.reviewer_email===hakemEmail);
    if(zaten){toast_("Bu hakem zaten atanmış.","err");return;}
    await supa.from("reviews").insert([{article_id:makale.id,reviewer_email:hakem.email,reviewer_name:hakem.name,status:"beklemede"}]);
    await supa.from("articles").update({status:"hakemde"}).eq("id",makale.id);
    await loadArticles();await yukleReviews();
    toast_(`✓ ${hakem.name} makaleye atandı!`);
  };

  const yazaraNot = async()=>{
    const not=notRef.current?.value?.trim();
    if(!not){toast_("Not boş olamaz.","err");return;}
    await supa.from("article_notes").insert([{article_id:yazarNotMakale.id,to_email:yazarNotMakale.author_email,from_name:"Editör",content:not}]);
    toast_("✓ Not yazara iletildi!");setYazarNotMakale(null);
  };

  const hakemler = users.filter(u=>u.role==="hakem"||u.role==="yazar-hakem");
  const yeniMakaleler = articles.filter(a=>a.status==="beklemede");
  const tamamlananDeg = reviews.filter(r=>r.status==="tamamlandi");
  const toplamBildirim = yeniMakaleler.length + tamamlananDeg.length;

  const filtreliMakaleler = articles.filter(a=>{
    const df = filtre==="tumu"||a.status===filtre;
    const af = !arama||a.title?.toLowerCase().includes(arama.toLowerCase())||a.author?.toLowerCase().includes(arama.toLowerCase());
    return df&&af;
  });

  const istat = [
    {n:articles.length,l:"Toplam",c:"#1a1208",bg:"#f5f0e8"},
    {n:articles.filter(a=>a.status==="beklemede").length,l:"Ön İnceleme",c:"#1e40af",bg:"#eff6ff"},
    {n:articles.filter(a=>a.status==="hakemde").length,l:"Hakemde",c:"#b45309",bg:"#fffbeb"},
    {n:tamamlananDeg.length,l:"Değerlendirme",c:"#6d28d9",bg:"#f5f3ff"},
    {n:articles.filter(a=>a.status==="baskida"||a.status==="yayinda").length,l:"Kabul/Yayın",c:"#065f46",bg:"#ecfdf5"},
    {n:articles.filter(a=>a.status==="reddedildi").length,l:"Reddedilen",c:"#991b1b",bg:"#fff1f2"},
  ];

  const SEKMELER = [
    {id:"dashboard",lbl:"Dashboard",icon:"▣"},
    {id:"makaleler",lbl:"Makaleler",icon:"📄",badge:yeniMakaleler.length},
    {id:"degerlendirmeler",lbl:"Değerlendirmeler",icon:"⊕",badge:tamamlananDeg.length},
    {id:"uyeler",lbl:"Üyeler",icon:"◎"},
  ];

  return (
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:18,paddingBottom:14,borderBottom:`1px solid ${G.border}`}}>
        <div>
          <h3 style={{fontSize:17,fontWeight:700,color:G.ink,margin:0}}>EDİTÖR PANELİ</h3>
          <p style={{fontSize:11,color:G.muted,margin:"3px 0 0"}}>ARSİS Journal Management System · {new Date().toLocaleDateString("tr-TR",{day:"numeric",month:"long",year:"numeric"})}</p>
        </div>
        {toplamBildirim > 0 && (
          <div style={{background:"#dc2626",color:"#fff",borderRadius:8,padding:"8px 14px",display:"flex",alignItems:"center",gap:8}}>
            <span style={{fontSize:16}}>🔔</span>
            <div>
              <div style={{fontWeight:700,fontSize:12}}>{toplamBildirim} yeni bildirim</div>
              <div style={{fontSize:10,opacity:0.9}}>Dikkat gerektiren işlemler var</div>
            </div>
          </div>
        )}
      </div>

      <div style={{display:"flex",gap:0,marginBottom:20,background:"#f8fafc",borderRadius:8,padding:4,border:`1px solid ${G.border}`}}>
        {SEKMELER.map(s=>(
          <button key={s.id} onClick={()=>setSekme(s.id)} style={{
            flex:1,padding:"7px 10px",border:"none",borderRadius:6,cursor:"pointer",fontSize:12,
            fontWeight:sekme===s.id?700:500,background:sekme===s.id?"#fff":"transparent",
            color:sekme===s.id?G.ink:G.muted,
            boxShadow:sekme===s.id?"0 1px 4px rgba(0,0,0,0.1)":"none",
            display:"flex",alignItems:"center",justifyContent:"center",gap:4
          }}>
            {s.icon} {s.lbl}
            {s.badge>0&&<BildirimBadge count={s.badge}/>}
          </button>
        ))}
      </div>

      {sekme==="dashboard" && (
        <div>
          {toplamBildirim > 0 && (
            <div style={{marginBottom:18}}>
              <div style={{fontSize:11,fontWeight:700,color:G.ink,letterSpacing:0.5,marginBottom:8}}>BİLDİRİMLER</div>
              {yeniMakaleler.length > 0 && (
                <div onClick={()=>setSekme("makaleler")} style={{background:"linear-gradient(135deg,#eff6ff,#dbeafe)",border:"1px solid #bfdbfe",borderRadius:10,padding:"11px 14px",marginBottom:7,cursor:"pointer",display:"flex",alignItems:"center",gap:10}}>
                  <div style={{width:34,height:34,borderRadius:8,background:"#1e40af",display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontSize:15,flexShrink:0}}>📄</div>
                  <div style={{flex:1}}>
                    <div style={{fontWeight:700,fontSize:13,color:"#1e3a8a"}}>{yeniMakaleler.length} yeni makale — ön inceleme bekliyor</div>
                    <div style={{fontSize:11,color:"#3b82f6"}}>Hemen incele →</div>
                  </div>
                </div>
              )}
              {tamamlananDeg.length > 0 && (
                <div onClick={()=>setSekme("degerlendirmeler")} style={{background:"linear-gradient(135deg,#f5f3ff,#ede9fe)",border:"1px solid #c4b5fd",borderRadius:10,padding:"11px 14px",marginBottom:7,cursor:"pointer",display:"flex",alignItems:"center",gap:10}}>
                  <div style={{width:34,height:34,borderRadius:8,background:"#6d28d9",display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontSize:15,flexShrink:0}}>⊕</div>
                  <div style={{flex:1}}>
                    <div style={{fontWeight:700,fontSize:13,color:"#4c1d95"}}>{tamamlananDeg.length} hakem değerlendirmesi tamamlandı</div>
                    <div style={{fontSize:11,color:"#7c3aed"}}>Karar vermek için incele →</div>
                  </div>
                </div>
              )}
            </div>
          )}

          <div style={{fontSize:11,fontWeight:700,color:G.ink,letterSpacing:0.5,marginBottom:8}}>İSTATİSTİKLER</div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:9,marginBottom:20}}>
            {istat.map(s=>(
              <div key={s.l} style={{background:s.bg,borderRadius:10,padding:"12px 14px",border:`1px solid ${s.c}22`,textAlign:"center"}}>
                <div style={{fontSize:26,fontWeight:700,color:s.c,lineHeight:1}}>{s.n}</div>
                <div style={{fontSize:10,color:s.c,marginTop:3,fontWeight:600}}>{s.l}</div>
              </div>
            ))}
          </div>

          <div style={{fontSize:11,fontWeight:700,color:G.ink,letterSpacing:0.5,marginBottom:8}}>EDİTÖRYEL İŞ AKIŞI</div>
          <div style={{background:"#fff",borderRadius:10,border:`1px solid ${G.border}`,overflow:"hidden"}}>
            {[
              {a:"1",lbl:"Gönderim",desc:"Yazar makaleyi gönderdi",n:articles.length,c:"#1a1208"},
              {a:"2",lbl:"Ön İnceleme",desc:"Editör kapsam & biçim denetimi",n:articles.filter(x=>x.status==="beklemede").length,c:"#1e40af"},
              {a:"3",lbl:"Hakem İncelemesi",desc:"Çift kör değerlendirme",n:articles.filter(x=>x.status==="hakemde").length,c:"#6d28d9"},
              {a:"4",lbl:"Editöryal Karar",desc:"Kabul / Revizyon / Red",n:tamamlananDeg.length,c:"#0891b2"},
              {a:"5",lbl:"Yayın",desc:"Baskıya hazır veya yayında",n:articles.filter(x=>x.status==="baskida"||x.status==="yayinda").length,c:"#065f46"},
            ].map((s,i,arr)=>(
              <div key={s.a} style={{display:"flex",alignItems:"center",padding:"10px 14px",borderBottom:i<arr.length-1?`1px solid ${G.border}`:"none"}}>
                <div style={{width:26,height:26,borderRadius:"50%",background:s.c,color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700,flexShrink:0}}>{s.a}</div>
                <div style={{flex:1,marginLeft:10}}>
                  <div style={{fontWeight:700,fontSize:12.5,color:G.ink}}>{s.lbl}</div>
                  <div style={{fontSize:10,color:G.muted}}>{s.desc}</div>
                </div>
                <div style={{fontWeight:700,fontSize:18,color:s.c}}>{s.n}</div>
              </div>
            ))}
          </div>
        </div>
      )}

      {sekme==="makaleler" && (
        <div>
          <div style={{display:"flex",gap:8,marginBottom:14,flexWrap:"wrap"}}>

            const aRev=reviews.filter(r=>r.article_id===a.id);

              <div key={a.id} style={{border:`1px solid ${G.border}`,borderRadius:10,marginBottom:10,overflow:"hidden",borderLeft:`4px solid ${d.renk||G.border}`}}>

                  <div style={{flex:1}}>
                    <div style={{fontWeight:700,fontSize:13,color:G.ink,marginBottom:2,lineHeight:1.4}}>{a.title}</div>
                    <div style={{fontSize:11,color:G.muted}}><strong>{a.author}</strong> · {a.field} · {a.created_at?.split("T")[0]}</div>

                          {r.status==="tamamlandi"?"✓":"⏳"} {r.reviewer_name}{r.decision?` (${r.decision==="kabul"?"K":r.decision==="revizyon"?"R":"X"})`:""}

                  <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:5,flexShrink:0}}>

                  </div>
                </div>
                {acik && (
                  <div style={{background:"#f8fafc",borderTop:`1px solid ${G.border}`,padding:"14px"}}>
                    {a.abstract&&<div style={{background:"#fff",borderRadius:8,padding:"10px 12px",marginBottom:12,border:`1px solid ${G.border}`}}><div style={{fontSize:10,color:G.gold,fontWeight:700,marginBottom:4}}>ÖZET</div><p style={{fontSize:12.5,color:"#555",lineHeight:1.65,margin:0}}>{a.abstract}</p></div>}
                    {aRev.filter(r=>r.status==="tamamlandi").length>0&&(
                      <div style={{background:"#fff",borderRadius:8,padding:"12px",marginBottom:12,border:"1px solid #c4b5fd"}}>
                        <div style={{fontSize:10,fontWeight:700,color:"#6d28d9",marginBottom:10}}>HAKEM DEĞERLENDİRMELERİ</div>
                        {aRev.filter(r=>r.status==="tamamlandi").map(r=>(

                        <div style={{marginBottom:10}}>

                                <div style={{fontSize:12,fontWeight:700,color:G.ink}}>{r.reviewer_name}</div>
                                <div style={{fontSize:10,color:G.muted}}>{r.reviewer_email}</div>
                              </div>
                              <div style={{display:"flex",alignItems:"center",gap:6}}>
                                <span style={{
                                  fontSize:10,padding:"2px 8px",borderRadius:20,fontWeight:700,
                                  background:r.status==="tamamlandi"?"#d1fae5":r.status==="geri_cekildi"?"#f3f4f6":"#fef3c7",

                                }}>
                                  {r.status==="tamamlandi"?"✓ Değerlendirdi":r.status==="geri_cekildi"?"✗ Geri Çekildi":"⏳ Bekliyor"}
                                </span>
                                {r.status==="beklemede" && (
                                  <button onClick={async()=>{

                      {r.decision&&<span style={{fontSize:10,padding:"2px 8px",borderRadius:20,fontWeight:700,background:r.decision==="kabul"?"#d1fae5":r.decision==="revizyon"?"#ede9fe":"#fee2e2",color:r.decision==="kabul"?"#065f46":r.decision==="revizyon"?"#6d28d9":"#991b1b"}}>{r.decision==="kabul"?"✓ Kabul":r.decision==="revizyon"?"↻ Revizyon":"✗ Red"}</span>}

                </div>
              </div>
            );
          })}
        </div>
      )}

      {sekme==="uyeler" && (
        <div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:9,marginBottom:14}}>
            {[
              {n:users.filter(u=>u.role==="editor").length,     l:"Editör",       c:"#b45309", bg:"#fef3c7"},
              {n:users.filter(u=>u.role==="hakem"||u.role==="yazar-hakem").length, l:"Hakem",  c:G.teal,    bg:"#ecfdf5"},
              {n:users.filter(u=>u.role==="yazar"||u.role==="yazar-hakem"||!u.role).length, l:"Yazar", c:"#6d28d9", bg:"#f5f3ff"},
              {n:users.length, l:"Toplam Üye", c:"#1a1208", bg:"#f5f0e8"},
            ].map(s=>(
              <div key={s.l} style={{background:s.bg,borderRadius:8,padding:"11px",textAlign:"center",border:`1px solid ${s.c}22`}}>
                <div style={{fontSize:22,fontWeight:700,color:s.c}}>{s.n}</div>
                <div style={{fontSize:11,color:s.c,fontWeight:600}}>{s.l}</div>
              </div>

          {/* Gruplu liste */}
          {[
            {lbl:"HAKEMLER", icon:"⊕", filter:(u)=>u.role==="hakem"||u.role==="yazar-hakem", c:G.teal, bg:"#ecfdf5", bc:"#a7f3d0"},
            {lbl:"YAZARLAR", icon:"♩", filter:(u)=>u.role==="yazar"||u.role==="yazar-hakem"||(!u.role), c:"#6d28d9", bg:"#f5f3ff", bc:"#c4b5fd"},
          ].map(grup => {
            const grupUyeler = users.filter(grup.filter).filter(u=>u.role!=="editor");

            return (
              <div key={grup.lbl} style={{marginBottom:20}}>
                <div style={{
                  display:"flex",alignItems:"center",gap:8,marginBottom:10,
                  padding:"8px 12px",background:grup.bg,borderRadius:8,border:`1px solid ${grup.bc}`
                }}>
                  <span style={{color:grup.c,fontSize:14}}>{grup.icon}</span>
                  <span style={{fontWeight:700,fontSize:12,color:grup.c,letterSpacing:0.5}}>{grup.lbl}</span>
                  <span style={{
                    background:grup.c,color:"#fff",borderRadius:"50%",
                    width:20,height:20,display:"flex",alignItems:"center",justifyContent:"center",
                    fontSize:11,fontWeight:700
                  }}>{grupUyeler.length}</span>
                </div>
                {grupUyeler.map(u => {
                  const isHakem = u.role==="hakem"||u.role==="yazar-hakem";

                  const rolRenk = u.role==="yazar-hakem" ? "#0891b2" : isHakem ? G.teal : "#6d28d9";
                  const rolBg   = u.role==="yazar-hakem" ? "#e0f2fe" : isHakem ? "#ecfdf5" : "#f5f3ff";
                  const rolLbl  = u.role==="yazar-hakem" ? "YAZAR & HAKEM" : isHakem ? "HAKEM" : "YAZAR";
                  return (
                    <div key={u.id} style={{border:`1px solid ${G.border}`,borderRadius:9,padding:"11px 15px",marginBottom:7,display:"flex",justifyContent:"space-between",alignItems:"center",background:"#fff"}}>
                      <div style={{display:"flex",alignItems:"center",gap:11}}>
                        <div style={{
                          width:36,height:36,borderRadius:"50%",
                          background:rolBg,border:`2px solid ${rolRenk}`,
                          display:"flex",alignItems:"center",justifyContent:"center",
                          fontWeight:700,fontSize:15,color:rolRenk,flexShrink:0
                        }}>{u.name?.[0]}</div>
                        <div>
                          <div style={{fontWeight:700,fontSize:13,color:G.ink}}>{u.name}</div>
                          <div style={{fontSize:11,color:G.muted}}>{u.email}</div>
                          {u.institution && <div style={{fontSize:10,color:G.muted,fontStyle:"italic"}}>{u.institution}</div>}
                          {u.orcid && <div style={{fontSize:10,color:G.teal}}>ORCID: {u.orcid}</div>}
                        </div>
                      </div>
                      <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:5}}>
                        <span style={{
                          fontSize:10,padding:"4px 12px",borderRadius:20,fontWeight:700,
                          background:rolBg,color:rolRenk,whiteSpace:"nowrap"
                        }}>{rolLbl}</span>
                        {u.role==="yazar-hakem" && (
                          <span style={{fontSize:9,color:"#0891b2"}}>Her iki rolde aktif</span>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>
            );
          })}
        </div>
      )}

      {yazarNotMakale && (
        <div onClick={()=>setYazarNotMakale(null)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.6)",zIndex:500,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
          <div onClick={e=>e.stopPropagation()} style={{background:"#fff",borderRadius:16,padding:"26px 30px",width:"100%",maxWidth:460}}>
            <div style={{fontWeight:700,fontSize:14,color:G.ink,marginBottom:4}}>✏ YAZARA EDİTÖR NOTU</div>
            <div style={{fontSize:11,color:G.muted,fontStyle:"italic",marginBottom:3}}>{yazarNotMakale.title}</div>
            <div style={{fontSize:11,color:G.muted,marginBottom:12,padding:"7px 10px",background:"#f8fafc",borderRadius:6,border:`1px solid ${G.border}`}}>Alıcı: <strong>{yazarNotMakale.author}</strong> &lt;{yazarNotMakale.author_email}&gt;</div>
            <textarea ref={notRef} placeholder="Editör notunuzu yazın..." rows={5} style={{width:"100%",padding:"9px 12px",border:`1.5px solid ${G.border}`,borderRadius:8,fontSize:13,resize:"vertical",boxSizing:"border-box",marginBottom:12,lineHeight:1.7}}/>
            <div style={{display:"flex",gap:10}}>
              <button onClick={yazaraNot} style={{flex:1,background:"#b45309",color:"#fff",border:"none",padding:"10px 0",borderRadius:7,fontWeight:700,fontSize:12,cursor:"pointer"}}>✏ NOTU GÖNDER</button>
              <button onClick={()=>setYazarNotMakale(null)} style={{padding:"10px 18px",background:"none",border:`1px solid ${G.border}`,borderRadius:7,fontSize:12,color:G.muted,cursor:"pointer"}}>İptal</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

            <div style={{fontFamily:"serif",fontWeight:900,fontSize:20,color:"#c9a84c",letterSpacing:3,lineHeight:1}}>ARSİS</div>

          }}>{t.submit}</button>
        </div>
        <div style={{display:"flex",gap:6,alignItems:"center"}}>
          <div style={{display:"flex",gap:3}}>
            {["tr","en","el"].map(l => (
              <button key={l} onClick={() => setLang(l)} style={{
                background: lang===l?"#c9a84c":"transparent",
                color: lang===l?"#1a1208":"#c4b896",
                border:"1px solid rgba(201,168,76,0.4)",
                padding:"3px 9px",borderRadius:4,cursor:"pointer",fontSize:11
              }}>{l==="tr"?"TR":l==="en"?"EN":"ΕΛ"}</button>
            ))}
          </div>
          {user ? (
            <div style={{display:"flex",gap:8,alignItems:"center"}}>
              <button onClick={()=>{setPage("panel");}} style={{
                background:"rgba(201,168,76,0.12)",color:"#e8d080",
                border:"1px solid rgba(201,168,76,0.3)",padding:"6px 12px",
                borderRadius:6,cursor:"pointer",fontSize:12
              }}>♩ {user.name.split(" ")[0]}</button>
              <button onClick={()=>setModal("cikis")} style={{
                background:"transparent",color:"#7a6e5f",border:"none",
                cursor:"pointer",fontSize:11,padding:"4px 8px"
              }}>Çıkış</button>
            </div>
          ) : (
            <div style={{display:"flex",gap:6}}>
              <button onClick={()=>setModal("login")} style={{
                background:"transparent",color:"#c4b896",border:"1px solid rgba(201,168,76,0.3)",
                padding:"6px 12px",borderRadius:5,cursor:"pointer",fontSize:12
              }}>Giriş</button>
              <button onClick={()=>setModal("register")} style={{
                background:"#c9a84c",color:"#1a1208",border:"none",
                padding:"6px 12px",borderRadius:5,cursor:"pointer",fontSize:12,fontWeight:700

          )}

      </div>

// ─── PANEL SAYFASI ────────────────────────────────────────────────────────────
function PanelPage({user, setModal, toast_, lang, articles, users, loadArticles}) {
  const [sekme, setSekme] = React.useState("makalelerim");
  const myArticles = articles.filter(a => a.author_email === user?.email);

  const SEKMELER = [
    {id:"makalelerim", icon:"♩", label:"Makalelerim"},
    {id:"mesajlar",    icon:"✉", label:"Mesajlar"},
    {id:"profil",      icon:"◎", label:"Profilim"},
    ...(user?.role==="editor" ? [{id:"yonetim",icon:"⚙",label:"Yönetim"}] : []),
    ...(user?.role==="hakem"||user?.role==="yazar-hakem"  ? [{id:"hakem",  icon:"⊕",label:"Hakem Paneli"}] : []),

  return (
    <div style={{background:"#f5f0e8",minHeight:"80vh",padding:"36px 24px"}}>
      <div style={{maxWidth:1080,margin:"0 auto",display:"grid",gridTemplateColumns:"220px 1fr",gap:24}}>

        {/* Sol menü */}
        <div>
          <div style={{background:"#1a1208",borderRadius:12,padding:"22px 18px",marginBottom:14,textAlign:"center"}}>
            <div style={{width:52,height:52,background:"#c9a84c",borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",color:"#1a1208",fontSize:18,fontWeight:700,margin:"0 auto 12px"}}>
              {user?.name?.[0]}
            </div>
            <div style={{fontFamily:"serif",fontWeight:700,fontSize:13,color:"#f0e6cc"}}>{user?.name}</div>
            <div style={{fontSize:11,color:"#8a7d60",marginTop:2,fontStyle:"italic"}}>{user?.institution}</div>
            <div style={{marginTop:8}}>
              <span style={{fontSize:10,padding:"2px 10px",borderRadius:20,background:"rgba(201,168,76,0.25)",color:"#c9a84c",fontWeight:700}}>
                {user?.role==="editor"?"EDİTÖR":user?.role==="hakem"?"HAKEM":user?.role==="yazar-hakem"?"YAZAR & HAKEM":"YAZAR"}

            </div>
          </div>
          <div style={{background:"#fff",borderRadius:12,border:"1px solid #d4c9b4",overflow:"hidden"}}>
            {SEKMELER.map(item => (
              <button key={item.id} onClick={() => setSekme(item.id)} style={{
                width:"100%",display:"flex",alignItems:"center",gap:10,padding:"12px 16px",
                background:sekme===item.id?"rgba(201,168,76,0.1)":"transparent",
                border:"none",cursor:"pointer",fontSize:13,fontWeight:sekme===item.id?700:500,
                color:sekme===item.id?"#8b3a2a":"#1a1208",

                textAlign:"left"

                <span style={{color:"#c9a84c"}}>{item.icon}</span>{item.label}
              </button>
            ))}
          </div>
        </div>

        {/* Sağ içerik */}
        <div style={{background:"#fff",borderRadius:12,border:"1px solid #d4c9b4",padding:"28px 32px",minHeight:400}}>

          {/* MAKALELERİM */}
          {sekme==="makalelerim" && (
            <div>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:22}}>
                <h3 style={{fontSize:16,letterSpacing:1,color:"#1a1208",fontWeight:700,margin:0}}>MAKALELERİM</h3>
                <button onClick={() => setModal("makale")} style={{
                  background:"#c9a84c",color:"#1a1208",border:"none",padding:"8px 18px",
                  borderRadius:7,cursor:"pointer",fontFamily:"serif",fontSize:11,fontWeight:700,letterSpacing:1
                }}>+ MAKALE GÖNDER</button>
              </div>
              {myArticles.length === 0 ? (
                <div style={{textAlign:"center",padding:"50px 20px",color:"#7a6e5f"}}>
                  <p style={{marginBottom:14,fontStyle:"italic"}}>Henüz makale göndermediniz.</p>

                    background:"#1a1208",color:"#c9a84c",border:"none",padding:"9px 20px",
                    borderRadius:6,cursor:"pointer",fontFamily:"serif",fontSize:11
                  }}>İLK MAKALENİZİ GÖNDERİN</button>
                </div>
              ) : myArticles.map(a => {
                const d = DURUM[a.status]||{};
                const geriCekilebilir = ["beklemede","hakemde","revizyon"].includes(a.status);
                const zatenGeriCekildi = a.status === "geri_cekildi";
                return (
                  <div key={a.id} style={{
                    border:`1px solid ${zatenGeriCekildi?"#e5e7eb":"#d4c9b4"}`,
                    borderRadius:10,padding:"16px 20px",marginBottom:12,
                    background:zatenGeriCekildi?"#f9fafb":"#fff",
                    opacity:zatenGeriCekildi?0.75:1
                  }}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10}}>
                      <h4 style={{fontFamily:"serif",margin:"0 0 5px",fontSize:13.5,color:"#1a1208",flex:1,fontWeight:700}}>{a.title}</h4>
                      <span style={{
                        background:zatenGeriCekildi?"#f3f4f6":d.bg,
                        color:zatenGeriCekildi?"#6b7280":d.renk,
                        fontSize:10,padding:"3px 9px",borderRadius:20,fontWeight:700,whiteSpace:"nowrap"
                      }}>
                        {zatenGeriCekildi?"✕ Geri Çekildi":d.tr||a.status}
                      </span>
                    </div>
                    <p style={{margin:"0 0 8px",fontSize:12,color:"#7a6e5f",fontStyle:"italic"}}>
                      {a.created_at?.split("T")[0]} · {a.field}
                      {a.coauthors && <span> · Ortak: {a.coauthors}</span>}
                    </p>

                    {/* Süreç durumu — hakem ismi KESİNLİKLE GİZLİ */}
                    {a.status==="hakemde" && (
                      <div style={{
                        background:"#fffbeb",borderRadius:6,padding:"7px 12px",
                        marginBottom:8,border:"1px solid #fde68a",fontSize:11,color:"#92400e"
                      }}>
                        ⏳ Makaleniz hakem incelemesindedir. Hakem kimliği çift kör süreç gereği gizlidir.
                      </div>
                    )}
                    {a.status==="revizyon" && (
                      <div style={{
                        background:"#ede9fe",borderRadius:6,padding:"7px 12px",
                        marginBottom:8,border:"1px solid #c4b5fd",fontSize:11,color:"#6d28d9"
                      }}>
                        ↻ Makaleniz revizyon aşamasındadır. Editör notlarını inceleyiniz.
                      </div>
                    )}
                    {a.status==="baskida" && (
                      <div style={{
                        background:"#d1fae5",borderRadius:6,padding:"7px 12px",
                        marginBottom:8,border:"1px solid #a7f3d0",fontSize:11,color:"#065f46",fontWeight:700
                      }}>
                        ✓ Makaleniz kabul edilmiştir. Baskı sürecindedir.
                      </div>
                    )}
                    {a.status==="yayinda" && (
                      <div style={{
                        background:"#d1fae5",borderRadius:6,padding:"7px 12px",
                        marginBottom:8,border:"1px solid #a7f3d0",fontSize:11,color:"#065f46",fontWeight:700
                      }}>
                        🎉 Makaleniz yayımlanmıştır.
                      </div>
                    )}
                    {a.status==="reddedildi" && (
                      <div style={{
                        background:"#fee2e2",borderRadius:6,padding:"7px 12px",
                        marginBottom:8,border:"1px solid #fca5a5",fontSize:11,color:"#991b1b"
                      }}>
                        ✗ Makaleniz reddedilmiştir. Editör notlarını inceleyiniz.
                      </div>
                    )}

                    {/* Editörden gelen notlar */}
                    <YazarNotlari articleId={a.id}/>

                    {/* Geri çekme butonu */}
                    {geriCekilebilir && (
                      <div style={{marginTop:10,paddingTop:10,borderTop:"1px solid #f0ebe0"}}>
                        <button onClick={async()=>{
                          if(!confirm("Makalenizi geri çekmek istediğinizden emin misiniz?\n\nBu işlem geri alınamaz. Editöre bildirim gönderilecektir."))return;
                          await supa.from("articles").update({status:"geri_cekildi"}).eq("id",a.id);
                          await supa.from("reviews").update({status:"geri_cekildi"}).eq("article_id",a.id).eq("status","beklemede");
                          await supa.from("article_notes").insert([{
                            article_id:a.id,
                            to_email:"editor@arsis.tr",
                            from_name:user.name,
                            content:`"${a.title}" başlıklı makale yazar tarafından geri çekilmiştir. (${new Date().toLocaleDateString("tr-TR")})`
                          }]);
                          await loadArticles();
                          toast_("Makaleniz geri çekildi. Editöre bildirim gönderildi.");
                        }} style={{
                          background:"none",color:"#991b1b",border:"1px solid #fca5a5",
                          padding:"5px 14px",borderRadius:6,cursor:"pointer",fontSize:11,fontWeight:700
                        }}>
                          ✕ Makaleyi Geri Çek
                        </button>
                        <span style={{fontSize:10,color:"#7a6e5f",marginLeft:10}}>
                          Değerlendirme tamamlanmadan geri çekebilirsiniz.
                        </span>
                      </div>
                    )}
                    {zatenGeriCekildi && (
                      <div style={{marginTop:8,fontSize:11,color:"#6b7280",fontStyle:"italic"}}>
                        Bu makale geri çekilmiştir. Yeniden göndermek için yeni başvuru oluşturunuz.
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          )}

          {/* MESAJLAR */}
          {sekme==="mesajlar" && <MesajlarSekme user={user} toast_={toast_}/>}

          {/* PROFİL */}
          {sekme==="profil" && (
            <div>
              <h3 style={{fontSize:16,letterSpacing:1,color:"#1a1208",fontWeight:700,marginBottom:22}}>PROFİL BİLGİLERİM</h3>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
                {[["Ad Soyad",user?.name],["E-posta",user?.email],["Kurum",user?.institution||"—"],["ORCID",user?.orcid||"—"],["Rol",user?.role],["Erişim","Açık Erişim"]].map(([k,v]) => (
                  <div key={k} style={{background:"#ede8dc",borderRadius:8,padding:"12px 16px",border:"1px solid #d4c9b4"}}>
                    <div style={{fontSize:9,color:"#7a6e5f",letterSpacing:1.5,marginBottom:4}}>{k.toUpperCase()}</div>
                    <div style={{fontSize:14,color:"#1a1208",fontWeight:600}}>{v}</div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* YÖNETİM */}
          {sekme==="yonetim" && user?.role==="editor" && (
            <YonetimSekme articles={articles} users={users} toast_={toast_} loadArticles={loadArticles}/>
          )}

          {/* HAKEM */}
          {sekme==="hakem" && (user?.role==="hakem"||user?.role==="yazar-hakem") && (
            <HakemSekme user={user} toast_={toast_}/>
          )}
        </div>
      </div>
    </div>
  );
}
